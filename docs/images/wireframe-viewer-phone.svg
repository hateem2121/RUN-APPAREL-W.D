<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" role="img" aria-labelledby="t d">
  <title id="t">Drawing of the 3D viewer on a phone, with its four parts numbered</title>
  <desc id="d">1: the 3D garment, which you drag to turn and pinch to zoom. 2: buttons to jump to the front, back or side. 3: one button per colour. 4: buttons to email or WhatsApp RUN about this product.</desc>
  <!-- Solid Paper & Ink colours (packages/ui/src/tokens.css) so the drawing reads the
       same on GitHub's light and dark themes. -->
  <rect width="360" height="720" fill="#f1efea"/>
  <rect x="12" y="8" width="336" height="704" rx="34" fill="#faf9f6" stroke="#1d1f1a" stroke-width="3"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1d1f1a">
    <!-- Header -->
    <rect x="96" y="22" width="168" height="40" rx="12" fill="#1d1f1a"/>
    <text x="112" y="47" font-size="13" font-weight="700" fill="#f1efea" font-family="system-ui, -apple-system, Segoe UI, sans-serif">RUN APPAREL</text>
    <circle cx="244" cy="42" r="13" fill="#cdf345"/>
    <rect x="102" y="70" width="156" height="18" rx="4" fill="#cdf345"/>
    <text x="180" y="83" font-size="10" text-anchor="middle">[ 3D PRODUCT REFERENCE ]</text>
    <text x="28" y="108" font-size="10" fill="#63665b">PRODUCT CODE · GARMENT NAME</text>

    <!-- 1: 3D stage -->
    <rect x="28" y="118" width="304" height="266" rx="12" fill="#f1efea" stroke="#1d1f1a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <path d="M150 150 l-44 22 l14 34 l18 -8 v120 h84 v-120 l18 8 l14 -34 l-44 -22 q-30 18 -60 0 z" fill="#e4e1d8" stroke="#1d1f1a" stroke-width="1.5"/>
    <text x="180" y="358" font-size="11" text-anchor="middle">DRAG TO TURN · PINCH TO ZOOM</text>
    <circle cx="48" cy="138" r="12" fill="#1d1f1a"/>
    <text x="48" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#cdf345">1</text>

    <!-- 2: front / back / side -->
    <rect x="90" y="398" width="180" height="32" rx="16" fill="#faf9f6" stroke="#1d1f1a" stroke-width="1.5"/>
    <rect x="92" y="400" width="60" height="28" rx="14" fill="#1d1f1a"/>
    <text x="122" y="418" font-size="10" text-anchor="middle" fill="#cdf345">FRONT</text>
    <text x="180" y="418" font-size="10" text-anchor="middle">BACK</text>
    <text x="238" y="418" font-size="10" text-anchor="middle">SIDE</text>
    <circle cx="68" cy="414" r="12" fill="#1d1f1a"/>
    <text x="68" y="418" font-size="12" font-weight="700" text-anchor="middle" fill="#cdf345">2</text>

    <!-- 3: colour buttons -->
    <g stroke="#1d1f1a" stroke-width="1.2">
      <rect x="28" y="444" width="56" height="46" rx="8" fill="#1d1f1a"/>
      <rect x="90" y="444" width="56" height="46" rx="8" fill="#faf9f6"/>
      <rect x="152" y="444" width="56" height="46" rx="8" fill="#faf9f6"/>
      <rect x="214" y="444" width="56" height="46" rx="8" fill="#faf9f6"/>
      <rect x="276" y="444" width="56" height="46" rx="8" fill="#faf9f6"/>
      <circle cx="56" cy="460" r="7" fill="#7a2e35"/>
      <circle cx="118" cy="460" r="7" fill="#f2c4c8"/>
      <circle cx="180" cy="460" r="7" fill="#f6f0b8"/>
      <circle cx="242" cy="460" r="7" fill="#8fd35c"/>
      <circle cx="304" cy="460" r="7" fill="#1d1f1a"/>
    </g>
    <text x="56" y="482" font-size="8" text-anchor="middle" fill="#cdf345">COLOUR</text>
    <text x="118" y="482" font-size="8" text-anchor="middle">COLOUR</text>
    <text x="180" y="482" font-size="8" text-anchor="middle">COLOUR</text>
    <text x="242" y="482" font-size="8" text-anchor="middle">COLOUR</text>
    <text x="304" y="482" font-size="8" text-anchor="middle">COLOUR</text>
    <circle cx="28" cy="444" r="12" fill="#1d1f1a" stroke="#faf9f6" stroke-width="2"/>
    <text x="28" y="448" font-size="12" font-weight="700" text-anchor="middle" fill="#cdf345">3</text>

    <!-- Labels -->
    <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5">
      <text x="28" y="516"><tspan font-weight="700">1</tspan>  The garment in 3D. Drag it to turn it.</text>
      <text x="28" y="536"><tspan font-weight="700">2</tspan>  Jump to the front, back or side.</text>
      <text x="28" y="556"><tspan font-weight="700">3</tspan>  One button for each colour.</text>
      <text x="28" y="576"><tspan font-weight="700">4</tspan>  Ask RUN about this product.</text>
    </g>

    <!-- 4: contact bar -->
    <line x1="12" y1="610" x2="348" y2="610" stroke="#1d1f1a" stroke-opacity="0.25"/>
    <rect x="28" y="628" width="146" height="48" rx="10" fill="#1d1f1a"/>
    <text x="101" y="657" font-size="12" text-anchor="middle" fill="#cdf345">EMAIL US</text>
    <rect x="186" y="628" width="146" height="48" rx="10" fill="#faf9f6" stroke="#1d1f1a" stroke-width="1.5"/>
    <text x="259" y="657" font-size="12" text-anchor="middle">WHATSAPP US</text>
    <circle cx="28" cy="628" r="12" fill="#1d1f1a" stroke="#faf9f6" stroke-width="2"/>
    <text x="28" y="632" font-size="12" font-weight="700" text-anchor="middle" fill="#cdf345">4</text>
  </g>
</svg>
