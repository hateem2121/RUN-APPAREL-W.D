<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- N6, 2026-08-18. The mobile browser chrome — the strip around the clock and
         battery — ignored the light/dark toggle and stayed a default grey, while
         this page ships a toggle and sets `color-scheme` in six places.

         Values are `--bg` from src/styles/tokens.css, which is the SOURCE OF
         TRUTH; docs/DESIGN.md is written from it and loses if the two disagree.
         Duplicated here because <meta> cannot read a custom property, and pinned
         by an e2e assertion so the duplicate cannot drift silently.

         `media` follows the OPERATING SYSTEM preference and cannot see
         `data-theme`, which is what the in-page toggle sets. The inline script
         below keeps these in step when the visitor has made an explicit choice. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1efea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1f18" />
    <meta
      name="description"
      content="RUN APPAREL — interactive 3D product reference for B2B partners. Rotate, zoom and explore colourways of this development reference."
    />
    <title>RUN APPAREL — 3D Product Reference</title>

    <!-- Link previews (Open Graph / Twitter cards).
         Added 2026-08-08. Before this, a viewer link pasted into WhatsApp, email
         or LinkedIn unfurled as a bare URL with no image — measured, not assumed:
         the head carried only charset, viewport, description and title.

         THESE ARE THE FALLBACK, NOT WHAT A CRAWLER USUALLY SEES. Later the same
         day, apps/viewer/worker/index.ts started overwriting every value below
         per request, with the garment and colourway the link actually points at.
         These static tags are what remains when it cannot: the homepage (which
         matches an asset, so the Worker is never invoked), an unknown product, or
         a CMS outage. Keep them working — they are the floor.

         ⚠️ EVERY TAG BELOW THAT THE WORKER OVERWRITES MUST STAY PRESENT. An
         HTMLRewriter selector that matches nothing is a silent no-op, not an
         error: delete one of these and the Worker keeps returning 200 while
         quietly ceasing to set it on every link. worker/preview.test.ts asserts
         each one is still here.

         NOT SET, deliberately: `og:url` and <link rel="canonical">. A static value
         for either would declare that /n001/wine IS the homepage, which is worse
         than saying nothing — it invites crawlers to collapse every colourway into
         one page. Both are per-page values or they are wrong, which is why the
         Worker APPENDS them per request rather than overwriting them here.

         og:image is a real render of the shipped garment (N001 wine, the default
         colourway), 1200x1500 with its own "[ N001 / WINE ]" caption baked in.
         Portrait rather than the 1.91:1 card ratio: platforms that letterbox
         (WhatsApp, iMessage, Slack) keep the caption, and platforms that
         centre-crop land on the chest wordmark, which is the detail worth showing.
         Regenerate with: sips -s format jpeg output/posters/n001-wine-poster.webp
           --out apps/viewer/public/og-default.jpg -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RUN APPAREL" />
    <meta property="og:title" content="RUN APPAREL — 3D Product Reference" />
    <meta
      property="og:description"
      content="Interactive 3D garment reference for B2B partners. Rotate, zoom and switch colourways."
    />
    <meta property="og:image" content="https://viewer.wear-run.help/og-default.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1500" />
    <meta
      property="og:image:alt"
      content="The RUN APPAREL X-MILO PRO SKIN-SUIT in wine, shown front-on."
    />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RUN APPAREL — 3D Product Reference" />
    <meta
      name="twitter:description"
      content="Interactive 3D garment reference for B2B partners. Rotate, zoom and switch colourways."
    />
    <meta name="twitter:image" content="https://viewer.wear-run.help/og-default.jpg" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23CDF345'/%3E%3Ctext x='16' y='23' font-family='Archivo,system-ui,sans-serif' font-size='20' font-weight='900' text-anchor='middle' fill='%231D1F1A'%3ER%3C/text%3E%3C/svg%3E"
    />

    <!--
      The whole critical path runs through these two hosts and neither had a
      hint: cms.wear-run.help serves the product payload (measured 1.77-2.27s to
      first byte) and media.wear-run.help serves the 27 MB model. Each paid DNS +
      TCP + TLS serially at the moment it was first needed, on a phone that has
      just scanned a QR tag.

      ⚠️ `crossorigin` is REQUIRED on both, and it is the half that gets dropped.
      Both are CORS requests — fetchWithProgress reads content-length, and the
      payload fetch is a plain cross-origin GET. A preconnect WITHOUT the
      attribute opens a connection in the wrong credentials mode, so the browser
      opens a second one when the real request arrives: strictly worse than no
      hint at all. apps/viewer/scripts/preload.test.ts pins both halves.
    -->
    <link rel="preconnect" href="https://cms.wear-run.help" crossorigin />
    <link rel="preconnect" href="https://media.wear-run.help" crossorigin />
    <script>
      // Apply the persisted theme before first paint (no flash of wrong mode).
      ;(() => {
        try {
          const stored = localStorage.getItem('run-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
            // N6: the theme-color tags above are scoped by prefers-color-scheme,
            // so they follow the OS and cannot see this explicit choice. Point
            // them at it. Extended here rather than added as a second inline
            // block, because the CSP is hash-based with no unsafe-inline for
            // scripts and a new block is a new hash for gen-headers to carry.
            // (Written without the tag literal on purpose: themeColor.test.ts
            // counts them, and a comment naming one is a false positive.)
            const chosen = stored === 'light' ? '#f1efea' : '#1c1f18'
            for (const tag of document.querySelectorAll('meta[name="theme-color"]')) {
              tag.setAttribute('content', chosen)
              tag.removeAttribute('media')
            }
          }
        } catch {
          /* storage unavailable — system preference applies */
        }
      })()
    </script>
    <!-- Web Analytics: embedded manually, never via Automatic Setup. Why, and why
         type=module: scripts/csp.mjs. Token is a public site tag, not a secret. -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "cfd98c6043ce4fd2a594010af6b80c75"}'
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
