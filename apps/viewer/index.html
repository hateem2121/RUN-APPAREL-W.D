<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- N6, 2026-08-18. The mobile browser chrome — the strip around the clock and
         battery — ignored the light/dark toggle and stayed a default grey, while
         this page ships a toggle and sets `color-scheme` in six places.

         Values are `--bg` from packages/ui/src/tokens.css, which is the SOURCE OF
         TRUTH; docs/DESIGN.md is written from it and loses if the two disagree.
         Duplicated here because <meta> cannot read a custom property, and pinned
         by scripts/themeColor.test.ts so the duplicate cannot drift silently.

         VA-50 (2026-10-01): on a phone the bar's own colour, `--notch-bg`
         (light-dark(var(--ink), var(--raised))), from the two tags that come FIRST,
         because the first tag whose media matches wins and a phone matches both.
         "A phone" is the status-area strip's query in packages/ui/src/notch.css.
         Safari 26 and 27 ignore these tags (the strip is for them); Android
         Chrome reads them.

         `media` follows the OPERATING SYSTEM preference and cannot see
         `data-theme`, which is what the in-page toggle sets. The inline script
         below keeps these in step when the visitor has made an explicit choice. -->
    <meta name="theme-color" media="(prefers-color-scheme: light) and (width < 720px) and (hover: none)" content="#1d1f1a" />
    <meta name="theme-color" media="(prefers-color-scheme: dark) and (width < 720px) and (hover: none)" content="#363c2f" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1efea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1f18" />
    <meta
      name="description"
      content="RUN APPAREL — interactive 3D product reference for B2B partners. Rotate, zoom and explore colorways of this development reference."
    />
    <title>RUN APPAREL — 3D Product Reference</title>

    <!-- Link previews (Open Graph / Twitter cards).
         Added 2026-08-08. Before this, a viewer link pasted into WhatsApp, email
         or LinkedIn unfurled as a bare URL with no image — measured, not assumed:
         the head carried only charset, viewport, description and title.

         THESE ARE THE FALLBACK, NOT WHAT A CRAWLER USUALLY SEES. Later the same
         day, apps/viewer/worker/index.ts started overwriting every value below
         per request, with the garment and colourway the link actually points at.
         These static tags are what remains when it cannot: the homepage (which
         matches an asset, so the Worker is never invoked), an unknown product, or
         a CMS outage. Keep them working — they are the floor.

         ⚠️ EVERY TAG BELOW THAT THE WORKER OVERWRITES MUST STAY PRESENT. An
         HTMLRewriter selector that matches nothing is a silent no-op, not an
         error: delete one of these and the Worker keeps returning 200 while
         quietly ceasing to set it on every link. worker/preview.test.ts asserts
         each one is still here.

         NOT SET, deliberately: `og:url` and <link rel="canonical">. A static value
         for either would declare that /n001/wine IS the homepage, which is worse
         than saying nothing — it invites crawlers to collapse every colourway into
         one page. Both are per-page values or they are wrong, which is why the
         Worker APPENDS them per request rather than overwriting them here.

         og:image is the rxps/wine garment card (the default colourway), the owner's
         uploaded render: 1200x630, the whole garment on the paper ground, the same
         shape as every garment card since 2026-10-25 (tools/asset-pipeline/scripts/
         og-cards.mjs says why: a tall card was cut to a band of torso by wide apps).
         Regenerate with: cp apps/viewer/public/og/rxps/wine.jpg apps/viewer/public/og-default.jpg -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RUN APPAREL" />
    <meta property="og:title" content="RUN APPAREL — 3D Product Reference" />
    <meta
      property="og:description"
      content="Interactive 3D garment reference for B2B partners. Rotate, zoom and switch colorways."
    />
    <meta property="og:image" content="https://wear-run.com/og-default.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The RUN APPAREL X-MILO PRO SKIN-SUIT in Claret Red, shown front-on."
    />
    <!-- en_US, like the website's cards (apps/cms/src/lib/seo.ts, FA-Q-06): the page uses American
         spelling. en_GB until 2026-10-26 (owner, site check). -->
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RUN APPAREL — 3D Product Reference" />
    <meta
      name="twitter:description"
      content="Interactive 3D garment reference for B2B partners. Rotate, zoom and switch colorways."
    />
    <meta name="twitter:image" content="https://wear-run.com/og-default.jpg" />

    <!--
      ⚠️ THE DATA URI ABOVE IS KEPT AS THE PRIMARY ICON ON PURPOSE — it paints with
      zero requests. What it could never do is answer `/favicon.ico`, which every
      browser asks for unbidden whatever the document declares. Measured live
      2026-09-05, before the file existed:

          GET /favicon.ico -> 200, content-type: text/html, 10,046 bytes

      Ten kilobytes of HTML labelled as a web page, in answer to a request for an
      icon — a soft 404 to a crawler, and on the crawler path it also burned a CMS
      service-binding fetch that could only fail. `public/favicon.ico` now exists,
      so Static Assets serves it and the Worker is never invoked for it.

      `/favicon.ico` needs no <link>: it is requested by convention. The Apple touch
      icon does need one, and it cannot be a data URI — iOS reads a real file when a
      buyer adds a garment page to their home screen.

      All three files are generated from the SVG above by
      apps/viewer/scripts/gen-favicon.mjs, so the mark cannot drift between them.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      The whole critical path runs through these two hosts and neither had a
      hint: cms.wear-run.help serves the product payload and media.wear-run.com
      serves the model. Each paid DNS + TCP + TLS serially at the moment it was
      first needed, on a phone that had just scanned a QR tag.

      ⚠️ THE NUMBERS THAT USED TO BE IN THIS PARAGRAPH WERE STALE BY A FACTOR OF
      THREE AND SEVEN, and they were quoted elsewhere as if current. It said the
      payload took "1.77-2.27s to first byte" and the model was "27 MB". Both were
      true when written (2026-08-08) and neither survived the work since:

          payload TTFB   1.77-2.27s  ->  0.56-0.72s   (measured across all 11
                                                       live products 2026-09-04)
          model size        ~27 MB   ->  1.8-7.8 MB   (every live GLB, same day)

      The hint is still correct and still earns its place — a serial DNS+TCP+TLS
      round trip costs the same regardless of what arrives afterwards. But a
      measurement with a date is a fact, and one without is folklore: re-measure
      before quoting these anywhere else.

      ⚠️ `crossorigin` is REQUIRED on both, and it is the half that gets dropped.
      Both are CORS requests — fetchWithProgress reads content-length, and the
      payload fetch is a plain cross-origin GET. A preconnect WITHOUT the
      attribute opens a connection in the wrong credentials mode, so the browser
      opens a second one when the real request arrives: strictly worse than no
      hint at all. apps/viewer/scripts/preload.test.ts pins both halves.
    -->
    <link rel="preconnect" href="https://cms.wear-run.help" crossorigin />
    <link rel="preconnect" href="https://media.wear-run.com" crossorigin />
    <!-- Polish MO3: inline on purpose, and this note short on purpose (page.css, `.preloader`). -->
    <style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
    <link rel="expect" href="#root" blocking="render" />
    <!--
      The meshopt decoder and the lighting map are preloaded by the APP, not here, since
      RO-08 (2026-09-25): src/lib/preload3d.ts, called from main.tsx right after mount. As
      tags here they shared slow 3G with the one stylesheet the loading screen waits for,
      and they were fetched even on Save-Data, where no 3D is drawn.
    -->
    <script>
      // Apply the persisted theme before first paint (no flash of wrong mode).
      ;(() => {
        try {
          const stored = localStorage.getItem('run-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
            // N6: the theme-color tags above are scoped by prefers-color-scheme,
            // so they follow the OS and cannot see this explicit choice. Point
            // them at it. Extended here rather than added as a second inline
            // block, because the CSP is hash-based with no unsafe-inline for
            // scripts and a new block is a new hash for gen-headers to carry.
            // (Written without the tag literal on purpose: themeColor.test.ts
            // counts them, and a comment naming one is a false positive.)
            // Only the colour changes, never `media` (VA-50): the phone tags must
            // keep matching phones only, and each media value must stay unique.
            const page = stored === 'light' ? '#f1efea' : '#1c1f18'
            const phone = stored === 'light' ? '#1d1f1a' : '#363c2f'
            for (const tag of document.querySelectorAll('meta[name="theme-color"]')) {
              const onPhone = (tag.getAttribute('media') || '').includes('(hover: none)')
              tag.setAttribute('content', onPhone ? phone : page)
            }
          }
        } catch {
          /* storage unavailable — system preference applies */
        }
      })()
    </script>
    <!-- Web Analytics: embedded manually, never via Automatic Setup. Why, and why
         type=module: scripts/csp.mjs. Token is a public site tag, not a secret.
         The wear-run.com site's since the domain move (2026-09-28): Cloudflare drops a
         visit whose page is not on the token's own domain (docs/CLOUDFLARE-SETUP.md 11.9). -->
    <!-- Since 2026-10-08 a loader adds the beacon only for a browser that is not automated
         (packages/shared/src/analyticsBeacon.ts; the token goes in the address, Cloudflare's form
         for a script-added beacon). It is beaconLoader('17250268831a423ea902fe766fa5feed'),
         character for character: src/analyticsBeacon.test.ts fails if the two differ.
         A CLASSIC script, not type="module": Vite moves an inline module script into the
         bundle, out of this page, where neither the early start nor the beacon probe sees it. -->
    <script>if(!navigator.webdriver&&!/HeadlessChrome|Chrome-Lighthouse/.test(navigator.userAgent)){const b=document.createElement('script');b.type='module';b.src="https://static.cloudflareinsights.com/beacon.min.js?token=17250268831a423ea902fe766fa5feed";document.head.append(b)}</script>
  </head>
  <body>
    <!--
      VA-56 (visual audit, 2026-10-02): with scripts off this message is all a visitor gets, and two
      things were wrong with it. The loading screen below is drawn over the whole screen and, without
      a script, nothing ever takes it away, so it covered the message and said "PREPARING…" for ever:
      page.css now hides it when scripting is off (`@media (scripting: none)`). And the message sat
      outside every landmark (an AccessLint finding): it is inside a main element now. With scripts
      on, the browser treats the content of this block as text, not as elements (MDN), so the app's
      own main element is the only one.
    -->
    <noscript>
      <main>
        <p style="margin: 2rem; max-width: 36rem; font: 1rem/1.5 system-ui, sans-serif">
          This 3D garment reference needs JavaScript. Turn it on to see the garment, or contact
          RUN APPAREL at <a href="https://wear-run.com/contact">wear-run.com/contact</a>.
        </p>
      </main>
    </noscript>

      until React's own code had downloaded and run: 6.9 s median on the live viewer
      (5 runs, 2026-09-25, Chrome's Slow 3G profile). This is the markup Preloader.tsx
      renders, so the first paint needs only this file and the one stylesheet; createRoot
      replaces it with the identical component the moment the app starts.
      apps/viewer/src/components/staticPreloader.test.tsx renders the component and fails
      if this copy ever differs from it.
    -->
    <div id="root"><div class="preloader"><div class="preloader__sheet"><div class="preloader__grid blueprint" aria-hidden="true"></div><div class="preloader__inner"><span class="visually-hidden">Loading the product reference.</span><span class="label" aria-hidden="true">[ 3D PRODUCT REFERENCE ]</span><span class="preloader__rule preloader__rule--indeterminate" aria-hidden="true"><svg class="loom-mark" viewBox="0 0 8000 2767" aria-hidden="true"><defs><g id="opening-loom-m"><path d="M2722,0 L0,0 L4,755 L1927,755 L1929,758 L1928,1836 L6,1837 L9,2766 L994,2766 L2722,1082 Z"></path><path d="M2141,1837 L1928,2045 L1928,2766 L2722,2766 L2722,1837 Z"></path><path d="M5743,0 L4700,0 L4700,2010 L4698,2012 L3936,2011 L3936,88 L2959,1040 L2959,2766 L3964,2766 L5723,1052 L5743,1031 Z"></path><path d="M7999,0 L6995,0 L5248,1702 L5215,1736 L5215,2766 L6259,2766 L6258,757 L6260,755 L7031,756 L7032,2766 L7999,1761 Z"></path></g><clipPath id="opening-loom-0"><rect class="loom-mark__pick loom-mark__pick--0" x="0" y="0" width="8000" height="594"></rect></clipPath><clipPath id="opening-loom-1"><rect class="loom-mark__pick loom-mark__pick--1" x="0" y="554" width="8000" height="594"></rect></clipPath><clipPath id="opening-loom-2"><rect class="loom-mark__pick loom-mark__pick--2" x="0" y="1108" width="8000" height="594"></rect></clipPath><clipPath id="opening-loom-3"><rect class="loom-mark__pick loom-mark__pick--3" x="0" y="1662" width="8000" height="594"></rect></clipPath><clipPath id="opening-loom-4"><rect class="loom-mark__pick loom-mark__pick--4" x="0" y="2216" width="8000" height="591"></rect></clipPath></defs><use class="loom-mark__bed" href="#opening-loom-m"></use><g clip-path="url(#opening-loom-0)"><use href="#opening-loom-m"></use></g><g clip-path="url(#opening-loom-1)"><use href="#opening-loom-m"></use></g><g clip-path="url(#opening-loom-2)"><use href="#opening-loom-m"></use></g><g clip-path="url(#opening-loom-3)"><use href="#opening-loom-m"></use></g><g clip-path="url(#opening-l
