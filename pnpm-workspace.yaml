packages:
  - apps/*
  - packages/*
  - tools/*

# Supply-chain hardening: refuse to resolve dependency versions younger than
# this many minutes (1440 = 24h) so a freshly-published, potentially compromised
# release is not adopted the instant it lands — a window that catches the
# highest-risk same-day-compromise case. Enforced only when the lockfile is
# (re)resolved — a `pnpm add` or a Dependabot bump — so `--frozen-lockfile`
# installs (CI, deploy) are never affected. This policy was previously enforced
# by a machine-global config (which is what blocked adopting a brand-new pnpm
# 11); pinning it in-repo makes it explicit, shared and version-controlled.
#
# Why 24h and not longer: this graph pulls many fast-moving transitives (Vite's
# lightningcss/esbuild, Payload's monaco-editor, …); a multi-day window blocks
# nearly every re-resolve on whatever happens to be freshest, without real
# added protection. Raise it if you accept more friction — the exclude below and
# pnpm's on-block hint make occasional blocks easy to clear.
minimumReleaseAge: 1440
# Exempt fast-moving, trusted build-toolchain platform binaries (Vite's
# lightningcss + esbuild). The cooldown still fully covers application
# dependencies — where a supply-chain attack actually matters. If a
# `pnpm add`/update is ever blocked by another too-fresh transitive, add it here.
minimumReleaseAgeExclude:
  - lightningcss
  - 'lightningcss-*'
  - esbuild
  - '@esbuild/*'

# trustPolicy: no-downgrade (pnpm 10.21+; added 2026-11-09 after the post-audit review).
# Refuse to resolve a version published with WEAKER trust evidence than earlier versions
# of the same package — the registry-account-compromise defense: a hijacked account can
# publish from a fresh session with no provenance where every prior release had it, and
# this refuses that version however long it waits out the cooldown above. pnpm documents
# it at pnpm.io/supply-chain-security (read 2026-11-09); this graph's pnpm is 12.15.0.
# If it ever blocks a legitimate re-resolve, the block prints the package and reason, and
# a one-off trustPolicyExclude entry (dated, like everything here) is the escape hatch.
trustPolicy: no-downgrade
# trustPolicyIgnoreAfter: 20160 (14 days), measured 2026-11-09. Without it, no-downgrade
# rejects this lockfile's own legacy entries — the four it flagged were published
# 2023-07-10 (semver 5.7.2 and 6.3.1), 2025-10-18 (pino 9.14.0) and 2026-10-07
# (chromium-bidi 157.0.8090-0), every one long before the policy existed, each audited
# clean for months (ERR_PNPM_TRUST_DOWNGRADE, measured 2026-11-09). Fourteen days keeps
# the downgrade check active for every fresh publication — the only place a takeover can
# appear — while exempting the established lockfile. Raise it only with the same kind of
# measurement.
trustPolicyIgnoreAfter: 20160

# Moved here from package.json's `pnpm` field on 2026-09-26 for pnpm 12: from
# pnpm 11 on, that field is NOT READ AT ALL — left in place, all 27 security
# overrides below would silently stop applying while every install still
# succeeded. The lockfile's own `overrides:` block records what was applied, and
# a frozen install refuses to run when the two disagree, so it is the check.
# Each pin's reason lives in audit-ci.jsonc and docs/DEPENDENCY-HOLDS.md.
overrides:
  sharp: 0.35.5
  tmp: ^0.2.4
  # vite 8.3.5 declares postcss ^8.5.30; an override REPLACES a dependency's own range, so the old
  # floor (^8.5.23) let the lockfile keep 8.5.28 under it (measured 2026-10-24).
  postcss: ^8.5.30
  dompurify: ^3.4.17
  brace-expansion@1: ^1.1.20
  brace-expansion@2: ^2.1.6
  brace-expansion@5: ^5.0.11
  undici: ^7.30.1
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
  '@lhci/cli>uuid': ^11.1.1
  fast-uri: ^3.1.9
  ip-address: ^10.7.4
  # ^6.16.1 since 2026-10-27: GHSA-6pq8-jhm2-2vcw (stringify DoS, published that day) covers
  # 6.7.0-6.16.0; the only path is @lhci/cli>express>qs, a CI tool.
  qs: ^6.16.1
  js-yaml@3: ^3.15.2
  js-yaml@4: ^4.3.2
  baseline-browser-mapping: ^2.11.0
  nanoid: ^3.3.18
  basic-ftp: ^6.2.1
  lodash-es: ^4.18.0
  proxy-addr: ^2.0.8
  compression: ^1.8.2
  source-map-js: ^1.2.2
  # ^14.0.3 since 2026-11-04: GHSA-3g3m-2fjr-6pw4 (an aborted walk kept reading) covers 9.0.0-14.0.1,
  # and GHSA-g3hv-75wg-m249 (minimatch DoS) everything under 11.0.1, so no 10.x or 13.x is safe.
  # The callers (OpenNext, @node-minify/core, Sentry's bundler plugin) use only glob()/globSync().
  # glob@7 (rimraf 3 under @lhci/cli, a CI tool) is outside the glob range and needs minimatch 3.
  glob@10: ^14.0.3
  glob@13: ^14.0.3
  minimatch@9: ^11.0.4
  minimatch@10: ^11.0.4
  body-parser@1: ^1.20.9
  body-parser@2: ^2.4.0
  zod@4: ^4.6.6
  happy-dom: ^21.0.4
  # GHSA-x8rm-f576-gq67: registry range includes Payload's old, linear-regex 1.22.2.
  # Only this parent uses the package; its two imported scalars are compatible with 2.0.1.
  # Evidence and removal condition: docs/DEPENDENCY-HOLDS.md (2026-10-29).
  '@payloadcms/graphql>graphql-scalars': 2.0.1

# Which dependencies may run install scripts (pnpm 11 replaced
# `onlyBuiltDependencies` with this map). `true` = allowed, the same four that
# were allowed before. pnpm 11+ FAILS an install when a package with an install
# script is in neither list, where pnpm 10 skipped it with a warning.
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  sharp: true
  workerd: true

# One local patch, to a library's own source. @google/model-viewer prints debug messages through
# console.log ("[$updateSource] BAILING OUT EARLY!" and the like): nine of them in 4.3.1, six on
# every garment visit, on the garment pages and the website's home page alike (visual audit VA-10,
# 2026-10-02). 4.4.0 (2026-10-09, its #5182) removed eight of the nine itself; the one left is
# "could not acquire 2d context" in lib/three-components/Renderer.js, so the patch is now that one
# statement, turned into a one-line comment: no line moves, so the library's shipped source maps
# stay aligned, and its console.warn and console.error (real problem reports) and everything of
# three.js are untouched.
# Why a patch and not a bundler rule: pnpm documents it (pnpm.io/cli/patch); Next.js documents
# removeConsole for "application code (not node_modules)" with no per-package form; a Turbopack
# loader would cover the website only, and the garment pages build with Vite. One patch reaches
# every bundler, both apps and the render harness, and cannot be lost quietly: a frozen install
# refuses to run when this entry and the lockfile's own `patchedDependencies:` block disagree
# (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH, measured 2026-10-02). It is pinned to this exact version:
# installing another one fails with ERR_PNPM_UNUSED_PATCH (measured 2026-10-02, pnpm 12.6.0), so an
# upgrade cannot skip it either. How to redo it, and when to delete it: docs/DEPENDENCY-HOLDS.md.
# apps/cms/src/modelViewerQuiet.test.ts guards it.
patchedDependencies:
  '@google/model-viewer@4.4.0': patches/@google__model-viewer@4.4.0.patch
