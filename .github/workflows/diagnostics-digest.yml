name: Diagnostics digest

# Read the diagnostics the viewer already records, once a week.
#
# WHY THIS EXISTS. The Events table has been collecting real failures since
# 2026-07-21 and nothing has ever read it. As of the 2026-08-03 audit it held
# 8 × model-load-error, 13 × variant-missing and an uncaught React error from
# genuine visitor sessions — every one of them a buyer who did not see a
# garment, and none of them known to anybody.
#
# The viewer is careful to report why it broke (see apps/viewer/src/lib/diagnostic.ts,
# written precisely so failures stop being invisible). That only pays off if
# somebody looks. This is the looking.
#
# Weekly, not daily: these are trends, not outages. uptime.yml covers "is it up".

on:
  schedule:
    - cron: '17 8 * * 1' # Mondays, 08:17 UTC
  workflow_dispatch:

# `contents: read` is NOT optional here, and leaving it out is the exact bug that
# took the uptime monitor down for ~23 hours on 2026-08-05 (see uptime.yml and
# 9c8e883). A `permissions:` block REPLACES the default token grants rather than
# adding to them, so listing only `issues: write` sets `contents` to `none`, and
# `actions/checkout` on a PRIVATE repo then fails with "Repository not found" —
# GitHub answers 404, not 403, so it reads as a deleted repo rather than a
# permissions problem.
#
# This file shipped with that defect in f1a48eb and kept it when uptime.yml was
# fixed, because the fix was applied to the file that had visibly broken rather
# than to the pattern. Worth stating plainly: this job is the ONLY thing that
# reads the Events table, so while it was failing at checkout, every
# `model-load-error` and `variant-missing` from a real visitor was recorded
# correctly and read by nobody — which is the precise condition this workflow was
# written to end.
permissions:
  contents: read
  issues: write

jobs:
  digest:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ⚠️ STEP ONE OF TWO, AND THE ORDER IS LOAD-BEARING. This job reads
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, which are still REPO-level
    # secrets, so declaring the environment changes nothing today. Once every job
    # that uses them declares it, the secrets move into the environment. Done the
    # other way round, the secret resolves to an EMPTY STRING here and this job
    # fails at the first wrangler call — silently, on a schedule, at night.
    #
    # ⚠️ AND IT WAS HALF-DONE UNTIL 2026-08-30: ci.yml's and deploy-shrink.yml's
    # `deploy` jobs already declared it, but this one and the other scheduled job
    # did not — so moving the secrets would have taken out the backup and the
    # weekly digest while the deploys carried on looking fine.
    environment: production
    env:
      # Stays at job level: it is the workflow's OWN scoped token, not a production
      # credential, and several steps use it. The two Cloudflare secrets that used to
      # sit here are now scoped to the two steps that need them — see below.
      GH_TOKEN: ${{ github.token }}
    steps:
      # Aligned to the versions every other workflow here already proves in
      # production: ci.yml, deploy-shrink.yml and nightly-backup.yml all run green
      # on checkout@v7 + setup-node@v7. This file had drifted to v5/v6.
      #
      # ⚠️ READ THIS IF THE FIRST RUN FAILS. This bump landed on 2026-08-10 while
      # the workflow still had NO successful run on record — its first scheduled
      # slot (08:17 UTC that Monday) had not yet been delivered, GitHub having
      # throttled this repo's schedules to ~27% of their configured rate. The
      # ordering was deliberately the other way round (verify green, then bump) and
      # was overridden knowingly. So if the first run fails there are TWO
      # candidates, not one: this version bump, and whatever pre-existing fault the
      # workflow may still carry from never having executed end to end. Check the
      # pre-existing one first — the D1 read step and the CLOUDFLARE_API_TOKEN's
      # permission to run `wrangler d1 execute --remote` have never been exercised.
      # Reverting these two lines to v5/v6 is the cheap way to separate them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # ⚠️ NO CACHE: this job reads production D1 with the Cloudflare token. The
          # same two lines in ci.yml's `deploy` job say why a restored pnpm store does
          # not belong in a job that holds a production credential.
          cache: ''
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      # Diagnostics and errors only. `analytics` rows are the healthy path and
      # would drown the signal.
      # ⚠️ SCOPED TO THE STEPS THAT NEED IT, 2026-08-30. These two variables sat in
      # a JOB-level `env:` block, which put a token able to edit Workers, D1 and R2
      # into the environment of EVERY step — including `pnpm install
      # --frozen-lockfile`, where a malicious postinstall script in any transitive
      # dependency could simply read it. `minimumReleaseAge: 1440` in
      # pnpm-workspace.yaml narrows that window; it does not close it, and there is
      # no reason for the installer to see a production credential at all.
      #
      # ⚠️ THREE THINGS THIS QUERY GOT WRONG IN ITS FIRST PUBLIC ISSUE (#5, 2026-09-11).
      # apps/cms/src/diagnosticsDigest.test.ts runs this exact SQL against SQLite:
      #   - 371 of 385 rows were ONE scripted audit of ours, and nothing said so.
      #     `browsers` counts distinct user-agents now, and `run-apparel-` ones (our
      #     own tools, which the events endpoint also drops at intake) are left out.
      #   - 17 of 19 client_error rows were `ResizeObserver loop…`, a notice Sentry
      #     already ignores as harmless (apps/viewer/src/lib/sentry.ts). Left out too,
      #     through coalesce(), so an error that arrived with NO message still counts.
      #   - created_at is ISO, with a `T`. datetime('now', …) prints a SPACE there, and
      #     `T` sorts after a space, so every row on the cutoff DATE passed whatever its
      #     time. strftime() keeps the `T`.
      - name: Read the last 7 days of diagnostics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: read
        run: |
          set -euo pipefail
          pnpm --filter @run-apparel/cms exec wrangler d1 execute run-apparel-viewer-db --remote \
            --json --command "SELECT type, event, product, variant, count(*) AS n, count(DISTINCT ua) AS browsers, max(created_at) AS latest FROM events WHERE type IN ('diagnostic','error') AND created_at > strftime('%Y-%m-%dT%H:%M:%fZ','now','-7 days') AND (ua IS NULL OR ua NOT LIKE '%run-apparel-%') AND NOT (event = 'client_error' AND coalesce(message, '') LIKE 'ResizeObserver loop%') GROUP BY type, event, product, variant ORDER BY n DESC LIMIT 50;" \
            > digest.json
          # `.[0].results` is wrangler's shape; empty means a clean week.
          rows=$(node -e "const d=require('./digest.json');console.log((d[0]?.results??[]).length)")
          echo "rows=$rows" >> "$GITHUB_OUTPUT"
          {
            echo 'table<<DIGEST'
            node -e "
              const d = require('./digest.json');
              const rows = d[0]?.results ?? [];
              if (!rows.length) { console.log('No diagnostics recorded in the last 7 days.'); process.exit(0) }
              // THESE VALUES ARE ATTACKER-CONTROLLED. apps/cms/src/endpoints/events.ts
              // allowlists event names ONLY for type 'analytics'; 'diagnostic' and
              // 'error' are free-form by design and this query selects exactly those
              // two. Anyone on the internet can POST to /api/public/events, so a
              // row's event/product/variant is untrusted text that ends up in a
              // \$GITHUB_OUTPUT heredoc and then in a shell command below.
              // An ALLOWLIST, not an escape list: anything outside this set becomes
              // '?'. That kills newlines (which could close the <<DIGEST heredoc
              // early and forge step outputs), pipes (which break the markdown
              // table) and every shell metacharacter in one rule.
              const s = (v) => String(v ?? '').replace(/[^A-Za-z0-9 ._:-]/g, '?').slice(0, 80);
              // browsers is count(DISTINCT ua): a number, never text a stranger chose. A row
              // the server wrote itself has no user-agent, so its 0 prints as '-'.
              console.log('| count | browsers | type | event | product | colour | most recent |');
              console.log('|---:|---:|---|---|---|---|---|');
              for (const r of rows) {
                console.log(\`| \${Number(r.n)} | \${Number(r.browsers) || '-'} | \${s(r.type)} | \${s(r.event)} | \${s(r.product)} | \${s(r.variant)} | \${s(r.latest)} |\`);
              }
            "
            echo 'DIGEST'
          } >> "$GITHUB_OUTPUT"

      # ── H1, 2026-08-18: the only thing that measures write VOLUME ─────────────
      # Nothing in this repository checked D1 row count, storage or write volume.
      # `scripts/verify-backup.mjs` counts rows, but only while verifying a backup,
      # and raises no alert. The step above filters to type IN
      # ('diagnostic','error') — so a flood of well-formed ANALYTICS rows, which is
      # exactly the abuse shape (POST /api/public/events is unauthenticated,
      # sanitised, rate-limited per-colo, and always answers 204), appears in
      # NOTHING. The first signal would have been the Cloudflare bill.
      #
      # Threshold 5,000 rows/24h. Measured baseline: 754 rows in 28 days, 599 in
      # the last 7 days, 143 in the last 24 hours — and that last figure is
      # inflated by the audit's own live probes. So 5,000 is ~35x the busiest real
      # day and still four orders of magnitude below D1's included 50,000,000
      # writes/month. Ordinary traffic cannot reach it; a genuine flood cannot miss
      # it.
      #
      # A COUNT rather than the D1 GraphQL Analytics API, deliberately. GraphQL
      # measures the metered quantity itself and so cannot diverge from the bill,
      # which is the stronger signal — but it needs a new API token, a new repo
      # secret and a new failure mode, in a job that already holds working D1
      # credentials and already queries this table. If the metered figure is ever
      # wanted, that is the upgrade path and this is where to start.
      # ⚠️ A SETTING THAT LIVES ONLY IN CLOUDFLARE'S CONTROL PLANE, AND NOWHERE HERE.
      #
      # Both queues retain messages for 14 days (1209600 s, the documented maximum on
      # Workers Paid). A repo-wide grep for `1209600` or `message_retention` finds it
      # in no shipping code, test or config — audit 2026-08-30 PM, finding L7-01. So
      # the value is correct and completely unguarded: anyone with dashboard access
      # can restore the 345600 s default and nothing would notice.
      #
      # That matters most for the DLQ. It is where a thrice-failed garment leaves its
      # only trace, and the ingest bucket's own lifecycle rule expires the raw upload
      # at 14 days too. The two numbers are deliberately equal: evidence that outlives
      # its input is recoverable, and evidence that does not is a garment which
      # silently never arrived.
      #
      # Runs HERE rather than in uptime.yml because that workflow deliberately holds
      # no Cloudflare credentials at all, and this one already declares
      # `environment: production`.
      #
      # `|| true` on purpose: the probe exits 2 for INCONCLUSIVE — no credentials, an
      # auth error, or an empty queue list — and an unreadable setting must never be
      # reported as a drifted one. It exits 1, and fails this step, only on a reading
      # that actually contradicts the documented value.
      - name: Queue retention has not drifted
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/queue-settings-probe.mjs || code=$?
          if [ "${code:-0}" = "1" ]; then exit 1; fi

      # Growth counts EVERY row, our own checks included: it measures write volume, not
      # visitors. Its cutoffs are ISO for the reason given above the digest query — with
      # datetime() this line said "491 rows in 24h" on 2026-09-11, when the true count was 1.
      - name: Measure events growth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: growth
        run: |
          set -euo pipefail
          pnpm --filter @run-apparel/cms exec wrangler d1 execute run-apparel-viewer-db --remote \
            --json --command "SELECT (SELECT count(*) FROM events WHERE created_at > strftime('%Y-%m-%dT%H:%M:%fZ','now','-1 day')) AS day, (SELECT count(*) FROM events WHERE created_at > strftime('%Y-%m-%dT%H:%M:%fZ','now','-7 days')) AS week, (SELECT count(*) FROM events) AS total;" \
            > growth.json
          # Integers straight out of count(*) — not attacker-controlled text, unlike
          # the digest table above. Number() regardless, so a malformed response
          # arrives as 0 rather than as a string the comparison would mis-handle.
          #
          # Three plain substitutions rather than one `eval` of generated text. The
          # eval version was written first and removed: evaluating a string this job
          # itself built is the shape the 2026-08-10 injection fix in the step below
          # exists to prevent, and "but this input is trusted" was the argument that
          # was wrong that time too.
          read_count() {
            node -e "const r=(require('./growth.json')[0]?.results??[{}])[0]??{};console.log(Number(r[process.argv[1]])||0)" "$1"
          }
          DAY=$(read_count day)
          WEEK=$(read_count week)
          TOTAL=$(read_count total)
          THRESHOLD=5000
          echo "events rows — 24h: $DAY · 7d: $WEEK · all time: $TOTAL (threshold ${THRESHOLD}/24h)"
          if [ "$DAY" -gt "$THRESHOLD" ]; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "::warning::events wrote $DAY rows in 24h, above the $THRESHOLD threshold"
            printf 'summary=%s\n' "⚠️ **Events growth above threshold** — $DAY rows in 24h (threshold $THRESHOLD). 7d: $WEEK. All time: $TOTAL. D1 meters rows written at \$1.00/million over 50M included; see docs/RUNBOOK.md." >> "$GITHUB_OUTPUT"
          else
            echo "alert=false" >> "$GITHUB_OUTPUT"
            printf 'summary=%s\n' "Events growth normal — $DAY rows in 24h, $WEEK in 7d, $TOTAL all time (threshold $THRESHOLD/24h)." >> "$GITHUB_OUTPUT"
          fi

      # ── PF-05b, 2026-09-17: how fast the viewer is for REAL visitors ─────────
      # The viewer has measured LCP and CLS on every visit since 2026-09-04. Until
      # 2026-09-17 both numbers were dropped before they were stored
      # (apps/viewer/src/lib/telemetry.ts, apps/cms/src/endpoints/events.ts); they now
      # have their own columns, and this reads them back once a week.
      #
      # The 75th percentile, because that is where both metrics are judged (2.5 s and
      # 0.1 are the published "good" lines). SQLite has no percentile function, so it is
      # a nearest-rank ORDER BY with an OFFSET of ceil(0.75 × n) − 1, and
      # apps/cms/src/diagnosticsDigest.test.ts runs this exact SQL. Our own tools are left
      # out, as in the digest query above. Only visits that carry a number are counted.
      #
      # ONE base predicate. type/event/the 7-day window/the own-audit ua filter used to
      # sit inline in five places — the outer FROM and all four percentile subqueries —
      # so an edit to the filter could land in four of five copies and miss the fifth.
      # `WITH w AS (...)` states it once below; every count and percentile reads FROM w.
      #
      # Everything printed is a Number() or fixed words, never a row's text, so nothing a
      # stranger posts reaches the heredoc below. The node script uses no `$` and no
      # backticks, because it sits inside a double-quoted shell string.
      #
      # `continue-on-error`: a page-speed read that fails must not stop the diagnostics
      # issue. The issue step says the read failed instead.
      - name: Read the last 7 days of page speed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        id: vitals
        continue-on-error: true
        run: |
          set -euo pipefail
          pnpm --filter @run-apparel/cms exec wrangler d1 execute run-apparel-viewer-db --remote \
            --json --command "WITH w AS (SELECT ua, lcp_ms, cls FROM events WHERE type = 'analytics' AND event = 'web_vitals' AND created_at > strftime('%Y-%m-%dT%H:%M:%fZ','now','-7 days') AND (ua IS NULL OR ua NOT LIKE '%run-apparel-%')) SELECT count(*) AS visits, count(DISTINCT ua) AS browsers, count(lcp_ms) AS lcp_n, (SELECT lcp_ms FROM w WHERE lcp_ms IS NOT NULL ORDER BY lcp_ms LIMIT 1 OFFSET (SELECT (3 * count(*) + 3) / 4 - 1 FROM w WHERE lcp_ms IS NOT NULL)) AS lcp_p75, count(cls) AS cls_n, (SELECT cls FROM w WHERE cls IS NOT NULL ORDER BY cls LIMIT 1 OFFSET (SELECT (3 * count(*) + 3) / 4 - 1 FROM w WHERE cls IS NOT NULL)) AS cls_p75 FROM w WHERE (lcp_ms IS NOT NULL OR cls IS NOT NULL);" \
            > vitals.json
          visits=$(node -e "const r=(require('./vitals.json')[0]?.results??[{}])[0]??{};console.log(Number(r.visits)||0)")
          echo "visits=$visits" >> "$GITHUB_OUTPUT"
          {
            echo 'summary<<VITALS'
            node -e "
              const r = (require('./vitals.json')[0]?.results ?? [{}])[0] ?? {};
              const num = (v) => (v === null || v === undefined || v === '' ? null : Number(v));
              const visits = num(r.visits) || 0;
              if (!visits) { console.log('**Page speed:** no measured visits in the last 7 days.'); process.exit(0) }
              const lines = ['**Page speed from real visits** (the whole 3D viewer, last 7 days): ' + visits + ' visits from ' + (num(r.browsers) || 0) + ' browsers.'];
              const lcp = num(r.lcp_p75);
              if (lcp !== null && Number.isFinite(lcp)) lines.push('- **Loading:** 3 in 4 visits had the main content on screen within ' + (lcp / 1000).toFixed(1) + ' s (' + (num(r.lcp_n) || 0) + ' visits; 2.5 s or less counts as good).');
              const cls = num(r.cls_p75);
              if (cls !== null && Number.isFinite(cls)) lines.push('- **Steadiness:** 3 in 4 visits had a layout-shift score of ' + cls.toFixed(3) + ' or less (' + (num(r.cls_n) || 0) + ' visits; 0.1 or less counts as good).');
              if (visits < 50) lines.push('Fewer than 50 visits: read these as a hint, not a verdict.');
              console.log(lines.join('\n'));
            "
            echo 'VITALS'
          } >> "$GITHUB_OUTPUT"

      # One rolling issue rather than one per week, so a quiet month does not
      # bury the tab — same shape as the outage alert in uptime.yml.
      #
      # ⚠️ THE GROWTH CONDITION IS NOT OPTIONAL. `rows` counts diagnostic and error
      # rows only, so an analytics flood leaves it at 0 and this step would never
      # run — which is precisely the gap H1 describes.
      - name: Open or update the digest issue
        if: steps.read.outputs.rows != '0' || steps.growth.outputs.alert == 'true' || steps.vitals.outcome == 'failure' || (steps.vitals.outputs.visits != '' && steps.vitals.outputs.visits != '0')
        env:
          # Passed through the environment rather than interpolated with ${{ }},
          # for exactly the reason heartbeat.yml gives for its own STALE variable.
          # The difference is that heartbeat's list is built from hardcoded
          # filenames, whereas THIS table is built from rows a stranger can write
          # (see the allowlist note in the step above). Until 2026-08-10 this was
          # `"${{ steps.read.outputs.table }}"` inside a `run:` block: GitHub
          # expands that into the script BEFORE bash sees it, so a crafted event
          # name closed the quote and ran arbitrary commands with this job's
          # CLOUDFLARE_API_TOKEN — which can edit Workers, D1 and R2 — plus GH_TOKEN.
          # Never exploited: the workflow had not yet had a single run. Two
          # independent fixes now stand between the database and the shell; keep
          # both, since either alone would be enough only until someone edits it.
          DIGEST_TABLE: ${{ steps.read.outputs.table }}
          GROWTH_SUMMARY: ${{ steps.growth.outputs.summary }}
          # Numbers and fixed words only (see the step that builds it). A failed read
          # still reaches the issue as a sentence, so a dead query cannot pass for a
          # quiet week.
          VITALS_SUMMARY: ${{ steps.vitals.outcome == 'success' && steps.vitals.outputs.summary || 'Page speed could not be read this week. See this run in the Actions tab.' }}
        run: |
          set -euo pipefail
          # The label has to exist before EITHER command below touches it: `gh issue
          # list --label diagnostics` fails on an unknown label just as `gh issue
          # create --label` does, so a missing label breaks the read as well as the
          # write. uptime.yml creates its `outage` label first; this file was the one
          # that did not, so its very first successful run would have died here
          # instead of reporting.
          #
          # `|| warn` only for the already-exists case, which is the normal path.
          # Any other failure is surfaced, because it means the issue below probably
          # will not be created either.
          if ! label_out=$(gh label create diagnostics --color 1d76db \
                             --description "Weekly viewer diagnostics digest" 2>&1); then
            grep -qi 'already exists' <<<"$label_out" || echo "::warning::gh label create failed: $label_out"
          fi
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n' \
            "Viewer diagnostics for the 7 days to $(date -u +%Y-%m-%d)." \
            "$DIGEST_TABLE" \
            "$VITALS_SUMMARY" \
            "$GROWTH_SUMMARY" \
            "\`model-load-error\` means a buyer opened a product and the 3D file did not load. \`variant-missing\` means a colour button pointed at a colour that is not inside the file. \`variants-unverified-while-published\` means a re-upload renamed the colours under a live product. \`viewer-load-failed\` means the product's details never reached the page. \`render-scale-degraded\` means a slow device drew the 3D at lower sharpness; the garment still showed. **browsers** is how many different browsers sent those rows, so one busy browser cannot pass for many buyers (- means the server wrote it). Left out on purpose: our own checks (user-agent \`run-apparel-…\`) and the harmless \`ResizeObserver loop\` browser notice. See docs/RUNBOOK.md.")
          existing=$(gh issue list --label diagnostics --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label diagnostics \
              --title "Viewer diagnostics — weekly digest" \
              --body "$body"
          fi
