name: Diagnostics digest

# Read the diagnostics the viewer already records, once a week.
#
# WHY THIS EXISTS. The Events table has been collecting real failures since
# 2026-07-21 and nothing has ever read it. As of the 2026-08-03 audit it held
# 8 × model-load-error, 13 × variant-missing and an uncaught React error from
# genuine visitor sessions — every one of them a buyer who did not see a
# garment, and none of them known to anybody.
#
# The viewer is careful to report why it broke (see apps/viewer/src/lib/diagnostic.ts,
# written precisely so failures stop being invisible). That only pays off if
# somebody looks. This is the looking.
#
# Weekly, not daily: these are trends, not outages. uptime.yml covers "is it up".

on:
  schedule:
    - cron: '17 8 * * 1' # Mondays, 08:17 UTC
  workflow_dispatch:

# `contents: read` is NOT optional here, and leaving it out is the exact bug that
# took the uptime monitor down for ~23 hours on 2026-08-05 (see uptime.yml and
# 9c8e883). A `permissions:` block REPLACES the default token grants rather than
# adding to them, so listing only `issues: write` sets `contents` to `none`, and
# `actions/checkout` on a PRIVATE repo then fails with "Repository not found" —
# GitHub answers 404, not 403, so it reads as a deleted repo rather than a
# permissions problem.
#
# This file shipped with that defect in f1a48eb and kept it when uptime.yml was
# fixed, because the fix was applied to the file that had visibly broken rather
# than to the pattern. Worth stating plainly: this job is the ONLY thing that
# reads the Events table, so while it was failing at checkout, every
# `model-load-error` and `variant-missing` from a real visitor was recorded
# correctly and read by nobody — which is the precise condition this workflow was
# written to end.
permissions:
  contents: read
  issues: write

jobs:
  digest:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Aligned to the versions every other workflow here already proves in
      # production: ci.yml, deploy-shrink.yml and nightly-backup.yml all run green
      # on checkout@v7 + setup-node@v7. This file had drifted to v5/v6.
      #
      # ⚠️ READ THIS IF THE FIRST RUN FAILS. This bump landed on 2026-08-10 while
      # the workflow still had NO successful run on record — its first scheduled
      # slot (08:17 UTC that Monday) had not yet been delivered, GitHub having
      # throttled this repo's schedules to ~27% of their configured rate. The
      # ordering was deliberately the other way round (verify green, then bump) and
      # was overridden knowingly. So if the first run fails there are TWO
      # candidates, not one: this version bump, and whatever pre-existing fault the
      # workflow may still carry from never having executed end to end. Check the
      # pre-existing one first — the D1 read step and the CLOUDFLARE_API_TOKEN's
      # permission to run `wrangler d1 execute --remote` have never been exercised.
      # Reverting these two lines to v5/v6 is the cheap way to separate them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Diagnostics and errors only. `analytics` rows are the healthy path and
      # would drown the signal.
      - name: Read the last 7 days of diagnostics
        id: read
        run: |
          set -euo pipefail
          pnpm --filter @run-apparel/cms exec wrangler d1 execute run-apparel-viewer-db --remote \
            --json --command "SELECT type, event, product, variant, count(*) AS n, max(created_at) AS latest FROM events WHERE type IN ('diagnostic','error') AND created_at > datetime('now','-7 days') GROUP BY type, event, product, variant ORDER BY n DESC LIMIT 50;" \
            > digest.json
          # `.[0].results` is wrangler's shape; empty means a clean week.
          rows=$(node -e "const d=require('./digest.json');console.log((d[0]?.results??[]).length)")
          echo "rows=$rows" >> "$GITHUB_OUTPUT"
          {
            echo 'table<<DIGEST'
            node -e "
              const d = require('./digest.json');
              const rows = d[0]?.results ?? [];
              if (!rows.length) { console.log('No diagnostics recorded in the last 7 days.'); process.exit(0) }
              // THESE VALUES ARE ATTACKER-CONTROLLED. apps/cms/src/endpoints/events.ts
              // allowlists event names ONLY for type 'analytics'; 'diagnostic' and
              // 'error' are free-form by design and this query selects exactly those
              // two. Anyone on the internet can POST to /api/public/events, so a
              // row's event/product/variant is untrusted text that ends up in a
              // \$GITHUB_OUTPUT heredoc and then in a shell command below.
              // An ALLOWLIST, not an escape list: anything outside this set becomes
              // '?'. That kills newlines (which could close the <<DIGEST heredoc
              // early and forge step outputs), pipes (which break the markdown
              // table) and every shell metacharacter in one rule.
              const s = (v) => String(v ?? '').replace(/[^A-Za-z0-9 ._:-]/g, '?').slice(0, 80);
              console.log('| count | type | event | product | colour | most recent |');
              console.log('|---:|---|---|---|---|---|');
              for (const r of rows) {
                console.log(\`| \${Number(r.n)} | \${s(r.type)} | \${s(r.event)} | \${s(r.product)} | \${s(r.variant)} | \${s(r.latest)} |\`);
              }
            "
            echo 'DIGEST'
          } >> "$GITHUB_OUTPUT"

      # One rolling issue rather than one per week, so a quiet month does not
      # bury the tab — same shape as the outage alert in uptime.yml.
      - name: Open or update the digest issue
        if: steps.read.outputs.rows != '0'
        env:
          # Passed through the environment rather than interpolated with ${{ }},
          # for exactly the reason heartbeat.yml gives for its own STALE variable.
          # The difference is that heartbeat's list is built from hardcoded
          # filenames, whereas THIS table is built from rows a stranger can write
          # (see the allowlist note in the step above). Until 2026-08-10 this was
          # `"${{ steps.read.outputs.table }}"` inside a `run:` block: GitHub
          # expands that into the script BEFORE bash sees it, so a crafted event
          # name closed the quote and ran arbitrary commands with this job's
          # CLOUDFLARE_API_TOKEN — which can edit Workers, D1 and R2 — plus GH_TOKEN.
          # Never exploited: the workflow had not yet had a single run. Two
          # independent fixes now stand between the database and the shell; keep
          # both, since either alone would be enough only until someone edits it.
          DIGEST_TABLE: ${{ steps.read.outputs.table }}
        run: |
          set -euo pipefail
          # The label has to exist before EITHER command below touches it: `gh issue
          # list --label diagnostics` fails on an unknown label just as `gh issue
          # create --label` does, so a missing label breaks the read as well as the
          # write. uptime.yml creates its `outage` label first; this file was the one
          # that did not, so its very first successful run would have died here
          # instead of reporting.
          #
          # `|| warn` only for the already-exists case, which is the normal path.
          # Any other failure is surfaced, because it means the issue below probably
          # will not be created either.
          if ! label_out=$(gh label create diagnostics --color 1d76db \
                             --description "Weekly viewer diagnostics digest" 2>&1); then
            grep -qi 'already exists' <<<"$label_out" || echo "::warning::gh label create failed: $label_out"
          fi
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "Viewer diagnostics for the 7 days to $(date -u +%Y-%m-%d)." \
            "$DIGEST_TABLE" \
            "\`model-load-error\` means a buyer opened a product and the 3D file did not load. \`variant-missing\` means a colour button pointed at a colour that is not inside the file. \`variants-unverified-while-published\` means a re-upload renamed the colours under a live product. See docs/RUNBOOK.md.")
          existing=$(gh issue list --label diagnostics --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label diagnostics \
              --title "Viewer diagnostics — weekly digest" \
              --body "$body"
          fi
