name: Uptime

on:
  schedule:
    - cron: '*/15 * * * *' # every ~15 min (GitHub cron is best-effort — see docs/RUNBOOK.md)
  workflow_dispatch:
    inputs:
      target:
        description: Override URL to check (use a bogus URL to test the alert path)
        required: false

permissions:
  issues: write

jobs:
  ping:
    # Only after go-live (Phase 10).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEALTH_URL: ${{ github.event.inputs.target || format('{0}/api/health', vars.VITE_API_BASE_URL || 'https://cms.wear-run.help') }}
      VIEWER_URL: https://viewer.wear-run.help/n001/navy
    steps:
      - uses: actions/checkout@v4
        if: github.event.inputs.target == ''

      - uses: actions/setup-node@v4
        if: github.event.inputs.target == ''
        with:
          node-version: 24

      - name: Check CMS health + viewer
        id: check
        run: |
          ok=true
          curl -fsS --max-time 20 "$HEALTH_URL" || ok=false
          if [ "${{ github.event.inputs.target }}" = "" ]; then
            curl -fsS --max-time 20 -o /dev/null "$VIEWER_URL" || ok=false
            # Both curls above pass against a product serving NO MODEL: the SPA
            # shell returns 200 and renders its no-model state. This resolves the
            # model URL the way the viewer does and fetches it, so a garment that
            # silently lost its GLB pages someone instead of sitting there.
            # Skipped on a manual `target` override, which is for testing the
            # alert path with a bogus URL.
            node scripts/smoke-viewer-payload.mjs || ok=false
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Open a deduplicated outage issue
        if: steps.check.outputs.ok == 'false'
        run: |
          # `|| true` only for the already-exists case: creating a label that is
          # already there is the normal path and must not fail the alert. Any
          # other failure (bad token, API down) is reported, because it means the
          # issue below probably will not be created either — and an uptime
          # workflow that silently stops alerting is worse than no uptime
          # workflow.
          if ! label_out=$(gh label create outage --color b60205 \
                             --description "Automated uptime alert" 2>&1); then
            grep -qi 'already exists' <<<"$label_out" || echo "::warning::gh label create failed: $label_out"
          fi
          open=$(gh issue list --label outage --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --label outage \
              --title "Outage: health check failing" \
              --body "Automated uptime check failed at $(date -u).\n\nHealth: $HEALTH_URL\nViewer: $VIEWER_URL\n\nSee docs/RUNBOOK.md → uptime response."
          else
            echo "An open outage issue already exists — not duplicating."
          fi
