name: Security scans

# WHY THIS FILE EXISTS (2026-10-01, owner-approved plan). Two report-only scanners that
# write to the Security tab and block nothing: neither is a required check, and the main
# ruleset's code-scanning rule names CodeQL only, so their alerts cannot stop a merge.
#
# - scorecard: OpenSSF Scorecard grades the repository's security habits. Published to
#   scorecard.dev (publish_results: true, owner's choice) for the README badge. Publishing
#   imposes rules on this file (github.com/ossf/scorecard-action, "Workflow
#   Restrictions"): no workflow- or job-level `env`/`defaults`, no container/services,
#   only checkout / upload-artifact / upload-sarif / scorecard-action / harden-runner in
#   its job, and only its job may hold `id-token: write`. Break one and the publish fails.
# - dockerfile: Trivy's misconfiguration scan of apps/shrink/Dockerfile. Trivy is already
#   pinned in ci.yml, so this adds no new tool (Hadolint was considered and not taken).
#   Pinned v0.36.0 = 2026-04-22, after the 2026-03-19 tag hijack (CVE-2026-33634).
#
# NOT behind vars.DEPLOY_ENABLED: it reads the repository, never production.

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Wednesdays. GitHub's schedules land 19-90 minutes late here (measured).
    - cron: '17 5 * * 3'
  # Scorecard re-grades when branch protection changes, as its own example does.
  branch_protection_rule:
  workflow_dispatch: {}

# Read-only for the whole workflow: Scorecard forbids workflow-level write permissions.
# A `permissions:` block REPLACES the defaults, so `contents: read` must stay (uptime.yml).
permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Network guard (Harden-Runner, watch mode)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Scorecard
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the raw result (14 days)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scorecard-${{ github.sha }}
          path: scorecard.sarif
          retention-days: 14
          if-no-files-found: error
      - name: Send to the Security tab
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  dockerfile:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Network guard (Harden-Runner, watch mode)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Trivy from its GitHub release, checksum pinned, because the action's own installer
      # downloads from get.trivy.dev, which stopped resolving on 3 Nov 2026. The reasoning, and
      # the same three pins, are on ci.yml's shrink-image-audit; toolVersions.test.ts keeps the
      # two copies identical.
      - name: Install Trivy from its GitHub release (checksum pinned)
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256_X64: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
          TRIVY_SHA256_ARM64: e174dff2a6dba5e3ae41f8d0537a6324405bd08132497340304c6b20e0f16a1f
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) TV_ARCH=64bit; TV_SHA="${TRIVY_SHA256_X64}" ;;
            aarch64|arm64) TV_ARCH=ARM64; TV_SHA="${TRIVY_SHA256_ARM64}" ;;
            *) echo "::error::unsupported arch $(uname -m) for Trivy"; exit 1 ;;
          esac
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-${TV_ARCH}.tar.gz"
          echo "${TV_SHA}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: Dockerfile check (Trivy config, report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: 'true'
          scan-type: config
          scan-ref: apps/shrink
          format: sarif
          output: trivy-config.sarif
          exit-code: '0'
          # Reviewed exceptions, each with its reason. Named explicitly so a missing file
          # fails the step ("cannot find ignorefile") instead of silently showing them again.
          trivyignores: .trivyignore
      - name: Send to the Security tab
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: trivy-config.sarif
          category: trivy-dockerfile
