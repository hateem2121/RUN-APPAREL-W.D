name: Refresh vendored skills

on:
  schedule:
    # Mondays 05:23 UTC (10:23 in Pakistan). GitHub's scheduled runs land 19-90 minutes
    # late on this repo (.github/CLAUDE.md, measured) — fine for a weekly refresh.
    - cron: '23 5 * * 1'
  workflow_dispatch: {}

# WHAT THIS DOES — owner decision 2026-10-03 ("everything set to auto-update to the latest
# version"). The third-party skills under .claude/skills/ and .agents/skills/ stay PINNED to
# an upstream commit, so every change arrives as a reviewable diff (.claude/skills/README.md,
# "Why vendored instead of `npx skills add`"). Once a week this compares each one with its
# upstream, applies only the changes that pass the same safety scan a hand update gets, and
# opens a pull request. Nothing reaches main until the owner merges it after ci.yml's gates.
#
# A PERSON STARTS ITS CHECKS. GitHub's docs (read 2026-10-03, "Triggering a workflow"): when
# a workflow using GITHUB_TOKEN opens a pull request, "the resulting pull_request event
# creates workflow runs in an approval-required state", and a user with write access starts
# them with "Approve workflows to run" in the merge box. That is the right gate for a robot
# that copies other people's text: read the diff, then approve. The pull-request body says so.
# Until 2026-10-03 this job also ran `gh workflow run ci.yml` on its branch, which needed
# `actions: write`. Measured on the first robot pull request (#123) that day: the dispatched
# run went green and did not count, because the required checks wait for the held
# pull_request run (.github/CLAUDE.md, the GITHUB_TOKEN trap). So it no longer starts one.
# Opening a pull request at all needs the repository setting "Allow GitHub Actions to create
# and approve pull requests", switched on 2026-10-03 (owner decision; the ruleset still
# requires 0 approvals, so nothing became weaker).
#
# NOT behind vars.DEPLOY_ENABLED: it reads GitHub, never production.

permissions:
  contents: read

# No job here uses the Actions cache, so it may neither read nor write one (see
# required-checks.yml: least privilege against cache poisoning).
cache-mode: none

concurrency:
  group: refresh-skills
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-26.04
    # 24 skills from 6 upstream repositories: a few API reads each, cached per commit.
    timeout-minutes: 10
    permissions:
      contents: write # push the update branch, delete a superseded one
      pull-requests: write # open the pull request, close a superseded one
    steps:
      - name: Network guard (Harden-Runner, watch mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # No install step: the script uses fetch and node's built-ins only, so this workflow
      # cannot break because of the lockfile.
      - name: Compare every vendored skill with its upstream; apply the clean updates
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-vendored-skills.mjs --write --summary "$RUNNER_TEMP/skills-summary.md"

      - name: Open a pull request
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="robot/refresh-skills-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -A .claude/skills .agents/skills skills-lock.json
          git commit -q -m 'Agent skills: weekly refresh from upstream (robot)'
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          url="$(gh pr create --base main --head "$branch" \
            --title 'Agent skills: weekly refresh from upstream' \
            --body-file "$RUNNER_TEMP/skills-summary.md")"
          echo "Opened $url"
          # A robot pull request still open from an earlier week is now out of date.
          for n in $(gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"robot/refresh-skills-\")) | select(.headRefName != \"$branch\") | .number"); do
            gh pr close "$n" --delete-branch --comment "Superseded by $url."
          done

      - name: Fail visibly when an update was blocked
        if: steps.refresh.outputs.blocked != '' && steps.refresh.outputs.blocked != '0'
        env:
          BLOCKED: ${{ steps.refresh.outputs.blocked }}
        run: |
          echo "::error::${BLOCKED} skill update(s) failed the safety scan and were left out. The step above lists each one and why."
          exit 1
