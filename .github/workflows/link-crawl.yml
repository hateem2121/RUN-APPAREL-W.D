name: Link crawl

on:
  schedule:
    # WEEKLY, deliberately — unlike a rare, human-triggered re-shrink (which gets a
    # by-hand RUNBOOK check instead of a schedule), a link can break from several
    # unrelated, ordinary changes: a CMS content edit, a footer fact update, a social
    # link swap. A schedule is the right shape here.
    #
    # GitHub's own scheduled runs land 19-90 minutes late on this repo (measured,
    # n=11, every one) — a cron here is a queue position, not a deadline.
    - cron: '17 5 * * 1'
  workflow_dispatch: {}

# WHY IT BLOCKS NOTHING. It runs on a schedule, with nothing downstream waiting on it. A
# failure reaches the owner through GitHub's own workflow-failure notification — the same
# choice perf-watch.yml and lighthouse-live.yml make, for the same reason: no third,
# untested copy of the issue-opening shell that scripts/test-alert-shell.sh exists to
# exercise.

# See uptime.yml's own comment on this block: it REPLACES the default grants rather
# than adding to them, and omitting `contents: read` breaks `actions/checkout` outright.
permissions:
  contents: read

# No job here uses the Actions cache, so it may neither read nor write one. Scheduled and
# manual runs would otherwise be allowed to WRITE it (GitHub `cache-mode`, 2026-10-01: least
# privilege against cache poisoning).
cache-mode: none

# One run at a time (zizmor `concurrency-limits`, 2026-11-07): a late scheduled run and a manual
# one must not overlap. Queued, never cancelled: every run here is a check worth finishing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  crawl:
    # Same gate as the rest of this repo's scheduled network checks — nothing runs
    # against production before go-live.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-26.04
    # One request at a time, 1.2 s apart (crawl politeness), so the time grows with the site:
    # about 106 requests and 154.5 s when this was written; 361 fetched in 462.9 s on 9 Nov 2026
    # (run 42629936805); 495 fetched in 735.8 s on 23 Nov 2026 (this Mac), after the Russian pages
    # and more guides. The pauses alone were then 594 s, so the old limit of 10 minutes cancelled
    # the runs of 16 and 23 Nov before they could print a line, and a cancelled run names no link.
    # 30 minutes holds about 1,200 requests at the same pace. If the site outgrows that, crawl in
    # two jobs; do not shorten the pause.
    timeout-minutes: 30
    steps:
      - name: Network guard (Harden-Runner, watch mode)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      - name: Crawl every link from both hosts' entry points (FI-12, SE-18)
        run: node scripts/link-crawl-probe.mjs
