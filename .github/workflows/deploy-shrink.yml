name: Deploy shrink service

# Deploys the separate GLB shrink Worker + Container (apps/shrink). Kept out of
# the main ci.yml deploy job because `wrangler deploy` builds a Docker image here
# (ubuntu-latest has Docker), which is slower and only needs to run when the
# shrink service itself changes.
#
# PREREQUISITES (one-time go-live, see docs/RAW-UPLOAD-PIPELINE.md):
#   - R2 bucket `run-apparel-viewer-ingest` exists.
#   - Queues `glb-shrink` and `glb-shrink-dlq` exist.
#   - Secrets set on the worker: R2_INGEST_ACCESS_KEY_ID, R2_INGEST_SECRET_ACCESS_KEY,
#     CMS_ROBOT_API_KEY; and R2_INGEST_S3_ENDPOINT var points at the real account.
# Until those exist, this deploy will fail (harmlessly — it never touches the live
# CMS or viewer).
#
# ⚠️ API TOKEN SCOPE. This job builds a Docker image and PUSHES it to Cloudflare's
# container registry, which a plain "Edit Cloudflare Workers" token cannot do. It
# failed on every run until 2026-07-28 with the image built successfully and then:
#
#     ✘ [ERROR] ApiError: Forbidden
#       body: { error: 'Authentication error' }
#
# CLOUDFLARE_API_TOKEN must be a CUSTOM token (there is no template) carrying, on
# top of the usual Workers Scripts:Edit and the Edit permission for every bound
# resource — Account · Containers:Edit and Account · Cloudchamber:Edit. Both are
# needed: wrangler still routes container work through its cloudchamber client,
# and its own OAuth flow requests `containers:write` AND `cloudchamber:write`.
# Add User · User Details:Read too, or every run ends with a confusing
# "Unable to retrieve email for this user" warning. Full table: docs/RUNBOOK.md.

on:
  push:
    branches: [main]
    # Markdown under tools/asset-pipeline/ must not redeploy the container:
    # that glob is directory-wide and the directory holds README.md and
    # CLAUDE.md, so c0a6728 (2026-08-12) built and pushed a Docker image for a
    # docs-only commit. Order matters — a later `!` excludes an earlier match.
    # `**.md` not `**/*.md`: '**.js' is GitHub's documented extension idiom.
    paths:
      - 'apps/shrink/**'
      - 'tools/asset-pipeline/**'
      - '!tools/asset-pipeline/**.md'
      - '.github/workflows/deploy-shrink.yml'
  workflow_dispatch:

concurrency:
  group: deploy-shrink
  cancel-in-progress: false

# Least privilege by default — see the longer note in ci.yml. This workflow
# builds a Docker image from the repository and pushes it to Cloudflare's
# registry, so the GITHUB_TOKEN it carries alongside CLOUDFLARE_API_TOKEN should
# be able to read the repository and nothing else. The `secrets` job below
# declares the extra `pull-requests: read` that gitleaks needs.
permissions:
  contents: read

jobs:
  # GATE. This workflow had no `needs:` at all until 2026-08-03: it triggers on
  # pushes touching apps/shrink/** or tools/asset-pipeline/**, ran in parallel
  # with ci.yml, and shipped a new container image whether or not `verify` there
  # passed. So the one code path every real garment goes through — the pipeline
  # that decimates meshes and re-encodes printed artwork — was the one code path
  # nothing gated. A broken simplify setting could reach production while the
  # main CI run was still going red next to it.
  #
  # Deliberately a copy of ci.yml's checks rather than a `workflow_call` into it:
  # ci.yml's verify also builds the viewer, seeds assets and runs Playwright,
  # none of which this deploy depends on, and coupling them would mean a viewer
  # e2e flake blocking a pipeline fix.
  verify:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ⚠️ `pnpm lint` WAS MISSING HERE UNTIL 2026-08-30, and `pnpm test` was the
      # bare runner. Both matter, and the second is the subtle one: vitest evaluates
      # a `thresholds:` block ONLY when coverage is on, and only `test:coverage`
      # passes `--coverage`. So this workflow — the one that ships the container
      # decimating every garment's printed artwork — enforced NO coverage floors and
      # NO lint, while ci.yml enforced both.
      #
      # This is the generalised trap already recorded in .github/CLAUDE.md: two
      # workflows deliberately duplicate the same gates, so a fix applied to one is
      # only half a fix. It was true of gitleaks for three months, and it was true
      # of these two lines for as long.
      - run: pnpm lint
      - run: pnpm typecheck
      # Not a workspace member, so `pnpm typecheck` skips it — and it is the
      # server that drives the pipeline for every upload.
      - name: Typecheck shrink container
        working-directory: apps/shrink/container
        run: npm install --no-audit --no-fund && npx tsc --noEmit
      - run: pnpm test:coverage

  # THE ARTWORK GATE, ON THE PATH THAT DECIMATES ARTWORK.
  #
  # Added 2026-08-08. Until then this workflow ran typecheck + unit tests ONLY,
  # while ci.yml gated its deploy on four jobs including `pnpm eval:artwork`. The
  # asymmetry was exactly backwards: ci.yml's paths do not touch decimation, and
  # THIS one does — it is the only workflow that fires on `tools/asset-pipeline/**`
  # and it ships the container that runs the pipeline over every real garment.
  #
  # The gap mattered because of the finding at the top of CLAUDE.md: the three
  # blocking gates test `alphaMode`, which decimation does not change, so a preset
  # that smears a printed wordmark passes typecheck, passes `pnpm test`, passes all
  # three structural gates, and ships. The 2026-08-05 sweep proved it — run F
  # rendered the chest wordmark illegible and reported `wouldShip: true`. This eval
  # is the only automated thing in the repo that looks at the letters, and it was
  # not running on the one path that can damage them.
  #
  # Deliberately a copy of ci.yml's job rather than a `workflow_call`, for the same
  # reason the `verify` job above is a copy — see the note there.
  artwork:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium only; the render harness runs software WebGL via swiftshader.
      # Cache key matches ci.yml's artwork job on purpose — same browser set, same
      # Playwright version, so the two workflows share one cache entry.
      - name: Resolve Playwright version
        id: pw
        run: echo "v=$(node -p 'require("./tools/asset-pipeline/node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}-chromium
      - name: Install Chromium for the render harness (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @run-apparel/asset-pipeline exec playwright install --with-deps chromium
      - name: Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @run-apparel/asset-pipeline exec playwright install-deps chromium
      - name: Artwork legibility eval
        run: pnpm eval:artwork

  # Dependency vulnerability gate, mirroring ci.yml. This workflow ships a Docker
  # image built from the repo's own dependency tree, so "ci.yml already audits it"
  # was never true for the container.
  audit:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vulnerability audit (high/critical)
        run: pnpm exec audit-ci --config audit-ci.jsonc

      # ── Base-image CVEs ──────────────────────────────────────────────────
      # audit-ci above answers "is any npm dependency known-vulnerable". Nothing
      # answered the same question about the OPERATING SYSTEM the container runs
      # on, and that image is digest-pinned (apps/shrink/Dockerfile) with nothing
      # refreshing it — deliberately, because sharp links against its system libs
      # and a moving tag changes printed artwork. The pin is correct; being
      # unable to SEE it age is not. This is the missing half.
      #
      # It scans the pinned digest directly rather than a built image: it is the
      # digest that never moves, it needs no build, and npm deps inside the image
      # are already covered by audit-ci and the SBOM licence gate.
      #
      # ⚠️ THE GATE IS SCOPED TO `vuln-type: os`, AND THAT IS THE WHOLE DESIGN.
      # MEASURED 2026-08-25 against the pinned digest before this shipped:
      #   * debian 12.15 layer  — 0 vulnerabilities, clean
      #   * node-pkg layer      — 1 CRITICAL, CVE-2026-59873, tar 7.5.16 -> 7.5.19
      # That tar lives in npm's OWN bundled node_modules inside the base image. It
      # is marked "fixed" upstream, so --ignore-unfixed does NOT filter it, and it
      # is not fixable from this repository: the only remedy is a Node image that
      # bundles a newer npm. An unscoped gate therefore blocks EVERY shrink deploy
      # on a CVE nobody here can close, which is precisely how a gate gets switched
      # off and stops protecting anything.
      #
      # The OS layer is also the honest scope: it is what the digest pin exists to
      # freeze (sharp links against these system libs) and what a digest bump can
      # actually change. This repo's own npm dependencies are already gated by
      # audit-ci above and by the SBOM licence check — so nothing is unwatched.
      #
      # The informational step above keeps the DEFAULT scope (os,library), so the
      # tar finding still prints on every run. Visible, but not blocking.
      #
      # ⚠️ The input is `vuln-type`, NOT `pkg-types`. The action's own action.yaml
      # carries "# TODO: rename to pkg-types" — the Trivy CLI renamed the flag and
      # the wrapper has not. An unknown input is IGNORED SILENTLY by Actions, which
      # would restore the unscoped scan and fail the deploy while looking correct.
      # Read the digest FROM the Dockerfile rather than repeating it here. A
      # second copy of a pinned value is the same defect as the `main` ruleset's
      # required-checks list being a second copy of `deploy.needs`: bump one, and
      # the other keeps testing something that is no longer shipped, while
      # staying green. The `-z` guard matters as much as the grep — an empty ref
      # would make Trivy scan nothing and pass, which is the exact failure this
      # whole job was added to stop.
      - name: Read the pinned base image from the Dockerfile
        id: baseimage
        run: |
          set -euo pipefail
          ref=$(grep -oE '^FROM +[^ ]+' apps/shrink/Dockerfile | head -1 | awk '{print $2}')
          if [ -z "$ref" ] || [ "${ref#*@sha256:}" = "$ref" ]; then
            echo "::error::Could not read a digest-pinned FROM from apps/shrink/Dockerfile (got '$ref')."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Scanning $ref"

      - name: Base image report (informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.baseimage.outputs.ref }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Fail on a fixable CRITICAL in the base OS layer
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.baseimage.outputs.ref }}
          format: table
          vuln-type: os
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # Secret scanning, mirroring ci.yml — and note the lesson recorded there: a scan
  # that cannot be named in a `needs:` list is not a gate. This job exists so the
  # shrink deploy has one, rather than relying on ci.yml's, which runs in a
  # different workflow and therefore cannot block this deploy.
  secrets:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history — a secret is usually in an older commit

      # RUNS THE GITLEAKS BINARY, NOT gitleaks/gitleaks-action. ci.yml made this
      # change on 2026-08-18 and this file was missed, so for three months the
      # gate that blocks THIS deploy was inert. Measured on run 32506101672
      # (2026-08-21), which reported success:
      #
      #     [RUN-APPAREL] is an organization. License key is required.
      #     INF 0 commits scanned.
      #     INF no leaks found
      #
      # ZERO commits scanned, "no leaks found", exit 0 — while `fetch-depth: 0`
      # above pulled the entire history precisely so it could be searched. Worse
      # than the ci.yml case that prompted the original fix, which at least
      # managed 1 commit and ~60 bytes. The Action is free for personal accounts
      # and PAID for organisations; unlicensed it silently degrades to a range
      # that resolves to nothing rather than failing loudly.
      #
      # The gitleaks SCANNER is MIT and free. Only the wrapper is commercial.
      #
      # Consequences of dropping the wrapper, both deliberate and both mirroring
      # ci.yml: `pull-requests: read` is gone from this job's permissions (only
      # the Action needed it, to list a PR's commits), and no GITHUB_TOKEN is
      # passed, because nothing here talks to the API.
      #
      # --redact so a hit never prints the secret into the log.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          # Kept identical to ci.yml's secrets job — see the note there. A CDN 504
          # on run 33264929752 failed that gate on a PR containing no secret,
          # because the SCANNER never downloaded. This file carries a duplicate of
          # that job on purpose (a scan in another workflow cannot appear in this
          # deploy's needs:), and the gitleaks history above records what happens
          # when only one of the two copies gets a fix: the wrapper survived here
          # for three months, scanning ZERO commits, green.
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

  deploy:
    # FOUR gates, matching ci.yml. `artwork`, `audit` and `secrets` joined on
    # 2026-08-08; before that this deploy was gated on `verify` alone.
    needs: [verify, artwork, audit, secrets]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy shrink worker + container image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `wrangler deploy` builds the Dockerfile locally (Docker is preinstalled
        # on ubuntu-latest) and pushes it to Cloudflare's registry, then deploys.
        run: pnpm --filter @run-apparel/shrink exec wrangler deploy

      # ALERTING ONLY EXISTS IF THIS RUNS.
      #
      # Found 2026-08-30: the shrink Worker's failure alerting was built on
      # 2026-08-29 and its one required secret was never set. `wrangler secret list
      # --name run-apparel-viewer-shrink` returned exactly CMS_ROBOT_API_KEY,
      # R2_INGEST_ACCESS_KEY_ID and R2_INGEST_SECRET_ACCESS_KEY. `apps/shrink/src/
      # sentry.ts` is a deliberate no-op without a DSN — "safe to deploy before the
      # DSN exists" — so a failed garment told nobody, quietly, and the code looked
      # correct the whole time.
      #
      # A one-off `wrangler secret put` from a laptop would fix it once and leave the
      # value existing only inside Cloudflare: recreate the Worker and the alerting
      # goes inert again, silently, which is the same failure. Mirrors ci.yml's
      # PAYLOAD_SECRET step so the value is under version-controlled process.
      #
      # Gated inside the shell rather than by `if:` on purpose — a job-level `env:`
      # would put the DSN in the environment of `pnpm install` too, which is the
      # exposure this repo is separately closing.
      - name: Apply worker secret (SENTRY_DSN)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "::warning::SENTRY_DSN secret is not set — the shrink robot's failure alerting is INERT. Set it with: gh secret set SENTRY_DSN"
            exit 0
          fi
          printf '%s' "$SENTRY_DSN" | pnpm --filter @run-apparel/shrink exec wrangler secret put SENTRY_DSN

      # Proof the IMAGE moved, not just the Worker script. On 2026-07-27 a
      # pipeline fix shipped to the CMS while the container kept running a
      # three-day-old image, because this job had already failed and nothing
      # said so at a glance. `wrangler containers list` prints LAST MODIFIED;
      # compare it against this run's timestamp before believing a deploy.
      - name: Show container image state (drift check)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "This run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pnpm --filter @run-apparel/shrink exec wrangler containers list
