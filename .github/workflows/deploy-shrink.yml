name: Deploy shrink service

# Deploys the separate GLB shrink Worker + Container (apps/shrink). Kept out of
# the main ci.yml deploy job because `wrangler deploy` builds a Docker image here
# (ubuntu-latest has Docker), which is slower and only needs to run when the
# shrink service itself changes.
#
# PREREQUISITES (one-time go-live, see docs/RAW-UPLOAD-PIPELINE.md):
#   - R2 bucket `run-apparel-viewer-ingest` exists.
#   - Queues `glb-shrink` and `glb-shrink-dlq` exist.
#   - Secrets set on the worker: R2_INGEST_ACCESS_KEY_ID, R2_INGEST_SECRET_ACCESS_KEY,
#     CMS_ROBOT_API_KEY; and R2_INGEST_S3_ENDPOINT var points at the real account.
# Until those exist, this deploy will fail (harmlessly — it never touches the live
# CMS or viewer).
#
# ⚠️ API TOKEN SCOPE. This job builds a Docker image and PUSHES it to Cloudflare's
# container registry, which a plain "Edit Cloudflare Workers" token cannot do. It
# failed on every run until 2026-07-28 with the image built successfully and then:
#
#     ✘ [ERROR] ApiError: Forbidden
#       body: { error: 'Authentication error' }
#
# CLOUDFLARE_API_TOKEN must be a CUSTOM token (there is no template) carrying, on
# top of the usual Workers Scripts:Edit and the Edit permission for every bound
# resource — Account · Containers:Edit and Account · Cloudchamber:Edit. Both are
# needed: wrangler still routes container work through its cloudchamber client,
# and its own OAuth flow requests `containers:write` AND `cloudchamber:write`.
# Add User · User Details:Read too, or every run ends with a confusing
# "Unable to retrieve email for this user" warning. Full table: docs/RUNBOOK.md.

on:
  push:
    branches: [main]
    # Markdown under tools/asset-pipeline/ must not redeploy the container:
    # that glob is directory-wide and the directory holds README.md and
    # CLAUDE.md, so c0a6728 (2026-08-12) built and pushed a Docker image for a
    # docs-only commit. Order matters — a later `!` excludes an earlier match.
    # `**.md` not `**/*.md`: '**.js' is GitHub's documented extension idiom.
    paths:
      - 'apps/shrink/**'
      - 'tools/asset-pipeline/**'
      - '!tools/asset-pipeline/**.md'
      - '.github/workflows/deploy-shrink.yml'
  workflow_dispatch:

concurrency:
  group: deploy-shrink
  cancel-in-progress: false

# Least privilege by default — see the longer note in ci.yml. This workflow
# builds a Docker image from the repository and pushes it to Cloudflare's
# registry, so the GITHUB_TOKEN it carries alongside CLOUDFLARE_API_TOKEN should
# be able to read the repository and nothing else. The `secrets` job below
# declares the extra `pull-requests: read` that gitleaks needs.
permissions:
  contents: read

# ⚠️ EVERY JOB HERE IS PREFIXED `shrink-`, AND THAT PREFIX IS LOAD-BEARING.
# Until 2026-08-31 these were called verify / artwork / audit / secrets / deploy —
# the same names as ci.yml's jobs, and four of them are contexts the `main` ruleset
# requires. Required status checks match by NAME, and a job skipped by a job-level
# `if:` still publishes a check run with conclusion `skipped`, which GitHub counts
# as SATISFIED.
#
# Today that is latent, not live: this workflow has no `pull_request` trigger, so
# its checks never appear on a PR. The landmine is that adding one trigger line
# would let a merge gate be satisfied by four jobs that executed nothing. Renaming
# removes the collision permanently instead of relying on the trigger list staying
# as it is. Audit 2026-08-30 PM, finding L14-06.
jobs:
  # GATE. This workflow had no `needs:` at all until 2026-08-03: it triggers on
  # pushes touching apps/shrink/** or tools/asset-pipeline/**, ran in parallel
  # with ci.yml, and shipped a new container image whether or not `verify` there
  # passed. So the one code path every real garment goes through — the pipeline
  # that decimates meshes and re-encodes printed artwork — was the one code path
  # nothing gated. A broken simplify setting could reach production while the
  # main CI run was still going red next to it.
  #
  # Deliberately a copy of ci.yml's checks rather than a `workflow_call` into it:
  # ci.yml's verify also builds the viewer, seeds assets and runs Playwright,
  # none of which this deploy depends on, and coupling them would mean a viewer
  # e2e flake blocking a pipeline fix.
  shrink-verify:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, arm64, playwright]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # NOT on the self-hosted runner: `cache: pnpm` pulled a 377 MB archive from
          # GitHub's cache service at 0.4-0.7 MB/s to rebuild a store already on local
          # disk. `runner.environment` keeps this correct if a job ever runs on GitHub
          # again, where the store IS ephemeral and the archive genuinely helps.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      # ⚠️ `pnpm lint` WAS MISSING HERE UNTIL 2026-08-30, and `pnpm test` was the
      # bare runner. Both matter, and the second is the subtle one: vitest evaluates
      # a `thresholds:` block ONLY when coverage is on, and only `test:coverage`
      # passes `--coverage`. So this workflow — the one that ships the container
      # decimating every garment's printed artwork — enforced NO coverage floors and
      # NO lint, while ci.yml enforced both.
      #
      # This is the generalised trap already recorded in .github/CLAUDE.md: two
      # workflows deliberately duplicate the same gates, so a fix applied to one is
      # only half a fix. It was true of gitleaks for three months, and it was true
      # of these two lines for as long.
      - run: pnpm lint
      - run: pnpm typecheck
      # Not a workspace member, so `pnpm typecheck` skips it — and it is the
      # server that drives the pipeline for every upload.
      - name: Typecheck shrink container
        working-directory: apps/shrink/container
        run: npm install --no-audit --no-fund && npx tsc --noEmit
      - run: pnpm test:coverage

  # THE ARTWORK GATE, ON THE PATH THAT DECIMATES ARTWORK.
  #
  # Added 2026-08-08. Until then this workflow ran typecheck + unit tests ONLY,
  # while ci.yml gated its deploy on four jobs including `pnpm eval:artwork`. The
  # asymmetry was exactly backwards: ci.yml's paths do not touch decimation, and
  # THIS one does — it is the only workflow that fires on `tools/asset-pipeline/**`
  # and it ships the container that runs the pipeline over every real garment.
  #
  # The gap mattered because of the finding at the top of CLAUDE.md: the three
  # blocking gates test `alphaMode`, which decimation does not change, so a preset
  # that smears a printed wordmark passes typecheck, passes `pnpm test`, passes all
  # three structural gates, and ships. The 2026-08-05 sweep proved it — run F
  # rendered the chest wordmark illegible and reported `wouldShip: true`. This eval
  # is the only automated thing in the repo that looks at the letters, and it was
  # not running on the one path that can damage them.
  #
  # Deliberately a copy of ci.yml's job rather than a `workflow_call`, for the same
  # reason the `verify` job above is a copy — see the note there.
  shrink-artwork:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, arm64, playwright]
    # 30, matching ci.yml. It was 20 here while ci.yml had already been raised —
    # and the raise was itself recorded there as the WRONG fix, which is why the
    # container below is the actual one.
    timeout-minutes: 30
    # NO MORE apt. This job ran `playwright install --with-deps` on a cache miss and
    # `install-deps` on a hit — apt on BOTH paths — long after ci.yml stopped.
    #
    # Why that matters, from ci.yml's own record: on 2026-08-18 a degraded Azure
    # Ubuntu mirror made `install-deps` (normally 24 s) eat whole job budgets, and
    # `timeout-minutes` kills the step's SHELL, not the apt-get it started. The
    # orphan keeps the dpkg lock, so a retry races it and exits 100 in five seconds
    # while waiting longer only spends the job's headroom. Raising a ceiling just
    # moves which job dies.
    #
    # This was the LAST apt dependency in the repo, and removing it means NO workflow
    # here runs apt any more. .github/CLAUDE.md's trap is updated to say so — and
    # kept, because its reasoning is what stops the next one being added.
    #
    # ⚠️ NO `container:` BLOCK SINCE 2026-09-08 — THE RUNNER *IS* THAT IMAGE.
    # `infra/ci-runner/Dockerfile` is built `FROM mcr.microsoft.com/playwright:v1.62.1-noble`,
    # the same image this job used to pull per run, so the browsers are already present
    # and there is no Docker-in-Docker to go wrong. The tag is still not decorative: it
    # must equal the declared `@playwright/test` version or the render harness fails at
    # runtime with `browser not found at /ms-playwright/...`, and
    # apps/cms/src/workflowHardening.test.ts asserts the Dockerfile's FROM and the
    # package version agree. Bumping @playwright/test means REBUILDING that image.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # NOT on the self-hosted runner: `cache: pnpm` pulled a 377 MB archive from
          # GitHub's cache service at 0.4-0.7 MB/s to rebuild a store already on local
          # disk. `runner.environment` keeps this correct if a job ever runs on GitHub
          # again, where the store IS ephemeral and the archive genuinely helps.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      # No browser install step at all: the image ships Chromium at /ms-playwright,
      # and the render harness runs software WebGL via swiftshader against it.
      - name: Artwork legibility eval
        run: pnpm eval:artwork

  # Dependency vulnerability gate, mirroring ci.yml. This workflow ships a Docker
  # image built from the repo's own dependency tree, so "ci.yml already audits it"
  # was never true for the container.
  shrink-audit:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, arm64, playwright]
    # 20, not 10 — same reason as ci.yml's audit job: the retry needs room, and this is
    # the job that gates `shrink-deploy`, so a slow runner here blocks the container.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # NOT on the self-hosted runner: `cache: pnpm` pulled a 377 MB archive from
          # GitHub's cache service at 0.4-0.7 MB/s to rebuild a store already on local
          # disk. `runner.environment` keeps this correct if a job ever runs on GitHub
          # again, where the store IS ephemeral and the archive genuinely helps.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Vulnerability audit (high/critical)
        run: |
          # audit-ci exits 1 for BOTH "found a high/critical advisory" and "could not reach
          # the advisory registry", and `deploy` lists this job in `needs` — so on
          # 2026-09-04 a degraded runner blocked the production deploy FIVE times while the
          # same audit passed locally on the same commit. The log's tell is
          # `code ERR_SOCKET_TIMEOUT: undefined` and, decisively, the absence of any
          # advisory list: when audit-ci finds something it prints it.
          #
          # ⚠️ audit-ci's OWN retry cannot help here, and the config's comment claiming it
          # does was wrong. It retries only when the error message matches
          # `PARTIAL_RETRY_ERROR_MSG[packageManager]`, and upstream ships
          # `pnpm: []  // TODO: Identify retry-able error message for pnpm`. So
          # `retry-count` has never retried anything in this repo, and `--pass-enoaudit`
          # is gated on the same flag and would be equally inert — checked in
          # audit-ci@7.1.0/dist/bin.cjs.
          #
          # So retry HERE, and only on the network signature. A real advisory prints its
          # list and must fail on the very first attempt: this must never be able to turn a
          # finding into a pass.
          #
          # ⚠️ TWO ATTEMPTS, AND THE COUNT IS ARITHMETIC, NOT TASTE. This shipped at 3 and
          # the job died at its own 20-minute ceiling mid-attempt-3 on the very next run —
          # `cancelled`, which reads exactly like a second push having killed it. Measured
          # from that run: `pnpm/action-setup` 426s, checkout+node+install 31s, so ~460s of
          # fixed cost before this step even starts, and a failing attempt took 251s then
          # 266s. 3 attempts = 460 + 3x270 + 2x15 = 1,300s = 21.7 min > 20. 2 attempts =
          # 1,015s = 16.9 min, which fits with three minutes of slack.
          #
          # Do NOT "fix" this by raising the ceiling instead. The numbers above were already
          # in this comment when it shipped at 3 — the arithmetic was wrong, not the budget.
          # And a third attempt cannot help what actually happens: on 2026-09-04 the registry
          # timed out twice in a row from the runner while `audit-ci` passed from a laptop in
          # 102s, and it had failed the same way the day before. A retry buys you a genuine
          # one-off blip; it cannot outlast a runner-network condition. That is what the
          # "Re-run this job" in the exhaustion message is for.
          attempts=2
          for i in $(seq 1 $attempts); do
            if pnpm exec audit-ci --config audit-ci.jsonc > audit.out 2>&1; then
              cat audit.out
              exit 0
            fi
            cat audit.out
            if ! grep -q 'ERR_SOCKET_TIMEOUT' audit.out; then
              echo "::error::audit-ci failed on a FINDING, not a network error — not retrying."
              exit 1
            fi
            echo "::warning::attempt $i of $attempts could not reach the advisory registry (ERR_SOCKET_TIMEOUT); this is not a vulnerability."
            if [ "$i" -lt "$attempts" ]; then sleep 15; fi
          done
          echo "::error::audit-ci could not reach the advisory registry after $attempts attempts. NOT a vulnerability — no advisory list was printed. Re-run this job."
          exit 1

      # ── Base-image CVEs ──────────────────────────────────────────────────
      # audit-ci above answers "is any npm dependency known-vulnerable". Nothing
      # answered the same question about the OPERATING SYSTEM the container runs
      # on, and that image is digest-pinned (apps/shrink/Dockerfile) with nothing
      # refreshing it — deliberately, because sharp links against its system libs
      # and a moving tag changes printed artwork. The pin is correct; being
      # unable to SEE it age is not. This is the missing half.
      #
      # It scans the pinned digest directly rather than a built image: it is the
      # digest that never moves, it needs no build, and npm deps inside the image
      # are already covered by audit-ci and the SBOM licence gate.
      #
      # ⚠️ THE GATE IS SCOPED TO `vuln-type: os`, AND THAT IS THE WHOLE DESIGN.
      # MEASURED 2026-08-25 against the pinned digest before this shipped:
      #   * debian 12.15 layer  — 0 vulnerabilities, clean
      #   * node-pkg layer      — 1 CRITICAL, CVE-2026-59873, tar 7.5.16 -> 7.5.19
      # That tar lives in npm's OWN bundled node_modules inside the base image. It
      # is marked "fixed" upstream, so --ignore-unfixed does NOT filter it, and it
      # is not fixable from this repository: the only remedy is a Node image that
      # bundles a newer npm. An unscoped gate therefore blocks EVERY shrink deploy
      # on a CVE nobody here can close, which is precisely how a gate gets switched
      # off and stops protecting anything.
      #
      # The OS layer is also the honest scope: it is what the digest pin exists to
      # freeze (sharp links against these system libs) and what a digest bump can
      # actually change. This repo's own npm dependencies are already gated by
      # audit-ci above and by the SBOM licence check — so nothing is unwatched.
      #
      # The informational step above keeps the DEFAULT scope (os,library), so the
      # tar finding still prints on every run. Visible, but not blocking.
      #
      # ⚠️ The input is `vuln-type`, NOT `pkg-types`. The action's own action.yaml
      # carries "# TODO: rename to pkg-types" — the Trivy CLI renamed the flag and
      # the wrapper has not. An unknown input is IGNORED SILENTLY by Actions, which
      # would restore the unscoped scan and fail the deploy while looking correct.
      # Read the digest FROM the Dockerfile rather than repeating it here. A
      # second copy of a pinned value is the same defect as the `main` ruleset's
      # required-checks list being a second copy of `deploy.needs`: bump one, and
      # the other keeps testing something that is no longer shipped, while
      # staying green. The `-z` guard matters as much as the grep — an empty ref
      # would make Trivy scan nothing and pass, which is the exact failure this
      # whole job was added to stop.
      - name: Read the pinned base image from the Dockerfile
        id: baseimage
        run: |
          set -euo pipefail
          ref=$(grep -oE '^FROM +[^ ]+' apps/shrink/Dockerfile | head -1 | awk '{print $2}')
          if [ -z "$ref" ] || [ "${ref#*@sha256:}" = "$ref" ]; then
            echo "::error::Could not read a digest-pinned FROM from apps/shrink/Dockerfile (got '$ref')."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Scanning $ref"

      # ⚠️ SCAN THE REGISTRY, NOT THE LOCAL DAEMON — AND THAT BECAME LOAD-BEARING
      # ON 2026-09-08. Trivy prefers a reachable Docker daemon over the registry, and
      # this runner now mounts the host socket so `shrink-deploy` can build the
      # container. The host is an arm64 Mac; the base image is pinned BY DIGEST to
      # amd64 content. The daemon holds the arm64 variant under that tag and cannot
      # produce the pinned digest, so the scan died:
      #
      #     FATAL unable to export the image: ... content digest sha256:e9b5516b...:
      #     not found
      #
      # Which reads as a corrupt image or a bad pin, and is neither. `remote` skips
      # the daemon entirely and is also the more correct question: this step audits
      # the UPSTREAM image we pinned, not whatever a local daemon happens to hold.
      # Verified 2026-09-08 — a registry scan of the pinned digest returns a real
      # report (4 HIGH in brace-expansion / ip-address / tar).
      - name: Base image report (informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
        # ⚠️ `exit-code: '0'` DOES NOT MAKE THIS STEP INFORMATIONAL, WHICH IS HOW A
        # STEP NAMED "(informational)" FAILED THE JOB AND BLOCKED THE DEPLOY.
        # That input governs the exit code for FINDINGS; a scanner that CRASHES still
        # exits non-zero and still fails the step. Same distinction ci.yml's gitleaks
        # step already records: "A failed fetch and a failed scan are not the same
        # result and must not look the same." The gate below is the one that may fail.
        continue-on-error: true
        with:
          # ⚠️ GITHUB'S CACHE SERVICE IS THE SLOWEST THING ON A SELF-HOSTED RUNNER, AND
          # IT TIMED THIS JOB OUT. Verified against the pinned action.yaml: `cache`
          # defaults to 'true', which gates an `actions/cache` restore/save around the
          # vulnerability DB. On run 34246137969 that cost:
          #
          #     step  8  Base image report        10m 08s   <- cache RESTORE timing out
          #     step  9  Fail on fixable CRITICAL  2m 37s
          #     step 14  Post-step (cache save)    6m 02s   <- then failing to SAVE it
          #     => "The job has exceeded the maximum execution time of 20m0s"
          #
          # with `Failed to restore: The operation cannot be completed in timeout` and
          # `Cache save failed` in the annotations. 10m08s is GitHub's own cache-restore
          # timeout, almost to the second. Identical in shape to `cache: pnpm` on
          # setup-node, which pulled 377 MB per job to rebuild a store already on disk.
          #
          # ⚠️ RAISING `timeout-minutes` WOULD BE THE WRONG FIX, and .github/CLAUDE.md
          # already records why from the 2026-08-18 apt outage: lifting one ceiling only
          # moves which job absorbs the problem.
          #
          # So: no cache service, and a DB directory that PERSISTS inside the runner's own
          # volume — the same fix that made pnpm fast here. `runner.environment` keeps a
          # GitHub-hosted run on its normal path, where the cache genuinely helps because
          # the disk is ephemeral.
          cache: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
          cache-dir: ${{ runner.environment == 'github-hosted' && format('{0}/.cache/trivy', github.workspace) || '/trivy-cache' }}
          scan-type: image
          image-ref: ${{ steps.baseimage.outputs.ref }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      # This one IS a gate and fails closed on purpose — no continue-on-error. Its
      # daemon-dependent failure mode is removed by TRIVY_IMAGE_SRC above, so a
      # failure here now means a fixable CRITICAL in the base OS layer, which is
      # exactly what it is for.
      - name: Fail on a fixable CRITICAL in the base OS layer
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
        with:
          # Same reasoning as the step above — see the note there.
          cache: ${{ runner.environment == 'github-hosted' && 'true' || 'false' }}
          cache-dir: ${{ runner.environment == 'github-hosted' && format('{0}/.cache/trivy', github.workspace) || '/trivy-cache' }}
          scan-type: image
          image-ref: ${{ steps.baseimage.outputs.ref }}
          format: table
          vuln-type: os
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # Secret scanning, mirroring ci.yml — and note the lesson recorded there: a scan
  # that cannot be named in a `needs:` list is not a gate. This job exists so the
  # shrink deploy has one, rather than relying on ci.yml's, which runs in a
  # different workflow and therefore cannot block this deploy.
  shrink-secrets:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, playwright]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history — a secret is usually in an older commit

      # RUNS THE GITLEAKS BINARY, NOT gitleaks/gitleaks-action. ci.yml made this
      # change on 2026-08-18 and this file was missed, so for three months the
      # gate that blocks THIS deploy was inert. Measured on run 32506101672
      # (2026-08-21), which reported success:
      #
      #     [RUN-APPAREL] is an organization. License key is required.
      #     INF 0 commits scanned.
      #     INF no leaks found
      #
      # ZERO commits scanned, "no leaks found", exit 0 — while `fetch-depth: 0`
      # above pulled the entire history precisely so it could be searched. Worse
      # than the ci.yml case that prompted the original fix, which at least
      # managed 1 commit and ~60 bytes. The Action is free for personal accounts
      # and PAID for organisations; unlicensed it silently degrades to a range
      # that resolves to nothing rather than failing loudly.
      #
      # The gitleaks SCANNER is MIT and free. Only the wrapper is commercial.
      #
      # Consequences of dropping the wrapper, both deliberate and both mirroring
      # ci.yml: `pull-requests: read` is gone from this job's permissions (only
      # the Action needed it, to list a PR's commits), and no GITHUB_TOKEN is
      # passed, because nothing here talks to the API.
      #
      # --redact so a hit never prints the secret into the log.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # gitleaks' own published checksums, ONE PER ARCH.
          # ⚠️ BOTH ARE NEEDED SINCE 2026-09-08, when CI moved to a self-hosted arm64
          # runner. This step hardcoded `linux_x64`, which is not a binary an arm64
          # machine can execute — and `shrink-secrets` is in `shrink-deploy.needs`, so
          # getting it wrong blocks the container deploy. This file kept the commercial
          # ACTION for three months after ci.yml replaced it, scanning 0 commits while
          # reporting success; .github/CLAUDE.md's trap generalises the lesson as "a fix
          # to one of these two workflows is only half a fix. Grep the other." That is
          # precisely what happened again here on 2026-09-08 with the arch.
          GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        run: |
          set -euo pipefail
          # Kept identical to ci.yml's secrets job — see the note there. A CDN 504
          # on run 33264929752 failed that gate on a PR containing no secret,
          # because the SCANNER never downloaded. This file carries a duplicate of
          # that job on purpose (a scan in another workflow cannot appear in this
          # deploy's needs:), and the gitleaks history above records what happens
          # when only one of the two copies gets a fix: the wrapper survived here
          # for three months, scanning ZERO commits, green.
          # Resolve the arch, and REFUSE an unknown one rather than guessing. A wrong
          # guess downloads a binary that cannot execute, and the failure reads as
          # "gitleaks is broken" rather than "wrong architecture".
          case "$(uname -m)" in
            x86_64|amd64) GL_ARCH=x64;    GL_SHA="${GITLEAKS_SHA256_X64}" ;;
            aarch64|arm64) GL_ARCH=arm64; GL_SHA="${GITLEAKS_SHA256_ARM64}" ;;
            *) echo "::error::unsupported arch $(uname -m) — add its gitleaks checksum"; exit 1 ;;
          esac
          echo "gitleaks ${GITLEAKS_VERSION} for linux_${GL_ARCH}"
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz"
          # ⚠️ VERIFY THE ARCHIVE BEFORE UNPACKING IT — L9-06, 2026-08-31.
          # Until now this downloaded a binary over the network and RAN it, with the
          # only check being that `gitleaks version` printed something. That proves
          # the bytes are a working executable; it says nothing about WHOSE. This is
          # the tool whose job is to stop secrets leaving the repository, running
          # with the checkout in front of it.
          # The digest is gitleaks' own published checksum for this exact version.
          # ⚠️ BUMP IT WITH GITLEAKS_VERSION — they change together, and a stale
          # digest fails loudly here rather than silently skipping, which is the
          # behaviour worth having.
          echo "${GL_SHA}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

  shrink-deploy:
    # FOUR gates, matching ci.yml. `artwork`, `audit` and `secrets` joined on
    # 2026-08-08; before that this deploy was gated on `verify` alone.
    needs: [shrink-verify, shrink-artwork, shrink-audit, shrink-secrets]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, arm64, playwright]
    timeout-minutes: 45
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # NOT on the self-hosted runner: `cache: pnpm` pulled a 377 MB archive from
          # GitHub's cache service at 0.4-0.7 MB/s to rebuild a store already on local
          # disk. `runner.environment` keeps this correct if a job ever runs on GitHub
          # again, where the store IS ephemeral and the archive genuinely helps.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      # Captured BEFORE the deploy, because the drift assertion at the end of this
      # job compares the image's LAST MODIFIED against it. Recording it afterwards
      # would make the image always look older than the run and fail every deploy.
      - name: Record time before deploy
        id: t0
        run: echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy shrink worker + container image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ⚠️ WITHOUT THIS, AN ARM64 RUNNER SHIPS AN ARM64 IMAGE TO AN AMD64 PLATFORM.
          # `apps/shrink/Dockerfile` says it in its own header — "Must run on
          # linux/amd64. Build in CI (amd64 runners) or, on an arm64 Mac, with
          # `--platform linux/amd64`" — and that instruction was load-bearing on the
          # RUNNER being amd64, which stopped being true on 2026-09-08 when this job
          # moved to a self-hosted Apple Silicon Mac. `wrangler deploy` passes no
          # platform of its own, so the build would silently follow the host and
          # produce an image Cloudflare cannot run. Docker reads this variable for
          # every build, so it is correct on BOTH machines: a no-op on an amd64
          # runner, the required flag on this one.
          #
          # Verified on the Mac 2026-09-08: `DOCKER_DEFAULT_PLATFORM=linux/amd64`
          # produced `Architecture: amd64` with `uname -m` reporting `x86_64` inside
          # the built image. Emulation is available; expect the `npm ci` layer (sharp
          # links against system libs) to be slower than native — `timeout-minutes: 45`
          # above is the headroom for it.
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        # `wrangler deploy` builds the Dockerfile locally (Docker reaches the host
        # daemon through the socket this runner mounts — see infra/ci-runner/start.sh)
        # and pushes it to Cloudflare's registry, then deploys.
        # See the version-labelling note in ci.yml's CMS deploy step.
        # ⚠️ `run: |`, NOT a plain scalar. A plain YAML scalar folds its newlines into
        # SPACES, so a trailing `\` survives into the shell as a literal backslash and
        # bash reads `\ ` as an escaped space — the command silently loses its flag
        # boundary. Written the wrong way first, on 2026-08-31, and caught by folding
        # the scalar by hand rather than by reading it.
        run: |
          pnpm --filter @run-apparel/shrink exec wrangler deploy \
            --message "${GITHUB_SHA:0:7} ${GITHUB_REF_NAME}"

      # ⚠️ ASSERT THE ARCH THAT WAS ACTUALLY BUILT, NOT THE ONE WE ASKED FOR.
      # DOCKER_DEFAULT_PLATFORM above is an instruction; this is the measurement. A
      # wrong-arch image deploys clean and fails only when a garment is processed —
      # and the drift check below cannot see it, because the image DID move. This
      # repo's recurring failure is a green gate over a broken production path.
      #
      # Deliberately asymmetric: finding no local image is a WARNING (wrangler may
      # tag or prune differently in a future version, and a check that guesses wrong
      # would block deploys for no reason), while finding an arm64 one is an ERROR.
      # Only positive evidence of the defect fails the job.
      - name: Assert the container image is amd64
        run: |
          set -euo pipefail
          imgs=$(docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null \
                 | grep -iE 'shrink|cloudflare' || true)
          if [ -z "$imgs" ]; then
            echo "::warning::no local shrink image found to inspect — arch NOT verified. If wrangler changed how it tags the build, fix this step rather than deleting it."
            exit 0
          fi
          bad=0
          for i in $imgs; do
            a=$(docker image inspect "$i" --format '{{.Architecture}}' 2>/dev/null || echo unknown)
            echo "  $i -> $a"
            if [ "$a" = "arm64" ] || [ "$a" = "aarch64" ]; then bad=1; fi
          done
          if [ "$bad" = "1" ]; then
            echo "::error::An arm64 container image was built. Cloudflare Containers run amd64 — this image would fail at runtime while the deploy reported success. DOCKER_DEFAULT_PLATFORM did not take effect."
            exit 1
          fi
          echo "amd64 confirmed."

      # ALERTING ONLY EXISTS IF THIS RUNS.
      #
      # Found 2026-08-30: the shrink Worker's failure alerting was built on
      # 2026-08-29 and its one required secret was never set. `wrangler secret list
      # --name run-apparel-viewer-shrink` returned exactly CMS_ROBOT_API_KEY,
      # R2_INGEST_ACCESS_KEY_ID and R2_INGEST_SECRET_ACCESS_KEY. `apps/shrink/src/
      # sentry.ts` is a deliberate no-op without a DSN — "safe to deploy before the
      # DSN exists" — so a failed garment told nobody, quietly, and the code looked
      # correct the whole time.
      #
      # A one-off `wrangler secret put` from a laptop would fix it once and leave the
      # value existing only inside Cloudflare: recreate the Worker and the alerting
      # goes inert again, silently, which is the same failure. Mirrors ci.yml's
      # PAYLOAD_SECRET step so the value is under version-controlled process.
      #
      # Gated inside the shell rather than by `if:` on purpose — a job-level `env:`
      # would put the DSN in the environment of `pnpm install` too, which is the
      # exposure this repo is separately closing.
      # ⚠️ SHRINK_SENTRY_DSN, NOT SENTRY_DSN — L6-08, corrected 2026-08-31. The secret
      # used to be called `SENTRY_DSN`, and it carried the VIEWER's DSN, so the one
      # thing this step exists to enable would have filed pipeline failures into the
      # browser project. Three systems now have three projects: the viewer on
      # `vars.VITE_SENTRY_DSN` (project 4511868353708032), the CMS on
      # `secrets.CMS_SENTRY_DSN` (4512006205865984), and this on
      # `secrets.SHRINK_SENTRY_DSN` (4512006291718144). The rename is the point: three
      # differently-scoped values called some variant of "the Sentry DSN" is how the
      # wrong one gets used, and one already was.
      - name: Apply worker secret (SENTRY_DSN, shrink project)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHRINK_SENTRY_DSN: ${{ secrets.SHRINK_SENTRY_DSN }}
        run: |
          if [ -z "$SHRINK_SENTRY_DSN" ]; then
            echo "::warning::SHRINK_SENTRY_DSN secret is not set — the shrink robot's failure alerting is INERT. Set it with: gh secret set SHRINK_SENTRY_DSN"
            exit 0
          fi
          printf '%s' "$SHRINK_SENTRY_DSN" | pnpm --filter @run-apparel/shrink exec wrangler secret put SENTRY_DSN

      # Proof the IMAGE moved, not just the Worker script. On 2026-07-27 a
      # pipeline fix shipped to the CMS while the container kept running a
      # three-day-old image, because this job had already failed and nothing
      # said so at a glance. `wrangler containers list` prints LAST MODIFIED;
      # compare it against this run's timestamp before believing a deploy.
      # ⚠️ THIS ASSERTED NOTHING UNTIL 2026-08-30. It printed a timestamp and a
      # table and exited 0 whatever they said — so the whole check was "a human
      # will compare two numbers in a log", which is the same as no check. Its own
      # comment above describes the incident it was meant to prevent (a pipeline fix
      # shipping while the container kept running a three-day-old image), so the
      # intent was right and only the enforcement was missing.
      #
      # It now compares against the timestamp captured BEFORE `wrangler deploy` and
      # fails if the image did not move. A stale image means the Worker script
      # updated and the code that actually processes garments did not.
      - name: Assert the container image actually moved (drift check)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BEFORE: ${{ steps.t0.outputs.epoch }}
        run: |
          set -euo pipefail
          echo "This run started: $(date -u -d "@$BEFORE" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -r "$BEFORE" +%Y-%m-%dT%H:%M:%SZ)"
          out=$(pnpm --filter @run-apparel/shrink exec wrangler containers list 2>&1)
          echo "$out"

          # `containers list` prints a LAST MODIFIED column as an ISO-8601 stamp.
          # Take the newest one it shows; if the format ever changes, `modified` is
          # empty and the check WARNS rather than failing a good deploy on a parse.
          modified=$(printf '%s\n' "$out" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]+' | sort -r | head -1 || true)
          if [ -z "$modified" ]; then
            echo "::warning::could not parse a LAST MODIFIED timestamp from \`wrangler containers list\` — drift NOT verified. Check the table above by hand and fix this parser."
            exit 0
          fi

          modified_epoch=$(date -u -d "$modified" +%s 2>/dev/null || date -u -jf "%Y-%m-%dT%H:%M:%S" "$modified" +%s)
          echo "Image last modified: $modified"
          if [ "$modified_epoch" -lt "$BEFORE" ]; then
            echo "::error::The container image did NOT move. The Worker script deployed but the image that actually processes garments is older than this run — a pipeline fix has shipped to nothing. See docs/RUNBOOK.md."
            exit 1
          fi
          echo "Image is newer than the start of this run — the deploy moved it."
