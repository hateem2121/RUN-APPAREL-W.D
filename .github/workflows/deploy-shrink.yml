name: Deploy shrink service

# Deploys the separate GLB shrink Worker + Container (apps/shrink). Kept out of
# the main ci.yml deploy job because `wrangler deploy` builds a Docker image here
# (ubuntu-latest has Docker), which is slower and only needs to run when the
# shrink service itself changes.
#
# PREREQUISITES (one-time go-live, see docs/RAW-UPLOAD-PIPELINE.md):
#   - R2 bucket `run-apparel-viewer-ingest` exists.
#   - Queues `glb-shrink` and `glb-shrink-dlq` exist.
#   - Secrets set on the worker: R2_INGEST_ACCESS_KEY_ID, R2_INGEST_SECRET_ACCESS_KEY,
#     CMS_ROBOT_API_KEY; and R2_INGEST_S3_ENDPOINT var points at the real account.
# Until those exist, this deploy will fail (harmlessly — it never touches the live
# CMS or viewer).
#
# ⚠️ API TOKEN SCOPE. This job builds a Docker image and PUSHES it to Cloudflare's
# container registry, which a plain "Edit Cloudflare Workers" token cannot do. It
# failed on every run until 2026-07-28 with the image built successfully and then:
#
#     ✘ [ERROR] ApiError: Forbidden
#       body: { error: 'Authentication error' }
#
# CLOUDFLARE_API_TOKEN must be a CUSTOM token (there is no template) carrying, on
# top of the usual Workers Scripts:Edit and the Edit permission for every bound
# resource — Account · Containers:Edit and Account · Cloudchamber:Edit. Both are
# needed: wrangler still routes container work through its cloudchamber client,
# and its own OAuth flow requests `containers:write` AND `cloudchamber:write`.
# Add User · User Details:Read too, or every run ends with a confusing
# "Unable to retrieve email for this user" warning. Full table: docs/RUNBOOK.md.

on:
  push:
    branches: [main]
    # Markdown under tools/asset-pipeline/ must not redeploy the container:
    # that glob is directory-wide and the directory holds README.md and
    # CLAUDE.md, so c0a6728 (2026-08-12) built and pushed a Docker image for a
    # docs-only commit. Order matters — a later `!` excludes an earlier match.
    # `**.md` not `**/*.md`: '**.js' is GitHub's documented extension idiom.
    paths:
      - 'apps/shrink/**'
      - 'tools/asset-pipeline/**'
      - '!tools/asset-pipeline/**.md'
      - '.github/workflows/deploy-shrink.yml'
  workflow_dispatch:

concurrency:
  group: deploy-shrink
  cancel-in-progress: false

# Least privilege by default — see the longer note in ci.yml. This workflow
# builds a Docker image from the repository and pushes it to Cloudflare's
# registry, so the GITHUB_TOKEN it carries alongside CLOUDFLARE_API_TOKEN should
# be able to read the repository and nothing else. The `secrets` job below
# declares the extra `pull-requests: read` that gitleaks needs.
permissions:
  contents: read

jobs:
  # GATE. This workflow had no `needs:` at all until 2026-08-03: it triggers on
  # pushes touching apps/shrink/** or tools/asset-pipeline/**, ran in parallel
  # with ci.yml, and shipped a new container image whether or not `verify` there
  # passed. So the one code path every real garment goes through — the pipeline
  # that decimates meshes and re-encodes printed artwork — was the one code path
  # nothing gated. A broken simplify setting could reach production while the
  # main CI run was still going red next to it.
  #
  # Deliberately a copy of ci.yml's checks rather than a `workflow_call` into it:
  # ci.yml's verify also builds the viewer, seeds assets and runs Playwright,
  # none of which this deploy depends on, and coupling them would mean a viewer
  # e2e flake blocking a pipeline fix.
  verify:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Not a workspace member, so `pnpm typecheck` skips it — and it is the
      # server that drives the pipeline for every upload.
      - name: Typecheck shrink container
        working-directory: apps/shrink/container
        run: npm install --no-audit --no-fund && npx tsc --noEmit
      - run: pnpm test

  # THE ARTWORK GATE, ON THE PATH THAT DECIMATES ARTWORK.
  #
  # Added 2026-08-08. Until then this workflow ran typecheck + unit tests ONLY,
  # while ci.yml gated its deploy on four jobs including `pnpm eval:artwork`. The
  # asymmetry was exactly backwards: ci.yml's paths do not touch decimation, and
  # THIS one does — it is the only workflow that fires on `tools/asset-pipeline/**`
  # and it ships the container that runs the pipeline over every real garment.
  #
  # The gap mattered because of the finding at the top of CLAUDE.md: the three
  # blocking gates test `alphaMode`, which decimation does not change, so a preset
  # that smears a printed wordmark passes typecheck, passes `pnpm test`, passes all
  # three structural gates, and ships. The 2026-08-05 sweep proved it — run F
  # rendered the chest wordmark illegible and reported `wouldShip: true`. This eval
  # is the only automated thing in the repo that looks at the letters, and it was
  # not running on the one path that can damage them.
  #
  # Deliberately a copy of ci.yml's job rather than a `workflow_call`, for the same
  # reason the `verify` job above is a copy — see the note there.
  artwork:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium only; the render harness runs software WebGL via swiftshader.
      # Cache key matches ci.yml's artwork job on purpose — same browser set, same
      # Playwright version, so the two workflows share one cache entry.
      - name: Resolve Playwright version
        id: pw
        run: echo "v=$(node -p 'require("./tools/asset-pipeline/node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}-chromium
      - name: Install Chromium for the render harness (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @run-apparel/asset-pipeline exec playwright install --with-deps chromium
      - name: Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @run-apparel/asset-pipeline exec playwright install-deps chromium
      - name: Artwork legibility eval
        run: pnpm eval:artwork

  # Dependency vulnerability gate, mirroring ci.yml. This workflow ships a Docker
  # image built from the repo's own dependency tree, so "ci.yml already audits it"
  # was never true for the container.
  audit:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vulnerability audit (high/critical)
        run: pnpm exec audit-ci --config audit-ci.jsonc

  # Secret scanning, mirroring ci.yml — and note the lesson recorded there: a scan
  # that cannot be named in a `needs:` list is not a gate. This job exists so the
  # shrink deploy has one, rather than relying on ci.yml's, which runs in a
  # different workflow and therefore cannot block this deploy.
  secrets:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history — a secret is usually in an older commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  deploy:
    # FOUR gates, matching ci.yml. `artwork`, `audit` and `secrets` joined on
    # 2026-08-08; before that this deploy was gated on `verify` alone.
    needs: [verify, artwork, audit, secrets]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy shrink worker + container image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `wrangler deploy` builds the Dockerfile locally (Docker is preinstalled
        # on ubuntu-latest) and pushes it to Cloudflare's registry, then deploys.
        run: pnpm --filter @run-apparel/shrink exec wrangler deploy

      # Proof the IMAGE moved, not just the Worker script. On 2026-07-27 a
      # pipeline fix shipped to the CMS while the container kept running a
      # three-day-old image, because this job had already failed and nothing
      # said so at a glance. `wrangler containers list` prints LAST MODIFIED;
      # compare it against this run's timestamp before believing a deploy.
      - name: Show container image state (drift check)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "This run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pnpm --filter @run-apparel/shrink exec wrangler containers list
