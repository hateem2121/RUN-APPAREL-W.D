name: WAF exempt cms subdomain (temporary)

on:
  workflow_dispatch:

jobs:
  exempt:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE: 805d8ae5fa0dea40c960a2561f66d141
    steps:
      - name: Inspect existing custom firewall ruleset
        run: |
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/rulesets/phases/http_request_firewall_custom/entrypoint" \
            -H "Authorization: Bearer $TOKEN" -o /tmp/rs.json
          echo "=== success + rule count + existing descriptions ==="
          jq '{success, id: .result.id, rules: (.result.rules|length), descriptions: [.result.rules[]?.description]}' /tmp/rs.json || cat /tmp/rs.json | head -c 800

      - name: Create skip rule for cms.wear-run.help
        run: |
          RID=$(jq -r '.result.id // empty' /tmp/rs.json)
          SKIP='{"action":"skip","expression":"(http.host eq \"cms.wear-run.help\")","description":"Exempt CMS API subdomain from bot challenges (public viewer API)","action_parameters":{"ruleset":"current","phases":["http_request_sbfm","http_request_firewall_managed"],"products":["securityLevel","bic","rateLimit","uaBlock","zoneLockdown","hot","waf"]}}'
          if [ -n "$RID" ]; then
            echo "Appending skip rule to existing ruleset $RID (position: top)"
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/rulesets/$RID/rules" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data "$(echo "$SKIP" | jq '. + {position:{index:1}}')" -o /tmp/out.json
          else
            echo "No custom ruleset yet — creating one with the skip rule"
            curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE/rulesets/phases/http_request_firewall_custom/entrypoint" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data "{\"rules\":[$SKIP]}" -o /tmp/out.json
          fi
          echo "=== result ==="
          jq '{success, errors, ruleAdded: (.result.rules[]? | select(.description|test("Exempt CMS")) | {id, action, expression})}' /tmp/out.json || cat /tmp/out.json | head -c 1200

      - name: Test cms.wear-run.help after exemption
        run: |
          sleep 10
          for i in 1 2 3 4 5; do
            echo "--- try $i ---"
            curl -s --max-time 25 -w " [HTTP %{http_code}]\n" https://cms.wear-run.help/api/health || true
            sleep 7
          done
