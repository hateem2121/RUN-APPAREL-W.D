name: Zone security probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE: 805d8ae5fa0dea40c960a2561f66d141
    steps:
      - name: Security level
        run: |
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/settings/security_level" \
            -H "Authorization: Bearer $TOKEN" | head -c 600; echo
      - name: Bot fight mode
        run: |
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/bot_management" \
            -H "Authorization: Bearer $TOKEN" | head -c 800; echo
      - name: WAF custom rules
        run: |
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/rulesets/phases/http_request_firewall_custom/entrypoint" \
            -H "Authorization: Bearer $TOKEN" | head -c 2000; echo
      - name: Legacy firewall rules
        run: |
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/firewall/rules" \
            -H "Authorization: Bearer $TOKEN" | head -c 1500; echo
      - name: Managed challenge / super bot fight
        run: |
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE/rulesets/phases/http_request_sbfm/entrypoint" \
            -H "Authorization: Bearer $TOKEN" | head -c 1500; echo
