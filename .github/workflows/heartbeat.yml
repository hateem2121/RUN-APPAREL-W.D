name: Heartbeat

# WHO WATCHES THE MONITORS.
#
# On 2026-08-05 the uptime workflow failed at `actions/checkout` for ~23 hours and
# opened no alert at all. Not because the alerting was broken — because it never
# reached the step that decides to alert. `uptime.yml` gates its issue on
# `steps.check.outputs.ok == 'false'`, and a job that dies before setting that
# output produces silence, which is indistinguishable from a healthy site.
#
# That was fixed as a permissions bug (9c8e883). The CLASS of failure was not: any
# scheduled workflow here can still die before it measures anything, and nothing
# would say so. This is the thing that says so.
#
# It works by asking the Actions API when each watched workflow last SUCCEEDED,
# rather than by being told. Nothing has to remember to report in, so a workflow
# that stops running entirely — deleted, disabled, renamed, quietly skipped — is
# caught by the same check as one that fails.
#
# ⚠️ This workflow cannot watch itself. That is the base case and it is accepted:
# the point is to shrink the blind spot from "every scheduled job" to "one job that
# does nothing but one API call". If you want to close it completely you need an
# off-platform monitor, which this project's budget does not run to.

on:
  schedule:
    # Every 6 hours. This comment used to say "Uptime runs every 15 minutes, so 6
    # hours is ~24 missed runs". Uptime is SCHEDULED every 15 minutes but measured
    # 2026-08-10 GitHub delivers a median gap of ~45 min, so 6 hours is nearer ~8
    # missed runs. Still far past ordinary skew, and it still caps how long a dead
    # monitor can stay unnoticed at a quarter of the 23 hours it managed last time.
    #
    # ⚠️ The same measurement puts the worst observed uptime gap at 6.1 h, which is
    # TWICE the 3 h budget in WATCHED below — so the premise "each budget is
    # several times the workflow's own interval" no longer holds for uptime.yml.
    # Deliberately not changed here; see docs/RUNBOOK.md → "Uptime alerts".
    - cron: '43 */6 * * *'
  workflow_dispatch:

# `contents: read` is here even though NOTHING IS CHECKED OUT and it is not needed
# today. It is deliberate inoculation: a `permissions:` block REPLACES the default
# grants, so the moment someone adds `actions/checkout` to this file — exactly what
# happened to uptime.yml in 8301e60 — it would 404 with "Repository not found" and
# this monitor would join the list of things that fail silently. The irony would be
# total. `actions: read` is what `gh run list` actually needs.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  check:
    # Same gate as the workflows it watches. Before go-live they are all skipped on
    # purpose, and alerting that they have not run would be noise about a deliberate
    # state rather than a fault.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check each scheduled workflow has succeeded recently
        id: check
        run: |
          set -euo pipefail

          # workflow-file:max-age-hours:human-cadence
          # Each budget was chosen to be several times the workflow's own interval,
          # so that ordinary GitHub cron skew would never trip it and only a real
          # stoppage would.
          #
          # ⚠️ Measured 2026-08-10, that is NO LONGER TRUE for uptime.yml. GitHub
          # delivers a median gap of ~45 min against a scheduled 15, and the worst
          # observed gap over 94 h was 6.1 h.
          #
          # ⚠️ uptime.yml is DAILY since 2026-08-18 (cron '23 7 * * *'). At */15 it
          # billed ~1,200 of the 2,000 free Actions minutes a month and the exhausted
          # quota stopped a deploy; liveness moved to the external monitor, which polls
          # every 5 min for no Actions minutes. See docs/RUNBOOK.md → "Uptime alerts".
          #
          # This budget was left at 3 h when that landed, so a DAILY job breached a
          # THREE-HOUR budget every single day — issue #31, which would have re-opened
          # forever. A monitor that cries wolf daily is one nobody reads, which is the
          # exact failure the header of this file was written to prevent.
          #
          # 36 h, not 24 h: worst measured delivery gap is 6.1 h, so the worst
          # inter-run gap for a daily cron is ~30.1 h, and the test below is `-gt`,
          # firing at 31 h. 30 h would sit one hour from a false alarm.
          #
          # NOTE the field separator is `:`. This used to warn that a cadence label
          # must never contain one or it would "silently truncate". ⚠️ MEASURED
          # 2026-08-19 and that is WRONG: `read` assigns the unconsumed remainder,
          # delimiters included, to the LAST variable, so `daily at 07:23 UTC` arrives
          # whole. Verified against this exact loop shape. A colon in `hours` WOULD
          # break — that field is not last — but a cadence label is safe.
          # FIELDS: file:hours:mode:cadence  — `cadence` stays LAST so `read` can
          # absorb its colons (see the note above).
          #
          # `mode` decides WHICH QUESTION is asked, and it was added 2026-08-30
          # because the two are not the same question:
          #
          #   success   — "did it run AND pass?"  Right for a workflow whose whole
          #               job is to succeed quietly (a backup, a digest).
          #   completed — "did it RUN at all?"    Right for uptime.yml, because
          #               uptime.yml now legitimately FAILS when the site is broken.
          #
          # ⚠️ WITHOUT THIS, FIXING uptime.yml BREAKS heartbeat.yml. Until 2026-08-30
          # uptime.yml always concluded `success` even while its own assertions were
          # failing, so `--status success` was satisfied every day and this loop never
          # fired. Now that it can go red, a genuine outage lasting past the budget
          # would make heartbeat open a SECOND issue saying the workflow has "no
          # successful run on record at all" and "a CHECK is not running" — which is
          # false: the check is running and correctly reporting the outage. A watchdog
          # that says the wrong thing during a real incident is this repo's
          # most-repeated recorded failure. uptime.yml owns "is the site up"; heartbeat
          # owns "is the watcher still watching".
          # lighthouse-live.yml (added 2026-09-16) is watched for COMPLETION, like
          # uptime.yml: failing is its job when a page regresses, so "no success" would
          # be a false alarm. Known limit: it also runs after every CI run on main and
          # its job is SKIPPED when CI failed — a skipped run still counts as completed,
          # so a stretch of red CI could hide a dead weekly schedule.
          # r2-budget.yml is watched for COMPLETION for the same reason: failing is its
          # job when R2 would bill, and a month over the line must read as "usage is
          # high", never as "the check stopped running".
          # link-crawl.yml (added 2026-09-23) is watched for COMPLETION for the same
          # reason: `scripts/link-crawl-probe.mjs` exits 1 on a broken link or a
          # mixed-content hit, so failing is its job. A link that stays broken past the
          # budget must read as "the crawl found a broken link", never as "the crawl
          # stopped running".
          # required-checks.yml (added 2026-09-24) is watched for COMPLETION too: it
          # exits 1 when the main ruleset and ci.yml's deploy.needs disagree, and 2 when
          # it cannot compare them, so failing is its job; heartbeat owns only whether
          # its daily schedule still runs at all.
          WATCHED="
          uptime.yml:36:completed:daily at 07:23 UTC
          nightly-backup.yml:36:success:nightly
          diagnostics-digest.yml:192:success:weekly on Mondays
          perf-watch.yml:192:success:weekly on Mondays
          lighthouse-live.yml:192:completed:weekly on Tuesdays, and after each deploy
          r2-budget.yml:192:completed:weekly on Mondays
          link-crawl.yml:192:completed:weekly on Mondays
          required-checks.yml:36:completed:daily at 04:29 UTC, and after each ci.yml change on main
          "

          # perf-watch.yml was NOT watched until 2026-08-30 — it could have stopped
          # running for weeks in silence, because nothing enumerated the workflows.
          #
          # The guard that every watched file still EXISTS lives in
          # `apps/cms/src/heartbeatMonitor.test.ts`, not here, and deliberately so:
          # this job checks nothing out (see the `permissions:` note above, which
          # warns against adding `actions/checkout`), so it cannot read
          # `.github/workflows/` at all. A rename would otherwise make this loop
          # report "no successful run on record at all" forever — indistinguishable
          # from a genuinely dead check.

          stale=""
          now=$(date -u +%s)

          while IFS=: read -r file hours mode cadence; do
            [ -z "$file" ] && continue

            # `--status success` alone is not enough: a run whose only job was
            # skipped by an `if:` also concludes as success, so a workflow that is
            # silently not doing its work would look healthy. Ask for the newest
            # successful run and treat "none at all" as stale rather than as pass.
            #
            # `mode: completed` asks the OTHER question — "did it run at all?" — for
            # a workflow that is allowed to fail on purpose. See the WATCHED comment.
            last=$(gh run list --workflow "$file" --status "$mode" --limit 1 \
                     --json createdAt --jq '.[0].createdAt // empty' 2>/dev/null || echo "")

            # The wording has to match the question, or the alert misleads whoever
            # reads it at 3am. "no successful run" on a workflow watched for
            # completion would be simply false while it is correctly reporting an
            # outage.
            case "$mode" in
              completed) verb="ran" ;;
              *) verb="succeeded" ;;
            esac

            if [ -z "$last" ]; then
              stale="${stale}- \`${file}\` — **has not ${verb} at all** on record (expected ${cadence})\n"
              echo "STALE  $file — no run matching '$mode' found"
              continue
            fi

            last_epoch=$(date -u -d "$last" +%s 2>/dev/null || date -u -jf "%Y-%m-%dT%H:%M:%SZ" "$last" +%s)
            age_h=$(( (now - last_epoch) / 3600 ))

            if [ "$age_h" -gt "$hours" ]; then
              stale="${stale}- \`${file}\` — last ${verb} **${age_h}h ago**, budget ${hours}h (runs ${cadence})\n"
              echo "STALE  $file — ${age_h}h old (budget ${hours}h)"
            else
              echo "ok     $file — ${age_h}h old (budget ${hours}h)"
            fi
          done <<< "$WATCHED"

          if [ -n "$stale" ]; then
            {
              echo 'stale<<STALE_EOF'
              printf '%b' "$stale"
              echo 'STALE_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      # Same "an open issue silences the alarm" defect uptime.yml carried, and the
      # same fix — see the long note above that step. In short: "if an open
      # `monitoring` issue exists, do nothing" has no sense of TIME, so one
      # unclosed issue disables this monitor permanently. That is precisely what a
      # forgotten `outage` issue did to uptime alerting for 17 days (issue #2,
      # 2026-07-21 → 2026-08-07). A watchdog that can be muted by its own previous
      # bark is not a watchdog.
      #
      # Commenting keeps the dedup goal (no pile of identical issues) while
      # guaranteeing a new finding still notifies.
      - name: Alert — create a monitoring issue, or comment on the open one
        if: steps.check.outputs.stale != ''
        env:
          # Passed through the environment rather than interpolated into the shell
          # with ${{ }}. The value is built by the step above from a fixed list of
          # filenames so it is not attacker-controlled, but expanding untrusted-ish
          # text directly into a `run:` block is a habit worth not having.
          STALE: ${{ steps.check.outputs.stale }}
          # This job runs every 6h and a stopped monitor is a slow-moving
          # condition, not an outage — so 12h means at most every other run
          # comments. Each comment carries the CURRENT full stale list, so a
          # delayed one is never a stale one.
          ALERT_QUIET_MINUTES: '720'
        run: |
          set -euo pipefail
          if ! label_out=$(gh label create monitoring --color fbca04 \
                             --description "A scheduled workflow has stopped running" 2>&1); then
            grep -qi 'already exists' <<<"$label_out" || echo "::warning::gh label create failed: $label_out"
          fi

          # %b (not %s) for $STALE — the step above builds it with literal \n.
          body=$(printf '%s\n\n%b\n%s\n' \
            "One or more scheduled workflows have not succeeded within their expected window:" \
            "$STALE" \
            "**This is not necessarily an outage.** It means a CHECK is not running, so the thing it watches is currently unobserved — which is how the uptime monitor sat dead for ~23 hours on 2026-08-05 while looking fine.

          Open the workflow in the Actions tab and read the most recent run. If it is failing at \`actions/checkout\` with \"Repository not found\" on this private repo, the cause is a \`permissions:\` block missing \`contents: read\` — see the note at the top of uptime.yml.")

          # `// empty` is load-bearing — see the note on the same line in
          # uptime.yml. Without it an empty list yields "null null", which is not
          # empty, so the first-ever alert would try to comment on issue #null
          # instead of creating one.
          existing=$(gh issue list --label monitoring --state open \
                       --json number,updatedAt \
                       --jq 'sort_by(.updatedAt) | last // empty | "\(.number) \(.updatedAt)"')

          if [ -z "$existing" ]; then
            gh issue create --label monitoring \
              --title "A scheduled check has stopped running" \
              --body "$body"
            exit 0
          fi

          num=${existing%% *}
          updated=${existing#* }
          updated_epoch=$(date -u -d "$updated" +%s 2>/dev/null \
                          || date -u -jf "%Y-%m-%dT%H:%M:%SZ" "$updated" +%s)
          age_min=$(( ( $(date -u +%s) - updated_epoch ) / 60 ))

          if [ "$age_min" -ge "$ALERT_QUIET_MINUTES" ]; then
            gh issue comment "$num" --body "$body"
            echo "Commented on #$num — last activity ${age_min}m ago."
          else
            echo "#$num was updated ${age_min}m ago, inside the ${ALERT_QUIET_MINUTES}m quiet window — not commenting."
          fi

      # ─── The base case, closed 2026-08-25 ─────────────────────────────────
      # The header of this file states that this workflow cannot watch itself,
      # and that closing the gap "needs an off-platform monitor, which this
      # project's budget does not run to". That premise expired: the Sentry
      # Developer plan this repo ALREADY uses for the viewer includes one cron
      # monitor at no extra cost. This is that monitor, and it costs $0.
      #
      # It runs only when every step above succeeded, which is the whole point.
      # A workflow that dies before it measures anything — the exact failure that
      # let uptime.yml sit broken for 23 hours in 8301e60 — sends NO check-in,
      # and Sentry alerts on the missing ping. Nothing has to notice its own
      # death and report it, which is the thing a dead process cannot do.
      #
      # An unset variable skips the step, matching how VITE_SENTRY_DSN behaves in
      # ci.yml: the monitor is optional infrastructure, never a gate on the
      # watcher. Set it with:
      #   gh variable set SENTRY_CRON_URL --body '<check-in URL from Sentry>'
      # The URL is not a secret — it is the public ingest key, the same one
      # already shipped to every browser inside VITE_SENTRY_DSN.
      - name: Check in to the Sentry cron monitor
        if: success() && vars.SENTRY_CRON_URL != ''
        env:
          SENTRY_CRON_URL: ${{ vars.SENTRY_CRON_URL }}
        run: |
          set -euo pipefail
          # Read from the environment, never interpolated into this script — the
          # rule apps/cms/src/workflowHardening.test.ts enforces on every file here.
          #
          # The check-in CARRIES the monitor config, so the schedule and the grace
          # period live in this file beside the `cron:` they have to agree with,
          # rather than in a dashboard nobody can diff. Sentry upserts it on every
          # ping, so a hand-edit in the UI is corrected within six hours instead of
          # drifting unseen. `apps/cms/src/heartbeatMonitor.test.ts` fails if the value below
          # and the `cron:` above ever disagree.
          #
          # ⚠️ THE SCHEDULE BELOW IS DELIBERATELY LOOSER THAN THE `cron:` ABOVE, AND
          # THAT IS THE WHOLE FIX. The job still runs every 6 hours; Sentry is told to
          # expect a check-in every 12. So a healthy heartbeat pings roughly twice per
          # window and one dropped or badly-queued run cannot raise an alarm.
          #
          # WHY, MEASURED 2026-08-30 over 39 scheduled runs (2026-08-19 to 08-30).
          # The number that matters is NOT the lateness of a run, it is the GAP
          # between consecutive check-ins — because GitHub does not merely queue a
          # scheduled run, it sometimes DROPS one entirely. Three were dropped in that
          # sample. Worst observed gap: **818 minutes (13.6 h)** on a 6-hour cron,
          # median 364.
          #
          # A monitor false-alarms unless (expected interval + margin) exceeds the
          # worst gap. 12h + 360 = 1080 minutes, against 818 observed — 4.4 hours of
          # headroom. The tempting smaller fix does NOT work and was measured:
          #   6h + 120 (previous) =  480 min -> alarms, and did, from 2026-08-26
          #   6h + 355 (the most  =  715 min -> STILL alarms
          #          a 6h schedule can carry)
          #
          # This replaced a 2026-08-26 setting of 120 minutes, itself chosen from a
          # then-correct measurement of 19-90 minutes. GitHub's delivery degraded
          # sharply after that date, so the alarm was wrong on most cycles and issue
          # VIEWER-4 accumulated 17 occurrences while the workflow was healthy
          # throughout. A watchdog that cries wolf every cycle teaches you to ignore
          # it, which is worse than no watchdog.
          #
          # Re-measure both numbers before tightening either — the gap, not the delay:
          #   gh run list --workflow=heartbeat.yml --limit 40 --json createdAt,event
          payload='{"status":"ok","monitor_config":{"schedule":{"type":"crontab","value":"43 */12 * * *"},"checkin_margin":360,"max_runtime":30,"timezone":"UTC","failure_issue_threshold":1,"recovery_threshold":1}}'
          curl -fsS --max-time 15 --retry 2 --retry-delay 3 --retry-all-errors \
            -o /dev/null -X POST "${SENTRY_CRON_URL}" \
            -H 'Content-Type: application/json' -d "${payload}"
          echo "Checked in: the heartbeat is alive."
