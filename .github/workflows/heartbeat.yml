name: Heartbeat

# WHO WATCHES THE MONITORS.
#
# On 2026-08-05 the uptime workflow failed at `actions/checkout` for ~23 hours and
# opened no alert at all. Not because the alerting was broken — because it never
# reached the step that decides to alert. `uptime.yml` gates its issue on
# `steps.check.outputs.ok == 'false'`, and a job that dies before setting that
# output produces silence, which is indistinguishable from a healthy site.
#
# That was fixed as a permissions bug (9c8e883). The CLASS of failure was not: any
# scheduled workflow here can still die before it measures anything, and nothing
# would say so. This is the thing that says so.
#
# It works by asking the Actions API when each watched workflow last SUCCEEDED,
# rather than by being told. Nothing has to remember to report in, so a workflow
# that stops running entirely — deleted, disabled, renamed, quietly skipped — is
# caught by the same check as one that fails.
#
# ⚠️ This workflow cannot watch itself. That is the base case and it is accepted:
# the point is to shrink the blind spot from "every scheduled job" to "one job that
# does nothing but one API call". If you want to close it completely you need an
# off-platform monitor, which this project's budget does not run to.

on:
  schedule:
    # Every 6 hours. This comment used to say "Uptime runs every 15 minutes, so 6
    # hours is ~24 missed runs". Uptime is SCHEDULED every 15 minutes but measured
    # 2026-08-10 GitHub delivers a median gap of ~45 min, so 6 hours is nearer ~8
    # missed runs. Still far past ordinary skew, and it still caps how long a dead
    # monitor can stay unnoticed at a quarter of the 23 hours it managed last time.
    #
    # ⚠️ The same measurement puts the worst observed uptime gap at 6.1 h, which is
    # TWICE the 3 h budget in WATCHED below — so the premise "each budget is
    # several times the workflow's own interval" no longer holds for uptime.yml.
    # Deliberately not changed here; see docs/RUNBOOK.md → "Uptime alerts".
    - cron: '43 */6 * * *'
  workflow_dispatch:

# `contents: read` is here even though NOTHING IS CHECKED OUT and it is not needed
# today. It is deliberate inoculation: a `permissions:` block REPLACES the default
# grants, so the moment someone adds `actions/checkout` to this file — exactly what
# happened to uptime.yml in 8301e60 — it would 404 with "Repository not found" and
# this monitor would join the list of things that fail silently. The irony would be
# total. `actions: read` is what `gh run list` actually needs.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  check:
    # Same gate as the workflows it watches. Before go-live they are all skipped on
    # purpose, and alerting that they have not run would be noise about a deliberate
    # state rather than a fault.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check each scheduled workflow has succeeded recently
        id: check
        run: |
          set -euo pipefail

          # workflow-file:max-age-hours:human-cadence
          # Each budget was chosen to be several times the workflow's own interval,
          # so that ordinary GitHub cron skew would never trip it and only a real
          # stoppage would.
          #
          # ⚠️ Measured 2026-08-10, that is NO LONGER TRUE for uptime.yml. GitHub
          # delivers a median gap of ~45 min against a scheduled 15, and the worst
          # observed gap over 94 h was 6.1 h — TWICE the 3 h budget below. No false
          # `monitoring` issue has fired yet, but only because no run of this job
          # happened to sample inside that window; that is luck, not headroom.
          # Raising the budget is a BEHAVIOUR change and was deliberately not made
          # when this was found — read docs/RUNBOOK.md → "Uptime alerts" first.
          #
          # NOTE the field separator is `:`, so a cadence label must never contain
          # one — it would be parsed as an extra field and silently truncate.
          WATCHED="
          uptime.yml:3:scheduled every 15 min, delivered ~45 min median
          nightly-backup.yml:36:nightly
          diagnostics-digest.yml:192:weekly on Mondays
          "

          stale=""
          now=$(date -u +%s)

          while IFS=: read -r file hours cadence; do
            [ -z "$file" ] && continue

            # `--status success` alone is not enough: a run whose only job was
            # skipped by an `if:` also concludes as success, so a workflow that is
            # silently not doing its work would look healthy. Ask for the newest
            # successful run and treat "none at all" as stale rather than as pass.
            last=$(gh run list --workflow "$file" --status success --limit 1 \
                     --json createdAt --jq '.[0].createdAt // empty' 2>/dev/null || echo "")

            if [ -z "$last" ]; then
              stale="${stale}- \`${file}\` — **no successful run on record at all** (expected ${cadence})\n"
              echo "STALE  $file — no successful run found"
              continue
            fi

            last_epoch=$(date -u -d "$last" +%s 2>/dev/null || date -u -jf "%Y-%m-%dT%H:%M:%SZ" "$last" +%s)
            age_h=$(( (now - last_epoch) / 3600 ))

            if [ "$age_h" -gt "$hours" ]; then
              stale="${stale}- \`${file}\` — last succeeded **${age_h}h ago**, budget ${hours}h (runs ${cadence})\n"
              echo "STALE  $file — ${age_h}h old (budget ${hours}h)"
            else
              echo "ok     $file — ${age_h}h old (budget ${hours}h)"
            fi
          done <<< "$WATCHED"

          if [ -n "$stale" ]; then
            {
              echo 'stale<<STALE_EOF'
              printf '%b' "$stale"
              echo 'STALE_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      # Same "an open issue silences the alarm" defect uptime.yml carried, and the
      # same fix — see the long note above that step. In short: "if an open
      # `monitoring` issue exists, do nothing" has no sense of TIME, so one
      # unclosed issue disables this monitor permanently. That is precisely what a
      # forgotten `outage` issue did to uptime alerting for 17 days (issue #2,
      # 2026-07-21 → 2026-08-07). A watchdog that can be muted by its own previous
      # bark is not a watchdog.
      #
      # Commenting keeps the dedup goal (no pile of identical issues) while
      # guaranteeing a new finding still notifies.
      - name: Alert — create a monitoring issue, or comment on the open one
        if: steps.check.outputs.stale != ''
        env:
          # Passed through the environment rather than interpolated into the shell
          # with ${{ }}. The value is built by the step above from a fixed list of
          # filenames so it is not attacker-controlled, but expanding untrusted-ish
          # text directly into a `run:` block is a habit worth not having.
          STALE: ${{ steps.check.outputs.stale }}
          # This job runs every 6h and a stopped monitor is a slow-moving
          # condition, not an outage — so 12h means at most every other run
          # comments. Each comment carries the CURRENT full stale list, so a
          # delayed one is never a stale one.
          ALERT_QUIET_MINUTES: '720'
        run: |
          set -euo pipefail
          if ! label_out=$(gh label create monitoring --color fbca04 \
                             --description "A scheduled workflow has stopped running" 2>&1); then
            grep -qi 'already exists' <<<"$label_out" || echo "::warning::gh label create failed: $label_out"
          fi

          # %b (not %s) for $STALE — the step above builds it with literal \n.
          body=$(printf '%s\n\n%b\n%s\n' \
            "One or more scheduled workflows have not succeeded within their expected window:" \
            "$STALE" \
            "**This is not necessarily an outage.** It means a CHECK is not running, so the thing it watches is currently unobserved — which is how the uptime monitor sat dead for ~23 hours on 2026-08-05 while looking fine.

          Open the workflow in the Actions tab and read the most recent run. If it is failing at \`actions/checkout\` with \"Repository not found\" on this private repo, the cause is a \`permissions:\` block missing \`contents: read\` — see the note at the top of uptime.yml.")

          # `// empty` is load-bearing — see the note on the same line in
          # uptime.yml. Without it an empty list yields "null null", which is not
          # empty, so the first-ever alert would try to comment on issue #null
          # instead of creating one.
          existing=$(gh issue list --label monitoring --state open \
                       --json number,updatedAt \
                       --jq 'sort_by(.updatedAt) | last // empty | "\(.number) \(.updatedAt)"')

          if [ -z "$existing" ]; then
            gh issue create --label monitoring \
              --title "A scheduled check has stopped running" \
              --body "$body"
            exit 0
          fi

          num=${existing%% *}
          updated=${existing#* }
          updated_epoch=$(date -u -d "$updated" +%s 2>/dev/null \
                          || date -u -jf "%Y-%m-%dT%H:%M:%SZ" "$updated" +%s)
          age_min=$(( ( $(date -u +%s) - updated_epoch ) / 60 ))

          if [ "$age_min" -ge "$ALERT_QUIET_MINUTES" ]; then
            gh issue comment "$num" --body "$body"
            echo "Commented on #$num — last activity ${age_min}m ago."
          else
            echo "#$num was updated ${age_min}m ago, inside the ${ALERT_QUIET_MINUTES}m quiet window — not commenting."
          fi
