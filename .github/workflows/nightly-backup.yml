name: Nightly backup

on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC nightly (GitHub cron may drift ~minutes)
  workflow_dispatch:

# `contents: read` is all this needs, and stating it is the point: the job holds
# CLOUDFLARE_API_TOKEN and exports a database containing password hashes, so the
# GITHUB_TOKEN beside it should be able to do as little as possible.
#
# ⚠️ A `permissions:` block REPLACES the default grants (see the note at the top
# of uptime.yml, where omitting `contents: read` broke `actions/checkout` with a
# 404). `actions/upload-artifact` is unaffected by this block — it authenticates
# with the runtime artifact token, not GITHUB_TOKEN.
permissions:
  contents: read

# A backup run overlapping the next one would have two exports writing the same
# stamped paths. Queue instead of cancel: a half-finished backup is worse than a
# late one.
concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    # Only after go-live (remote D1/R2 exist + secrets set): Phase 10.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ⚠️ STEP ONE OF TWO, AND THE ORDER IS LOAD-BEARING. This job reads
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, which are still REPO-level
    # secrets, so declaring the environment changes nothing today. Once every job
    # that uses them declares it, the secrets move into the environment. Done the
    # other way round, the secret resolves to an EMPTY STRING here and this job
    # fails at the first wrangler call — silently, on a schedule, at night.
    #
    # ⚠️ AND IT WAS HALF-DONE UNTIL 2026-08-30: ci.yml's and deploy-shrink.yml's
    # `deploy` jobs already declared it, but this one and the other scheduled job
    # did not — so moving the secrets would have taken out the backup and the
    # weekly digest while the deploys carried on looking fine.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Export D1
      # ⚠️ SCOPED TO THE STEPS THAT NEED IT, 2026-08-30. These two variables sat in
      # a JOB-level `env:` block, which put a token able to edit Workers, D1 and R2
      # into the environment of EVERY step — including `pnpm install
      # --frozen-lockfile`, where a malicious postinstall script in any transitive
      # dependency could simply read it. `minimumReleaseAge: 1440` in
      # pnpm-workspace.yaml narrows that window; it does not close it, and there is
      # no reason for the installer to see a production credential at all.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/backup-d1.mjs --stamp="$(date -u +%Y-%m-%d)"

      # RESTORE THE BACKUP, every night, before trusting it.
      #
      # Until this step existed the only evidence a backup was usable was that
      # `wrangler d1 export` exited 0 — and a truncated upload, a dump cut off
      # mid-INSERT, and a perfect dump of an empty database all exit 0 too. Every one
      # of those is otherwise discovered during a real restore, after the data is gone.
      #
      # This replays the .sql into a throwaway in-memory SQLite (node:sqlite, built
      # into the Node 24 this repo already pins — no new dependency) with FOREIGN KEYS
      # ON, then checks that every table the dump claims to populate ends up with the
      # rows it claims, and that products/users/site_settings/media are non-empty.
      # Foreign keys are on deliberately: root CLAUDE.md records a migration that
      # "reported success while cascade-deleting two tables nobody was watching", and
      # a dump that only restores with the checks disabled has that problem already.
      #
      # docs/BACKUP-RESTORE.md records that a HUMAN restore drill once found the
      # restore instructions were broken. That was the right instinct, done once. This
      # is the same drill on a schedule.
      - name: Verify the backup actually restores
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for dump in backups/d1/*.sql; do
            node scripts/verify-backup.mjs "$dump"
          done

      # `if: always()` so a backup that FAILED verification is still kept. The job goes
      # red either way, and a corrupt dump is evidence worth having when working out
      # what went wrong upstream.
      # A SECOND HOME FOR THE DUMP — L2-05, 2026-08-31.
      #
      # Until now the viewer database's only copy outside D1 was a GitHub artifact,
      # while `run-private` held thirty nightly dumps of the OTHER site's database and
      # nothing of ours. One platform holding both the live database and its only
      # backup is the shape this step exists to end, and the bucket was already there.
      #
      # Prefixed `run-apparel-viewer-db/` so the two applications' dumps cannot be
      # confused for each other during a restore, which is the moment nobody is
      # reading carefully. Runs AFTER the verify step on purpose: an unverified dump
      # is not a backup, and copying one further only spreads a false sense of safety.
      - name: Copy the verified dump into R2 (run-private)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          shopt -s nullglob
          dumps=(backups/d1/*.sql)
          if [ ${#dumps[@]} -eq 0 ]; then
            echo "::error::No dump to copy — the export step produced nothing."
            exit 1
          fi
          # ⚠️ ABSOLUTE PATH, on purpose. `pnpm --filter` runs wrangler with its cwd in
          # apps/cms, so the repo-relative `backups/d1/…` that the glob above found does
          # not exist from there: every nightly run from 2026-09-01 failed here with
          # `The file "backups/d1/….sql" does not exist` while the export, the replay and
          # the artifact upload all passed — the "second home" this step exists to give
          # the database had never received a single copy. Found 2026-09-03.
          for dump in "${dumps[@]}"; do
            key="run-apparel-viewer-db/$(basename "$dump")"
            echo "uploading $dump -> run-private/$key"
            pnpm --filter @run-apparel/cms exec wrangler r2 object put \
              "run-private/$key" --file "$GITHUB_WORKSPACE/$dump" --remote
          done

      # ⚠️ The upload above is only worth having if it ARRIVED. `wrangler r2 object
      # put` exits 0 on a great many things; this reads the object back and checks its
      # size against the file on disk, which is the difference between "we ran an
      # upload" and "the bytes are there".
      - name: Assert the dump is readable back out of R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          shopt -s nullglob
          for dump in backups/d1/*.sql; do
            key="run-apparel-viewer-db/$(basename "$dump")"
            pnpm --filter @run-apparel/cms exec wrangler r2 object get \
              "run-private/$key" --file /tmp/roundtrip.sql --remote
            want=$(wc -c < "$dump")
            got=$(wc -c < /tmp/roundtrip.sql)
            if [ "$want" != "$got" ]; then
              echo "::error::$key read back as $got bytes, expected $want. The copy in R2 is not the dump."
              exit 1
            fi
            echo "verified $key: $got bytes match"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: d1-backup-${{ github.run_id }}
          path: backups/d1/*.sql
          retention-days: 90

      - name: Mirror R2 (weekly, Mondays)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/backup-r2.mjs --stamp="$(date -u +%Y-%m-%d)"
      # FULL MIRROR MONDAYS, APEX PDFs EVERY NIGHT.
      #
      # Until 2026-08-31 the else-branch here printed "Not Monday — skipping" and did
      # nothing, so the two customer-facing PDFs had a backup window of up to SIX DAYS.
      # They live in `run-assets`, a bucket the separate `run-apparel` site can also
      # write to and delete from — a deletion there is somebody else's ordinary Tuesday,
      # not an incident anyone here would notice.
      #
      # Only the apex half moved to nightly. The media half is ~156 MB of models that
      # change rarely; the PDFs are 71 MB. Measured before choosing: live artifact
      # storage is 0.67 GB, nightly PDFs at 90-day retention add ~6.4 GB, and GitHub
      # Enterprise Cloud includes 50 GB — so this is free, not merely cheap. Doing the
      # same to the media half would add ~14 GB for files that do not change.
      #
      # ⚠️ THAT ARITHMETIC DIED WITH THE ENTERPRISE PLAN, 2026-09-02. The organisation
      # dropped to Free around 1 Sept (500 MB of artifact storage, pooled across ALL
      # its repositories), and with 2.69 GB stored every workflow run — this one, the
      # uptime check, the heartbeat and both CI runs of a pull request — failed at
      # startup for a day, with no jobs and nothing to read but a "BuildFailed" path.
      # The owner chose GitHub Team: 2 GB, still pooled, and stitchcode alone holds
      # 1.25 GB of it. So this repository must stay under ~0.6 GB: 21 days for the
      # weekly full mirror (~4 x 156 MB), 3 days for the nightly PDFs (~3 x 71 MB),
      # and the 90 above is history. The retention is chosen by the step below from an
      # output the mirror step writes, because one upload step serves both kinds.
      - name: Mirror R2 on schedule (full mirror Mondays, apex PDFs nightly)
        id: mirror-scheduled
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            node scripts/backup-r2.mjs --stamp="$(date -u +%Y-%m-%d)"
            echo "retention=21" >> "$GITHUB_OUTPUT"
          else
            node scripts/backup-r2.mjs --apex-only --stamp="$(date -u +%Y-%m-%d)"
            echo "retention=3" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # L2-12, 2026-08-31: always(), matching the D1 upload above and for the same
        # reason written there. A PARTLY-failed mirror is the run whose output is most
        # worth keeping — it says which objects made it and which did not. Discarding
        # it leaves only "the job went red" and nothing to diagnose from.
        # hashFiles() still guards the empty case, so a run that mirrored nothing does
        # not upload an empty artifact.
        if: ${{ always() && hashFiles('backups/r2/**') != '' }}
        with:
          name: r2-backup-${{ github.run_id }}
          path: backups/r2/**
          # 21 days for a weekly full mirror, 3 for the nightly PDFs, 21 for a manual
          # run (the output is unset then). See the plan-change note above: this used
          # to be 90 when the organisation had 50 GB.
          retention-days: ${{ steps.mirror-scheduled.outputs.retention || 21 }}

      # THE MASTER FILES ARE VERIFIED, NOT MIRRORED. `run-apparel-archive` holds the
      # FIXED GLBs and the ten raw CLO exports — 5.7 GB that
      # until 2026-09-02 existed once, on one disk, in no backup (audit CI-02 / CI-08).
      # Mirroring 5 GB into a runner every night would spend artifact storage on files
      # that change only when a garment is re-exported, so this step lists the bucket
      # (one REST call) and compares every byte count with the committed
      # scripts/archive-manifest.json. It goes red if any object is missing or the wrong
      # size, and it goes red if the listing or the manifest is EMPTY — a check that
      # checked nothing must not exit green (the backup-r2 lesson, L20-11). Proven both
      # ways on 2026-09-02 against the live bucket: a manifest with one size off by one
      # failed naming the file, an empty bucket failed with "ZERO objects" and every
      # file missing, and the real manifest passed 15 of 15.
      - name: Verify the archive bucket against its manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-archive.mjs

      # RETENTION SHORTENED 180 -> 90 DAYS on 2026-08-18 (audit H1, owner
      # decision). Ninety days covers investigating a bug reported weeks ago and
      # comparing against last quarter; at the measured rate (~4,300 writes/month,
      # 754 rows in the table's first 28 days) that is roughly 2,000 rows, against
      # 5 GB of included D1 storage.
      #
      # ⚠️ H1 claimed this collection had NO automated retention and that pruning
      # was "a manual action". This step has run monthly since before that audit.
      # The finding was wrong about the mechanism and RIGHT about the gap, which
      # was that nothing MEASURED growth — a flood of well-formed `analytics` rows
      # would be pruned 90 days later having never been reported. That gap is
      # closed in diagnostics-digest.yml, not here: this workflow holds only
      # `contents: read` and cannot open an issue.
      - name: Prune old events (monthly, 1st)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm --filter @run-apparel/cms exec wrangler d1 execute run-apparel-viewer-db --remote \
              --command "DELETE FROM events WHERE created_at < datetime('now','-90 days')"
          else
            echo "Not the 1st — skipping events prune."
          fi
