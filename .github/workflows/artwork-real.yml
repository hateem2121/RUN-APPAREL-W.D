name: Artwork (real garment)

# Does the shipped preset still keep N001's PRINTED LETTERS readable — on the
# actual 382 MB CLO export, not a fixture?
#
# WHY THIS IS SEPARATE FROM CI. The `artwork` job in ci.yml gates every deploy,
# but it runs on a synthetic fixture. CLAUDE.md states the residual gap plainly:
# that eval "runs on a synthetic fixture, not on a production garment, so it
# catches a preset or simplifier regression and would still miss damage specific
# to a particular CLO export."
#
# The thing that WAS the authority on a real garment — sweep-size-vs-artwork.mjs —
# does not render anything. Its own recorded output from 2026-08-05
# (output/sweep/sweep.json) reports `wouldShip: true` for all six runs, including
# run F at --simplify-error 0.005, which CLAUDE.md records as rendering the chest
# wordmark ILLEGIBLE. The real authority was a human opening a contact sheet.
#
# This is that, on a schedule.
#
# WHY MONTHLY AND NOT PER-PR. It needs the raw export, which is 382 MB and lives
# in a private R2 ingest bucket. Pulling that on every pull request would be
# absurd; the per-PR job is the synthetic one. This catches drift in the thing the
# fixture cannot represent — this particular garment's UV packing.
#
# WHY IT DOES NOT GATE THE DEPLOY. It cannot: it runs on a clock, not on a commit,
# so there is no deploy to attach it to. On failure it opens an issue, which is
# what the owner reads. Deploys are gated by the synthetic eval in ci.yml.

on:
  schedule:
    # 04:10 UTC on the 1st of each month. GitHub cron is best-effort and skews
    # under load; nothing here is time-critical.
    - cron: '10 4 1 * *'
  workflow_dispatch:
    inputs:
      raw_key:
        description: 'R2 object key in the ingest bucket (default: the repo variable, then cycling-all-colours.glb)'
        required: false
      calibrate:
        description: 'Print the damage curve instead of asserting'
        type: boolean
        default: false

# A `permissions:` block REPLACES the default token grants rather than adding to
# them. Listing only `issues: write` silently sets `contents` to none, and
# actions/checkout then fails with "Repository not found" — a 404 that reads like a
# deleted repo rather than a permissions problem. That exact mistake took the
# uptime monitor down for ~23 hours on 2026-08-05 (see uptime.yml). Both are needed.
permissions:
  contents: read
  issues: write

concurrency:
  group: artwork-real
  cancel-in-progress: false

jobs:
  eval:
    # Needs the Cloudflare credentials to reach the private ingest bucket. Skipped
    # before go-live for the same reason the uptime job is.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Chromium only, and on a SEPARATE cache key from ci.yml's `verify` job,
      # which installs three browsers. Sharing a key between jobs that install
      # different browser SETS means whichever runs first decides what the other
      # gets, and the loser fails to launch — presenting as a flaky render rather
      # than as a caching bug. This matches the key the `artwork` job uses.
      - name: Resolve Playwright version
        id: pw
        run: echo "v=$(node -p 'require("./tools/asset-pipeline/node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}-chromium
      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @run-apparel/asset-pipeline exec playwright install --with-deps chromium
      - name: Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @run-apparel/asset-pipeline exec playwright install-deps chromium

      # The raw export is gitignored (382 MB), so it is pulled from the private R2
      # ingest bucket — the same command .gitignore documents for local work. The
      # bucket has NO public access and NO custom domain by design, so this needs
      # the API token rather than a plain fetch.
      #
      # ⚠️ THE KEY CONTAINS SPACES. It is "cycling all colours.glb", not the
      # hyphenated "cycling-all-colours.glb" — the local working copy was renamed on
      # download, and the hyphenated form is what everyone types from memory. The key
      # is recorded in docs/superpowers/specs/2026-08-05-…-design.md ("verified
      # today", 2026-08-05). Quote it everywhere; an unquoted expansion splits it
      # into three arguments and wrangler reports a confusing bucket error.
      #
      # It is downloaded to a HYPHENATED local name on purpose, so nothing
      # downstream has to deal with spaces in a path.
      #
      # Overridable per garment without editing this file:
      #   gh variable set RAW_GLB_KEY --body "<name>.glb"
      - name: Pull the raw CLO export from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAW_KEY: ${{ github.event.inputs.raw_key || vars.RAW_GLB_KEY || 'cycling all colours.glb' }}
        run: |
          set -euo pipefail
          mkdir -p raw
          local_name="$(echo "$RAW_KEY" | tr ' ' '-')"
          if ! pnpm --filter @run-apparel/cms exec wrangler r2 object get \
                 "run-apparel-viewer-ingest/${RAW_KEY}" --file "raw/${local_name}" --remote; then
            echo "::error::Could not fetch 'run-apparel-viewer-ingest/${RAW_KEY}'."
            echo "::error::MOST LIKELY CAUSE: the ingest bucket has an 'expire-raw-uploads'"
            echo "::error::lifecycle rule that deletes EVERY object after 14 days, all prefixes."
            echo "::error::This garment was uploaded on/before 2026-08-05, so it expired around"
            echo "::error::2026-08-19 — before this monthly job ever ran. A raw export is not a"
            echo "::error::durable artifact here; something has to keep a copy on purpose."
            echo "::error::Fix: re-upload the export, or hold a canonical copy in a bucket with"
            echo "::error::no expiry and point RAW_GLB_KEY at it. See docs/RAW-UPLOAD-PIPELINE.md."
            echo "::error::Other causes: the key has SPACES ('cycling all colours.glb'), or"
            echo "::error::CLOUDFLARE_API_TOKEN lacks R2 read."
            exit 1
          fi
          ls -l "raw/${local_name}"
          echo "RAW_GLB=$PWD/raw/${local_name}" >> "$GITHUB_ENV"

      - name: Real-garment artwork eval
        env:
          RAW_GLB: ${{ env.RAW_GLB }}
        run: |
          if [ "${{ github.event.inputs.calibrate }}" = "true" ]; then
            pnpm eval:artwork:real -- --calibrate --keep "$RUNNER_TEMP/artwork-real"
          else
            pnpm eval:artwork:real -- --keep "$RUNNER_TEMP/artwork-real"
          fi

      # The contact sheets are the whole point — CLAUDE.md: "Nothing in this system
      # measured whether the letters survived; only a rendered crop did." A number
      # in a log is not reviewable; these are. Kept on success too, at 14 days, so
      # a slow drift can be compared against last month rather than only noticed
      # once it breaches.
      - name: Upload contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artwork-real-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/artwork-real/sheet-*.png
            ${{ runner.temp }}/artwork-real/render-*/**
          retention-days: 14
          if-no-files-found: warn

      # The owner does not read workflow logs. An issue is what gets seen — the
      # same alerting path uptime.yml uses, deduplicated the same way so a repeated
      # monthly failure does not open a second copy.
      - name: Open a deduplicated issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! label_out=$(gh label create artwork --color d93f0b \
                             --description "Printed artwork regression" 2>&1); then
            grep -qi 'already exists' <<<"$label_out" || echo "::warning::gh label create failed: $label_out"
          fi
          open=$(gh issue list --label artwork --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --label artwork \
              --title "Artwork regression on the real garment" \
              --body "The monthly real-garment artwork eval failed.

          Download the contact sheets from the run artifacts and LOOK at them —
          a number is not the evidence, the rendered crop is:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Do not raise the ceiling to make this green. See CLAUDE.md → 'Before you
          change the pipeline', and docs/OPEN-ISSUE-ARTWORK.md for how the last one
          was diagnosed."
          else
            echo "An open artwork issue already exists — not duplicating."
          fi
