name: Performance watch

on:
  schedule:
    # Weekly. Deliberately NOT frequent: this measures a trend, not liveness —
    # liveness is the deep check in uptime.yml (every 6 hours since 2026-09-29) plus
    # the two external UptimeRobot checks every 5 minutes. A performance probe on a
    # tight schedule would mostly measure GitHub's runner variance.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# A `permissions:` block REPLACES the defaults rather than adding to them. `contents:
# read` is required or actions/checkout failed with a 404 while this repo was private — the
# failure that killed uptime.yml silently for ~23 hours. No other scope is needed:
# this job reports by failing, and does not write issues (see below).
permissions:
  contents: read

# No job here uses the Actions cache, so it may neither read nor write one. Scheduled and
# manual runs would otherwise be allowed to WRITE it (GitHub `cache-mode`, 2026-10-01: least
# privilege against cache poisoning).
cache-mode: none

jobs:
  probe:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Network guard (Harden-Runner, watch mode)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # No install step: the probe uses `fetch` and nothing else. Keeping it
      # dependency-free means this workflow cannot break because of the lockfile.
      #
      # WHAT IT DOES NOT DO, and why, because both are counter-intuitive:
      #
      #   * It never GETs the whole model (1.9-8.1 MB, measured 2026-09-25). The model
      #     step below reads only each file's first 600 KB and then 1 byte.
      #     ⚠️ This used to say "against a $5/month R2 egress cap". There is no such cap:
      #     R2 egress is free at any volume (developers.cloudflare.com/r2/pricing/,
      #     re-read 2026-09-25), and a cached model is served from the edge without
      #     touching R2 at all. The only R2 cost of a read is a Class B operation, and
      #     only on a cache MISS.
      #   * `cf-cache-status` is only trustworthy when read from a GET's own headers.
      #     Measured on 2026-08-13, same URL, same minute: GET said HIT (age 49431),
      #     HEAD said DYNAMIC. A probe using `curl -I` here would conclude the model
      #     is never cached — a convincing and completely false finding. The model
      #     step reads it off its GETs.
      #
      # A 403/429/503 is reported as INCONCLUSIVE and the run stays green. Free-plan
      # Bot Fight Mode intermittently blocks datacenter traffic; it already forced an
      # API cutover to be rolled back and later failed a deploy through a check that
      # read a 403 as "no model". An alert that fires on Cloudflare's mood gets muted,
      # and a muted alert is how the outage path stayed silent for 17 days.
      - name: Probe live response times
        run: node scripts/perf-probe.mjs

      # IM-10 and IM-02b, weekly: every live model's copyright, no CLO leftovers (text,
      # keys, drive paths, extras outside depthBias/uvRemap), served from the edge cache
      # on a repeat GET, and its size within 2x its family's median. Same exit contract
      # as above: a 403/429/503 is inconclusive and stays green.
      - name: Check every live model's provenance, cache and size
        run: node scripts/glb-provenance-probe.mjs

      # IM-02b and IM-03, weekly: every live poster against its family's median size, and
      # what it must BE: WebP, 1200x1500 read from its bytes, a 7-day cache lifetime,
      # served from the edge. About 3 MB a week (80 posters at ~35 KB).
      - name: Check every live poster's size and content
        run: node scripts/poster-sizes.mjs

      # DELIBERATELY NO `gh issue create` STEP (it holds for the `taps` job below too).
      #
      # uptime.yml and heartbeat.yml open issues, and the shell that does it is the
      # one piece of this repo that only runs when something is already broken — which
      # is why scripts/test-alert-shell.sh exists to execute it against a stub `gh`,
      # negative control and all. Adding a third, untested copy of that logic here
      # would reproduce the exact shape of the failure those two already had.
      #
      # A failed scheduled run notifies the repository owner through GitHub's own
      # workflow-failure notifications, which is proportionate for a weekly trend
      # check. If this ever needs to open issues, add it to test-alert-shell.sh in the
      # same commit — not afterwards.

  # The faster-taps work (docs/superpowers/specs/2026-10-27-faster-taps-edge-store-intent-design.md,
  # Part 5), weekly: in real browsers against the live site, how long a tap on a link waits and how
  # soon a garment card's page shows, judged on the taps the shared store answered (G1: under 0.4 s,
  # 3 in 4; G2: under 1.5 s). measure-taps.mjs exits 1 when either misses and 2 when the site
  # blocked the probe (403/429/503): inconclusive, a warning, green.
  # ⚠️ REPORT-ONLY SINCE 2026-10-27 (owner): its first run missed 7 of 12 targets from this runner
  # while the same targets passed from the owner's Mac in Pakistan; garment opens took 862-4,045 ms
  # here with the data answered from the store, 229-317 ms there. With no runner baseline, a red run
  # each Monday would trip heartbeat.yml's "success within 192 hours" on the runner's speed. A missed
  # target is a warning with the numbers; a run that printed no numbers still fails. Read four weekly
  # runs before making it judge again (apps/cms/src/perfWatchTaps.test.ts). 20 taps per route, as
  # the spec measures (10 until the review of 27 Oct). Then its negative control, every week since
  # that review (it had run once by hand): `--refuse-store` (a cookie the store refuses) draws every
  # tap, so the judge MUST fail, and a pass there is the error. Then the same pages from Pakistan's
  # home networks (Globalping, free), and a second pass from the same probes: that step FAILS on
  # Pakistan's own pass mark (owner, 27 Oct): the second pass must find pages kept, and the store's
  # answers must reach the first byte within 1 s at p75 (scripts/warm-regions.mjs regionJudgement).
  # All print timings and counts only; the log is public. 40 minutes: the 10-tap run took 7.6 min on
  # 27 Oct (run 40544223696), so 20 taps about 15, the control about 3 and Pakistan about 3.
  # In the Playwright image ci.yml's browser jobs use (same tag and digest), so no apt and no
  # browser download; Harden-Runner cannot run in a `container:` job.
  taps:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: ''
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Measure taps and garment opens on the live site
        env:
          HOME: /root
        run: |
          set +e
          out=$(mktemp)
          node apps/cms/scripts/measure-taps.mjs --origin=https://wear-run.com --taps=20 --summary > "$out" 2>&1
          code=$?
          cat "$out"
          if [ "$code" = 2 ]; then
            echo "::warning::the live site blocked the probe (403, 429 or 503): inconclusive"
            exit 0
          fi
          if [ "$code" = 1 ]; then
            if grep -qE 'warm p50|no warm tap' "$out"; then
              echo "::warning::a tap or garment target was missed from this runner; report-only since 2026-10-27, the numbers are above"
              exit 0
            fi
            echo "::error::the tap measurement printed no numbers, so it measured nothing"
            exit 1
          fi
          exit "$code"
      - name: Negative control — the store refused, so the judge must fail
        env:
          HOME: /root
        run: |
          set +e
          out=$(mktemp)
          node apps/cms/scripts/measure-taps.mjs --origin=https://wear-run.com --taps=3 --refuse-store --summary > "$out" 2>&1
          code=$?
          cat "$out"
          if [ "$code" = 2 ]; then
            echo "::warning::the live site blocked the control (403, 429 or 503): inconclusive"
            exit 0
          fi
          if ! grep -qE 'warm p50|no warm tap' "$out"; then
            echo "::error::the control printed no numbers, so it measured nothing"
            exit 1
          fi
          if [ "$code" = 0 ]; then
            echo "::error::the judge passed with the store refused, so its passes prove nothing"
            exit 1
          fi
          echo "the judge failed with the store refused, as it must"
      - name: Measure the buyer regions from home networks (Globalping)
        run: node scripts/warm-regions.mjs https://wear-run.com --measure
