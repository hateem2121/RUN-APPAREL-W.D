name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # ⚠️ NEVER `true` ON MAIN. This job MIGRATES D1 AND THEN DEPLOYS. Cancelling it
  # mid-flight can leave the database upgraded and the site on the old code, and
  # the failure alert does not fire on a cancellation — so the worst outcome is
  # also the quietest one. Two merges ten minutes apart were enough.
  #
  # A second scar rides along: `gh run watch --exit-status` returns 1 for a
  # CANCELLED run exactly as it does for a FAILURE, which sent a session
  # debugging a perfectly healthy job whose only error line was
  # "The operation was canceled". Read `conclusion`, not the exit code.
  #
  # Pull requests still cancel — that is where the CI-minute saving is, and
  # nothing there deploys. GitHub allows an expression here and permits only the
  # `github`, `inputs` and `vars` contexts; `github.ref` is one of them, so do not
  # reach for `secrets` or `env`. Audit 2026-08-30 PM, finding L14-01.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege for every job in this file, stated explicitly rather than
# inherited. Third-party code runs here — `pnpm install`, the build, the test
# suites — and until this block existed it ran with whatever the repository
# default happened to be.
#
# ⚠️ A `permissions:` block REPLACES the default grants; it does not add to them.
# That is not a general caution, it is this repository's own scar: 8301e60 added
# `actions/checkout` to uptime.yml, whose block listed only `issues: write`, and
# checkout then failed with "Repository not found" — GitHub answers 404, not 403,
# on a private repo, so it read as a deleted repository rather than a permissions
# problem. Every job below that needs more than `contents: read` says so itself.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # ⚠️ ONLY ON GITHUB'S RUNNERS. `cache: pnpm` makes setup-node pull a pnpm
          # cache archive from GitHub's cache service, and on the self-hosted runner
          # that archive is 377 MB arriving at 0.4-0.7 MB/s over a home connection —
          # measured as 151s of `audit`'s 205s, 206s of `lighthouse`'s 278s, in EVERY
          # job. It is also redundant there: each runner keeps its own persistent pnpm
          # store inside its work volume (infra/ci-runner/Dockerfile), on the same
          # filesystem as the checkout so pnpm hard-links instead of copying. Paying
          # 377 MB to rebuild a store that is already on disk is worse than no cache.
          #
          # `runner.environment` is the built-in that distinguishes them, so this stays
          # correct if a job ever runs on GitHub again — where the store IS ephemeral
          # and the archive genuinely helps.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          # ⚠️ `cache: ''` ALONE IS NOT ENOUGH ON setup-node v7, AND THAT IS NEW.
          # Since v7 the action AUTO-ENABLES the package-manager cache when
          # `package.json` declares `packageManager` — and ours does
          # (`package.json:6`, `pnpm@10.34.5`). The input that governs it defaults to
          # TRUE and is a SEPARATE knob from `cache:`, so the block above no longer
          # fully describes what the action will do.
          #
          # Measured 2026-09-08 in run 34256940744's `verify` log, where both appear:
          #
          #     cache: false
          #     package-manager-cache: true
          #     Progress: resolved 1063, reused 1059, downloaded 0, added 1063, done
          #     Done in 4.5s using pnpm v10.33.0
          #
          # So the explicit `cache:` currently WINS and nothing is fetched. Pinned here
          # anyway because it is one upstream default away from silently restoring the
          # 377 MB fetch this block exists to prevent — and the symptom would be a slow
          # job, never a failing one, which is the kind of regression nobody reports.
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - run: pnpm install --frozen-lockfile

      # Style + lint (Biome). Runs BEFORE typecheck because it is the cheapest
      # check in the job — tens of milliseconds across 192 files — so a formatting
      # slip fails in seconds rather than after the whole suite.
      #
      # It earned its place on the first run: `noUnusedVariables` found that
      # REFERENCE_PATHS in scripts/find-orphan-media.mjs was declared and never
      # read, while mediaReferences.test.ts instructs the next person to update it
      # when adding a Media relationship. Following that instruction would have
      # left the orphan finder blind to the new field — and it can delete files.
      - run: pnpm lint

      # ⚠️ A REAL YAML PARSER, BECAUSE THE HAND-WRITTEN RULE CATCHES ONE SHAPE IN FOUR.
      #
      # `workflowHardening.test.ts` is line-and-regex based. It caught the 2026-08-30
      # defect — a key nested under a scalar, which GitHub could not parse, so it
      # produced a run named after the FILE PATH with zero jobs while twelve green
      # ticks sat on the same commit — and it catches nothing else of that family.
      # Measured on 2026-08-31 against four deliberately-broken workflows:
      #
      #   key nested under a scalar   regex: caught   actionlint: caught
      #   needs: a job that does not exist   regex: MISSED   actionlint: caught
      #   an unknown runner label            regex: MISSED   actionlint: caught
      #   an undefined expression field      regex: MISSED   actionlint: caught
      #   a healthy workflow                 both clean (the control that makes the
      #                                      four above mean something)
      #
      # Against THIS repo's workflows it currently reports zero, so it is added as a
      # blocking step rather than a warning.
      #
      # A single Go binary, so it does not touch pnpm-workspace.yaml's 24-hour
      # cooldown or dependencyPolicy.test.ts. Installed the way gitleaks is — pinned
      # release, downloaded TO A FILE and not piped, version printed before use — for
      # the reasons written at length on that step: a 504 from the release CDN must
      # fail as "the linter never downloaded", never as "the workflows are broken".
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          # Arch-resolved for the same reason gitleaks is (2026-09-08, self-hosted arm64
          # runner): `linux_amd64` is not executable on arm64, and `verify` is in
          # `deploy.needs`. Refuse an unknown arch rather than fetch the wrong binary.
          case "$(uname -m)" in
            x86_64|amd64) AL_ARCH=amd64 ;;
            aarch64|arm64) AL_ARCH=arm64 ;;
            *) echo "::error::unsupported arch $(uname -m) for actionlint"; exit 1 ;;
          esac
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_${AL_ARCH}.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          # Proves the binary is real before the lint, so a corrupt archive fails here
          # with a clear message rather than as an ambiguous clean run.
          /tmp/actionlint --version
          /tmp/actionlint

      - run: pnpm typecheck

      # The shrink container is NOT a workspace member (see its package.json), so
      # `pnpm typecheck` above skips it entirely — and it is the code that
      # processes every real garment. It went unchecked in CI until 2026-07-31,
      # when a change to server.ts compiled only because someone thought to run
      # tsc there by hand. Its deps are tiny and it shares the pipeline source it
      # imports, so this costs seconds.
      - name: Typecheck shrink container
        working-directory: apps/shrink/container
        run: npm install --no-audit --no-fund && npx tsc --noEmit

      # `test:coverage` rather than `test`: it runs the identical suites once, with
      # v8 coverage on, and each package's vitest.config.ts fails its own run on a
      # shortfall against a threshold MEASURED on 2026-08-13 (not chosen).
      #
      # `scripts/check-coverage.mjs` then runs the repo-wide gate. It exists for the
      # one failure per-package thresholds structurally cannot catch: a package
      # dropping OUT of the measurement. Verified in both directions when it was
      # added — with apps/viewer's report removed, the repo figure ROSE from 71.4% to
      # 83.75% (its uncovered lines left the denominator) and the gate still exited 1.
      # That is the whole reason it asserts presence before percentages.
      #
      # --max-age-minutes guards the local case where a stale coverage/ from an
      # earlier run would satisfy the presence check while measuring nothing. On a
      # clean CI checkout it is belt-and-braces.
      - run: pnpm test:coverage

      # The alerting branch of uptime.yml / heartbeat.yml is the one piece of this
      # repo that ONLY runs when something is already broken — so nothing exercises
      # it on a good day, and a typo in it is invisible until the day it matters.
      # It was in fact silently disabled for 17 days (an unclosed issue muted every
      # outage alert, 2026-07-21 → 2026-08-07). This reads the shell back out of the
      # YAML and runs it against a stub `gh`, including a negative control that
      # deletes the `// empty` guard and asserts the first-outage path breaks.
      # No pnpm involvement — bash, awk and jq only, all preinstalled here.
      - name: Alert-shell checks (uptime + heartbeat)
        run: bash scripts/test-alert-shell.sh

      # Every maintained document is reachable from docs/README.md (audit FA-T-06,
      # FA-T-12). That index was brought up to date by hand twice — once when it was
      # written, once when the 2026-09-06 audit found it missing 8 of 43 — and nothing
      # stopped it drifting a third time. Needs no build; it reads `git ls-files`.
      - name: Docs index reachability
        run: node scripts/check-docs-index.mjs

      - run: pnpm seed:assets
      - run: pnpm build

      # ⚠️ THIS GUARD SILENTLY SKIPPED IN CI UNTIL 2026-08-29, and it is the ONLY thing
      # standing between the viewer shell and a re-shipped 294 kB of 3D renderer past
      # the Save-Data check. Its three checks are skipIf(dist missing); `dist/` is
      # gitignored; and `pnpm test:coverage` above runs BEFORE `pnpm build`. So on a
      # clean checkout they skipped on every run, and passed only on a developer machine
      # carrying a stale build — the public/draco/ trap, inverted.
      #
      # It runs HERE, after the build, with REQUIRE_BUILD_ARTIFACTS=1, which turns the
      # skip into a hard failure. Measured both ways: without the flag and no dist,
      # 2 pass / 3 skip; with the flag and no dist, 4 fail.
      #
      # NOT fixed by moving `pnpm build` above the suite — that would also move
      # `seed:assets`, changing the fixtures the tests themselves see.
      - name: Bundle preload guard (needs the build above)
        run: pnpm --filter @run-apparel/viewer test:preload

      # The three host rules that give the marketing site ONE address, read back from
      # .next/routes-manifest.json. Same reason as the preload guard: a config rule that
      # did not reach the build is the Vary failure shape, and only the build can say.
      - name: Host rules guard (needs the build above)
        run: pnpm --filter @run-apparel/cms test:routes

      # Two more settings that only exist if they reached the build: whether AI crawlers
      # still get a finished <head> rather than streamed metadata, and whether the
      # catch-all CSP still covers the 404 without reaching /admin. Same reason as the two
      # guards above — `htmlLimitedBots` deleted from next.config.mjs leaves every unit
      # assertion passing against Next's own default, and a negative lookahead can only be
      # judged against the regex Next actually emitted.
      - name: Built-config guards (need the build above)
        run: pnpm --filter @run-apparel/cms test:built-config

      # Deterministic weight budget for the viewer shell. This is inside `verify`,
      # which IS in the deploy's `needs:` list — unlike the `lighthouse` job, which
      # measures the same thing better but needs Chrome and is therefore
      # deliberately non-gating ("a Chrome flake must never block a live release").
      # The result until now was that no automated statement about page weight could
      # fail a deploy. This one can, because there is nothing in it to flake: it
      # reads built files off disk and gzips them. Same input, same number, every
      # machine.
      #
      # Measured on this build: script 87%, wasm 91%, font 87%, stylesheet 72% of
      # budget. Both directions were verified when it was added — it passes at those
      # numbers and exits 1 with the category named when a budget is undercut.
      - name: Bundle weight budget (deterministic, no browser)
        run: node scripts/check-bundle-budget.mjs

  # E2E IN A REAL BROWSER. Split out of `verify` on 2026-08-20 and containerised for
  # the same measured reason `artwork` was: `playwright install-deps` is an apt-get,
  # and a degraded Azure Ubuntu mirror twice consumed whole job budgets with nothing
  # in this repository changed. The image below carries the browsers AND their system
  # libraries, so no apt runs here at all.
  #
  # WHY THIS IS ITS OWN JOB rather than `verify` gaining a `container:`. That job runs
  # `scripts/test-alert-shell.sh`, which needs `jq` — and this image does not have it
  # (checked by running the image, not by reading about it). The script cannot be
  # ported to node either: it evaluates the REAL `--jq` filter strings lifted out of
  # uptime.yml and heartbeat.yml, so it needs something that parses jq syntax. That
  # single missing binary is the whole reason for the split — and the split is a
  # genuine seam anyway, since the static gates and the browser gates need different
  # machines.
  #
  # ⚠️ IT IS IN `deploy.needs` AND IN THE `main` RULESET. Both. `needs:` stops the
  # deploy; the ruleset stops the merge, and it is org config that no test in this
  # repo can see. `apps/cms/src/workflowHardening.test.ts` enforces the `needs:` half
  # — see the tenth rule there. Splitting a gate into a new job and forgetting either
  # one is how a gate silently stops gating, which has happened here twice already
  # (2026-08-15 and 2026-08-17, both renames).
  #
  # WebKit is not optional. A QR code on a garment tag is scanned with a phone camera,
  # which opens iOS Safari — and until 2026-08-03 CI installed Chromium only, so the
  # suite ran Chromium twice and the single most likely browser for this product had
  # never executed a line of it. Firefox is cheap once the matrix exists.
  #
  # ⚠️ THE `HOME=/root` WORKAROUND IS GONE — AND KNOW WHY, BEFORE REINSTATING A CONTAINER.
  # Kept because it comes straight back the moment a `container:` returns here.
  #
  # Measured on run 32349283297, when this job ran `container: playwright:...`:
  # 176 tests passed, 57 failed, every one of them `viewer-firefox`, all on
  # `browserType.launch: Failed to launch the browser process`:
  #
  #     Running Nightly as root in a regular user's session is not supported.
  #     ($HOME is /github/home which is owned by pwuser.)
  #
  # The cause was never the user. GitHub forces `HOME=/github/home` into every CONTAINER
  # job — visible in the `docker create` line as `-e "HOME=/github/home"` — mounted from
  # the host, while inside the image it is owned by `pwuser` (uid 1000). Firefox refuses
  # when the process owner and $HOME's owner differ, so root broke it AND `--user 1001`
  # broke it differently (`Can't find profile directory`,
  # microsoft/playwright#31685). Chromium and WebKit do not check; only Firefox does,
  # which is why `artwork` never saw it.
  #
  # Since 2026-09-08 there is NO container: the self-hosted runner IS that image
  # (infra/ci-runner/Dockerfile), so the job runs as `pwuser` with `HOME=/home/pwuser`
  # — owner and $HOME agree, and nothing needs overriding. Verified by running the
  # image: `whoami=pwuser HOME=/home/pwuser`. If a `container:` is ever added back,
  # `HOME: /root` must come back with it, scoped to the STEP and not the job.
  e2e:
    runs-on: ubuntu-latest
    # ⚠️ 30, RAISED FROM 20 ON 2026-09-07 BECAUSE THE WORK GREW, NOT BECAUSE A CEILING WAS
    # INCONVENIENT. Measured, this job, five consecutive runs:
    #
    #   89b611c  success    15.0 min
    #   d653c5b  failure    15.3 min
    #   d2696f3  failure    16.0 min
    #   f9eb442  CANCELLED  20.1 min   <- hit this ceiling
    #   986b051  CANCELLED  20.1 min   <- hit this ceiling
    #
    # ⚠️ AND A JOB THAT HITS ITS OWN `timeout-minutes` REPORTS `cancelled`, NOT `failure` —
    # which reads exactly like the concurrency cancellation this file documents above, and
    # cost a round trip to tell apart. The tell is that ONE job is cancelled while the
    # others succeed; a concurrency cancel takes the whole run.
    #
    # The runner does 636 viewer tests then 312 CMS tests at ONE worker (`Running 636 tests
    # using 1 worker` in the log): 14.0 min and ~6 min respectively, plus install. That is
    # ~21 minutes of real work against a 20-minute budget — it did not fit, and the two
    # green runs above only fitted because the suites were 75 tests smaller. `verify`
    # already sits at 30 for the same reason.
    #
    # Raising this is NOT the answer to a slow external dependency — see the apt-mirror
    # account earlier in this file, where lifting one ceiling only moved which job died.
    # It is the answer when the ceiling is smaller than the measured work, which is this.
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No `actions/setup-node` here either, for the reason measured beside `artwork`
      # above: the image ships the pinned Node 24, and the pnpm store cache costs more
      # to save than it saves on install — every feature branch pays the miss, because
      # Actions caches are branch-scoped.
      - run: pnpm install --frozen-lockfile
      # ONE SECOND OF DIAGNOSTIC, for the same reason the deleted `ldd` check existed:
      # a browser that cannot LAUNCH must not be debugged as a flaky test. GitHub does
      # not document what HOME is inside a job container, and Firefox's known container
      # failure is precisely a HOME/profile-directory problem — so print it rather than
      # infer it. If e2e ever dies in `browserType.launch`, read this step first.
      - name: Container facts (user, HOME, browsers)
        run: |
          echo "whoami=$(whoami)  uid=$(id -u)  HOME=$HOME"
          echo "PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-unset}"
          ls "${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}" || true
      # `prepare.mjs` runs `pnpm seed:assets` and `pnpm build` itself, through
      # Playwright's `webServer` command, so this one step is the whole suite.
      #
      # MEASURED, run 32350036354, all three browsers green: this job 417s total —
      # pull 60s + setup 42s + the suite itself 310s. Against it, `verify` fell from
      # 470s to 159s by shedding this work, and the two now run in PARALLEL, so the
      # RUN's long pole went 470s -> 417s. Billed minutes rise (159 + 417 against 470)
      # while wall-clock falls. The apt path that cost 23 webkit tests on run
      # 32248711203 is gone from this file entirely.
      - name: e2e
        env:
          HOME: /root
        run: pnpm --filter @run-apparel/viewer test:e2e
      # THE PUBLIC MARKETING SITE, added 2026-09-05.
      #
      # ⚠️ A STEP IN THIS JOB RATHER THAN A JOB OF ITS OWN, DELIBERATELY. A new job
      # would have to be added to `deploy.needs` AND to the required-checks list, which
      # is a second copy of it — and this file's own notes record that splitting or
      # renaming a gating job without editing both silently stops a red gate blocking.
      # As a step it inherits `e2e`'s existing place in both, and reuses the container's
      # browsers instead of a second pull.
      #
      # WHAT IT CLOSES: until this existed, nothing in the repo loaded /, /products or
      # /contact in a browser. All 54 CMS test files read source text or exercise pure
      # functions, so three blank pages would have gone green through every gate. Found by
      # the 2026-09-05 site-pages audit (kept privately).
      #
      # Its own `webServer` runs `next build` from the cold checkout, so this step needs
      # no separate build step and no seeded database — the content helpers fall back to
      # defaults, and the gallery assertions cover both the populated and empty states.
      # It needs no secret either: apps/cms/e2e/serve.mjs supplies a throwaway
      # PAYLOAD_SECRET when the environment has none. Measured 2026-09-06 under these
      # exact conditions: without that fallback Payload never initialises, `/admin` and
      # `/api/*` answer 500, and four tests fail — while the page tests stay green.
      # ⚠️ THE PUBLIC-SITE SUITE NEEDS A DATABASE, AND UNTIL 2026-09-07 CI GAVE IT NONE.
      #
      # `serve.mjs` starts the built CMS against the local D1 emulation, and on a fresh
      # runner that database has no tables at all — the server log filled with
      # `D1_ERROR: no such table: site_settings`. The content helpers degrade to defaults
      # by design, so most pages still rendered and 285 tests passed, which is exactly why
      # nobody noticed: the eleven that failed were the ones that need real content —
      # the ItemList, the scroll restore, and both inquiry tests, which cannot store a row
      # in a table that does not exist.
      #
      # ⚠️ AND THE SUITE HAD BEEN DARK SINCE 2026-09-06. It is the LAST step of this job,
      # so every run whose viewer step failed first meant this never executed at all. Two
      # blind spots had to be open together for that to hide, and both were.
      #
      # This is the documented first-run from docs/ONBOARDING.md, in order. It is not
      # optional and it is not slow: seed:assets measured 7s, migrate and seed ~4s.
      #
      # PAYLOAD_SECRET: this job deliberately holds no real one (only the deploy job
      # does), and Payload refuses to initialise without any. A per-run throwaway is
      # correct here for the same reason serve.mjs supplies one — there is nothing behind
      # this database worth protecting — and a literal is avoided so the secrets scanner
      # has nothing to match.
      - name: Seed the database the public-site suite reads
        env:
          HOME: /root
          PAYLOAD_SECRET: ci-e2e-${{ github.run_id }}
        run: |
          pnpm seed:assets
          pnpm --filter @run-apparel/cms migrate
          pnpm seed:cms

      - name: e2e (public site)
        env:
          HOME: /root
        run: pnpm --filter @run-apparel/cms test:e2e

  # Dependency vulnerability gate. Runs in parallel with verify and gates the
  # deploy: a HIGH/CRITICAL advisory blocks production until it is fixed or
  # explicitly allowlisted (with justification) in audit-ci.jsonc.
  audit:
    # `pull-requests: read` is what dependency-review needs to diff a PR's manifests.
    # Restating `contents: read` is not optional — a job-level block REPLACES the
    # workflow default, and omitting it 404s `actions/checkout` on this private repo.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    # 20, not 10: the retry above needs room for three attempts, and on 2026-09-04
    # `pnpm/action-setup` alone consumed 372-425s of the old 10-minute budget. In the
    # normal case this job still finishes in about two minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # ⚠️ ONLY ON GITHUB'S RUNNERS. `cache: pnpm` makes setup-node pull a pnpm
          # cache archive from GitHub's cache service, and on the self-hosted runner
          # that archive is 377 MB arriving at 0.4-0.7 MB/s over a home connection —
          # measured as 151s of `audit`'s 205s, 206s of `lighthouse`'s 278s, in EVERY
          # job. It is also redundant there: each runner keeps its own persistent pnpm
          # store inside its work volume (infra/ci-runner/Dockerfile), on the same
          # filesystem as the checkout so pnpm hard-links instead of copying. Paying
          # 377 MB to rebuild a store that is already on disk is worse than no cache.
          #
          # `runner.environment` is the built-in that distinguishes them, so this stays
          # correct if a job ever runs on GitHub again — where the store IS ephemeral
          # and the archive genuinely helps.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          # ⚠️ `cache: ''` ALONE IS NOT ENOUGH ON setup-node v7, AND THAT IS NEW.
          # Since v7 the action AUTO-ENABLES the package-manager cache when
          # `package.json` declares `packageManager` — and ours does
          # (`package.json:6`, `pnpm@10.34.5`). The input that governs it defaults to
          # TRUE and is a SEPARATE knob from `cache:`, so the block above no longer
          # fully describes what the action will do.
          #
          # Measured 2026-09-08 in run 34256940744's `verify` log, where both appear:
          #
          #     cache: false
          #     package-manager-cache: true
          #     Progress: resolved 1063, reused 1059, downloaded 0, added 1063, done
          #     Done in 4.5s using pnpm v10.33.0
          #
          # So the explicit `cache:` currently WINS and nothing is fetched. Pinned here
          # anyway because it is one upstream default away from silently restoring the
          # 377 MB fetch this block exists to prevent — and the symptom would be a slow
          # job, never a failing one, which is the kind of regression nobody reports.
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - run: pnpm install --frozen-lockfile
      - name: Vulnerability audit (high/critical)
        run: |
          # audit-ci exits 1 for BOTH "found a high/critical advisory" and "could not reach
          # the advisory registry", and `deploy` lists this job in `needs` — so on
          # 2026-09-04 a degraded runner blocked the production deploy FIVE times while the
          # same audit passed locally on the same commit. The log's tell is
          # `code ERR_SOCKET_TIMEOUT: undefined` and, decisively, the absence of any
          # advisory list: when audit-ci finds something it prints it.
          #
          # ⚠️ audit-ci's OWN retry cannot help here, and the config's comment claiming it
          # does was wrong. It retries only when the error message matches
          # `PARTIAL_RETRY_ERROR_MSG[packageManager]`, and upstream ships
          # `pnpm: []  // TODO: Identify retry-able error message for pnpm`. So
          # `retry-count` has never retried anything in this repo, and `--pass-enoaudit`
          # is gated on the same flag and would be equally inert — checked in
          # audit-ci@7.1.0/dist/bin.cjs.
          #
          # So retry HERE, and only on the network signature. A real advisory prints its
          # list and must fail on the very first attempt: this must never be able to turn a
          # finding into a pass.
          #
          # ⚠️ TWO ATTEMPTS, AND THE COUNT IS ARITHMETIC, NOT TASTE. This shipped at 3 and
          # the job died at its own 20-minute ceiling mid-attempt-3 on the very next run —
          # `cancelled`, which reads exactly like a second push having killed it. Measured
          # from that run: `pnpm/action-setup` 426s, checkout+node+install 31s, so ~460s of
          # fixed cost before this step even starts, and a failing attempt took 251s then
          # 266s. 3 attempts = 460 + 3x270 + 2x15 = 1,300s = 21.7 min > 20. 2 attempts =
          # 1,015s = 16.9 min, which fits with three minutes of slack.
          #
          # Do NOT "fix" this by raising the ceiling instead. The numbers above were already
          # in this comment when it shipped at 3 — the arithmetic was wrong, not the budget.
          # And a third attempt cannot help what actually happens: on 2026-09-04 the registry
          # timed out twice in a row from the runner while `audit-ci` passed from a laptop in
          # 102s, and it had failed the same way the day before. A retry buys you a genuine
          # one-off blip; it cannot outlast a runner-network condition. That is what the
          # "Re-run this job" in the exhaustion message is for.
          attempts=2
          for i in $(seq 1 $attempts); do
            if pnpm exec audit-ci --config audit-ci.jsonc > audit.out 2>&1; then
              cat audit.out
              exit 0
            fi
            cat audit.out
            if ! grep -q 'ERR_SOCKET_TIMEOUT' audit.out; then
              echo "::error::audit-ci failed on a FINDING, not a network error — not retrying."
              exit 1
            fi
            echo "::warning::attempt $i of $attempts could not reach the advisory registry (ERR_SOCKET_TIMEOUT); this is not a vulnerability."
            if [ "$i" -lt "$attempts" ]; then sleep 15; fi
          done
          echo "::error::audit-ci could not reach the advisory registry after $attempts attempts. NOT a vulnerability — no advisory list was printed. Re-run this job."
          exit 1

      # SBOM + licence gate. `audit-ci` above answers "is anything known-vulnerable
      # TODAY"; this answers the question that only matters LATER — "were we running
      # the compromised version on the day it was published?" — which the lockfile's
      # git history answers far less conveniently, and only while that history is
      # still around.
      #
      # It also enforces the licence policy. This is a private commercial product, so
      # a strong-copyleft transitive (AGPL/SSPL/GPL) is a legal problem rather than a
      # style one, and it arrives the way every supply-chain problem arrives: as a
      # dependency nobody chose. Measured across 1,067 components on 2026-08-13 — zero
      # denied, so the gate starts clean.
      #
      # No new dependency: it reads `pnpm licenses list --json`, which pnpm already
      # computes from the lockfile it already resolved. Adding an SBOM tool to close a
      # supply-chain gap would mean trusting one more package to audit the packages.
      # DEPENDENCY REVIEW — the only control that sees a dependency change BEFORE it
      # merges, and the only one that covers the two npm lockfiles the pnpm-based
      # gates cannot reach: apps/shrink/container/package-lock.json and
      # tools/asset-pipeline/package-lock.json, which build the container that
      # processes every garment. `pnpm-workspace.yaml`'s 24-hour cooldown does not
      # apply to either, and `pnpm audit` does not resolve them.
      #
      # Fails on a HIGH or worse advisory in the diff, and on a denied licence.
      # PR-only by construction — there is no base to diff against on a push — so it
      # is a STEP in this gating job rather than a job of its own, which would either
      # trip the deploy-gating rule or block every deploy waiting on a check that
      # cannot run.
      # ⚠️ PUBLIC REPOSITORIES ONLY, since 2026-09-03. The action calls GitHub's
      # dependency-review API, which a PRIVATE repository gets only with Advanced
      # Security (Enterprise). It ran while the RUN-APPAREL org was on Enterprise; on
      # the personal Free plan the repo moved to on 2026-09-02 it fails every pull
      # request with "Dependency review is not supported on this repository", which
      # blocked PR #60 with the vulnerability audit above already green. That audit
      # (audit-ci, high/critical, path-scoped allow-list) is the gate that actually
      # reads advisories; this step only re-reviewed the PR's dependency diff. Skipping
      # it where it cannot run is honest; `continue-on-error` would hide a real finding
      # the day Advanced Security exists again.
      - name: Dependency review (pull requests on a public repository only)
        if: github.event_name == 'pull_request' && github.event.repository.private == false
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

      - name: SBOM + licence policy
        run: node scripts/sbom.mjs sbom.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

  # Secret scanning, and it GATES THE DEPLOY.
  #
  # This lived in its own security.yml until 2026-08-03, where it could only ever
  # fail its own run: `needs:` cannot reference a job in another workflow, so a
  # commit carrying a live key was scanned, flagged red, and deployed anyway.
  # docs/RUNBOOK.md described it under "CI quality gates" without saying so.
  # Moving it here is what makes the word "gate" true.
  secrets:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history — a secret is usually in an older commit

      # ⚠️ RUNS THE GITLEAKS BINARY, NOT gitleaks/gitleaks-action — a licence
      # decision AND a coverage one. Both were measured on 2026-08-18.
      #
      # LICENCE. The moment this repo moved into the RUN-APPAREL organisation the
      # Action began printing "[RUN-APPAREL] is an organization. License key is
      # required." gitleaks-action is free for personal accounts and PAID for
      # organisations. The gitleaks SCANNER is MIT and free; only the wrapper is
      # commercial. This project's entire budget is $5/month and is already spent
      # on Cloudflare Workers Paid, so a licence is not available to it.
      #
      # COVERAGE, which matters more. On run 32140573361 the Action invoked
      #   gitleaks detect ... --log-opts=-1
      # and reported "1 commits scanned. scanned ~60 bytes ... no leaks found".
      # Sixty bytes, while the checkout above deliberately fetches FULL history
      # because "a secret is usually in an older commit". The gate was green and
      # nearly empty — the same defect class as the citation command that exited 0
      # having checked nothing (audit M4). No --log-opts here, so the whole
      # history is scanned on every run, which is what the checkout was for.
      #
      # Consequences of dropping the wrapper, both deliberate:
      #   * `pull-requests: read` is gone — only the Action needed it, to list a
      #     PR's commits. Least privilege, so it goes.
      #   * No GITHUB_TOKEN is passed. Nothing here talks to the API.
      #
      # --redact so a hit never prints the secret into the log.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # gitleaks' own published checksums for that exact release, ONE PER ARCH.
          # ⚠️ BOTH ARE NEEDED SINCE 2026-09-08, when CI moved to a self-hosted arm64
          # runner. This step used to hardcode `linux_x64`, which is not a binary an
          # arm64 machine can execute — and `secrets` is in `deploy.needs`, so getting
          # this wrong blocks every deploy. Keeping both means the job runs unchanged on
          # a GitHub-hosted x64 runner too, which is the point: the workflow should not
          # care which machine it landed on.
          GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        run: |
          set -euo pipefail
          # ⚠️ DOWNLOAD TO A FILE, THEN EXTRACT — NOT curl | tar. On run
          # 33264929752 the release CDN answered 504 and this step failed as
          # "secrets: fail" on a PR with no secret in it, because the SCANNER
          # never downloaded. A failed fetch and a failed scan are not the same
          # result and must not look the same on a PR.
          #
          # The pipe was the other half: --retry re-issues the request, and a
          # retry that begins mid-stream feeds tar the tail of one response
          # glued to the head of the next. Landing the archive first makes the
          # retry safe and lets tar verify the gzip in one piece.
          # Resolve the arch, and REFUSE an unknown one rather than guessing. A wrong
          # guess here downloads a binary that cannot execute, and the failure reads as
          # "gitleaks is broken" rather than "wrong architecture".
          case "$(uname -m)" in
            x86_64|amd64) GL_ARCH=x64;   GL_SHA="${GITLEAKS_SHA256_X64}" ;;
            aarch64|arm64) GL_ARCH=arm64; GL_SHA="${GITLEAKS_SHA256_ARM64}" ;;
            *) echo "::error::unsupported arch $(uname -m) — add its gitleaks checksum"; exit 1 ;;
          esac
          echo "gitleaks ${GITLEAKS_VERSION} for linux_${GL_ARCH}"
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz"
          # ⚠️ VERIFY THE ARCHIVE BEFORE UNPACKING IT — L9-06, 2026-08-31.
          # Until now this downloaded a binary over the network and RAN it, with the
          # only check being that `gitleaks version` printed something. That proves
          # the bytes are a working executable; it says nothing about WHOSE. This is
          # the tool whose job is to stop secrets leaving the repository, running
          # with the checkout in front of it.
          # The digest is gitleaks' own published checksum for this exact version.
          # ⚠️ BUMP IT WITH GITLEAKS_VERSION — they change together, and a stale
          # digest fails loudly here rather than silently skipping, which is the
          # behaviour worth having.
          echo "${GL_SHA}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # Proves the binary is real before the scan, so a corrupt archive fails
          # here with a clear message rather than as an ambiguous scan result.
          /tmp/gitleaks version
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

  # Performance budget + a11y snapshot (Lighthouse CI) against the viewer served
  # with the same server-side mock the e2e suite uses. Informational: it does
  # NOT gate the deploy (a Chrome flake must never block a live release), but the
  # deterministic byte-weight budgets in lighthouserc.json fail the check on a
  # real regression so it surfaces on the PR. Make it a required check via branch
  # protection if you want it to block merges.
  #
  # ⚠️ WHAT THIS DOES NOT COVER. The page it measures serves the SEEDED
  # PLACEHOLDER GLB — about 10 KB. A real garment is 8–40 MB, so nothing here
  # says anything about the weight of a production page, and a green run must
  # never be read that way. The budget that does apply to real models is enforced
  # where they actually pass through: SIZE_WARNING_BYTES in the shrink report the
  # owner reads, and GLB_HARD_MAX_BYTES in the CMS upload guard.
  #
  # What this job genuinely protects is the *application shell* — scripts, CSS,
  # fonts. The budgets in lighthouserc.json are scoped to exactly that and are set
  # ~16-46% above measured, so a stray dependency fails the check. The old
  # `total-byte-weight` assertion was removed: it summed the shell and the model
  # together, which made a 2.1 MB ceiling look like a claim about the live page.
  #
  # ⚠️ THIS SAID THE SHELL IS "byte-for-byte the same in production as it is here"
  # UNTIL 2026-08-30. IT IS NOT. This job builds with no `VITE_SENTRY_DSN`, and
  # apps/viewer/src/lib/sentry.ts only `import()`s the SDK when a DSN is present —
  # so the Sentry chunk exists in production and in NO build this gate ever weighs.
  # Measured that day on the live site: the entry chunk dynamically imports
  # `prod-GTOH4Bob.js`, which serves 200 with `content-length: 85013` (~28.5 KB
  # gzip), while `ls apps/viewer/dist/assets/prod-*` matches nothing locally.
  #
  # The gate is still worth having — a stray dependency in the shell still fails it
  # — but it measures a build a customer never receives, and the deploy job's build
  # (which DOES carry the DSN) is weighed by nothing. Do not read a green run as a
  # statement about the live page's script weight.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # ⚠️ ONLY ON GITHUB'S RUNNERS. `cache: pnpm` makes setup-node pull a pnpm
          # cache archive from GitHub's cache service, and on the self-hosted runner
          # that archive is 377 MB arriving at 0.4-0.7 MB/s over a home connection —
          # measured as 151s of `audit`'s 205s, 206s of `lighthouse`'s 278s, in EVERY
          # job. It is also redundant there: each runner keeps its own persistent pnpm
          # store inside its work volume (infra/ci-runner/Dockerfile), on the same
          # filesystem as the checkout so pnpm hard-links instead of copying. Paying
          # 377 MB to rebuild a store that is already on disk is worse than no cache.
          #
          # `runner.environment` is the built-in that distinguishes them, so this stays
          # correct if a job ever runs on GitHub again — where the store IS ephemeral
          # and the archive genuinely helps.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          # ⚠️ `cache: ''` ALONE IS NOT ENOUGH ON setup-node v7, AND THAT IS NEW.
          # Since v7 the action AUTO-ENABLES the package-manager cache when
          # `package.json` declares `packageManager` — and ours does
          # (`package.json:6`, `pnpm@10.34.5`). The input that governs it defaults to
          # TRUE and is a SEPARATE knob from `cache:`, so the block above no longer
          # fully describes what the action will do.
          #
          # Measured 2026-09-08 in run 34256940744's `verify` log, where both appear:
          #
          #     cache: false
          #     package-manager-cache: true
          #     Progress: resolved 1063, reused 1059, downloaded 0, added 1063, done
          #     Done in 4.5s using pnpm v10.33.0
          #
          # So the explicit `cache:` currently WINS and nothing is fetched. Pinned here
          # anyway because it is one upstream default away from silently restoring the
          # 377 MB fetch this block exists to prevent — and the symptom would be a slow
          # job, never a failing one, which is the kind of regression nobody reports.
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - run: pnpm install --frozen-lockfile
      - name: Build viewer with the e2e mock origin
        run: node apps/viewer/e2e/prepare.mjs
      - name: Lighthouse CI
        # Chrome is resolved at runtime and the step FAILS LOUDLY without one. GitHub's
        # ubuntu image ships google-chrome; with none, `lhci autorun` says "no Chrome
        # installations found", which reads as a broken config rather than a missing binary.
        #
        # ⚠️ THE `/ms-playwright` FALLBACK WENT WITH THE SELF-HOSTED RUNNER, 2026-09-10. It
        # was also the one line actionlint rejected when CI returned to GitHub's runners:
        # `ls -d /ms-playwright/...` is shellcheck SC2012, and actionlint applies shellcheck
        # rules only when a `shellcheck` binary is on PATH. GitHub's image has one; the
        # Mac's Playwright-based runner image did not, so the line passed there for a day.
        # Proven both ways locally with actionlint 1.7.12: no shellcheck -> exit 0,
        # shellcheck present -> SC2012.
        run: |
          set -euo pipefail
          CHROME_PATH="${CHROME_PATH:-}"
          [ -n "$CHROME_PATH" ] || CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ ! -x "$CHROME_PATH" ]; then
            echo "::error::no Chrome for Lighthouse (looked for google-chrome and chromium on PATH)"
            exit 1
          fi
          export CHROME_PATH
          echo "Lighthouse will drive $CHROME_PATH"
          pnpm exec lhci autorun

  # Does the shipped decimation preset still leave printed artwork readable?
  #
  # This is the gap CLAUDE.md names outright: "the three blocking gates do NOT
  # catch decimation damage […] Nothing in this system measures whether the
  # letters survived; only a rendered crop does." A six-run sweep on 2026-08-05
  # rendered the chest wordmark illegible and every run passed all three gates.
  # `balanced` has been pinned by an absolute test whose only evidence is a PNG a
  # human looked at once. This renders the artwork before and after the real
  # chain and measures how much of it moved.
  #
  # GATES THE DEPLOY since 2026-08-06. It was introduced observe-only on the
  # stated worry that "its thresholds were calibrated on a developer Mac, and CI
  # runs a different Chromium on a different rasteriser, so the absolute numbers
  # will not match on the first run" — the 8c6e27e lesson applied pre-emptively.
  #
  # That worry was MEASURED AND IS FALSE. Four runs, two operating systems, two
  # GPU stacks, three runner images (ubuntu24 20260720.247 ×2, 20260804.265):
  #
  #   fidelity  1.650%   balanced  3.070%   control  9.370%   ceiling  5.000%
  #
  # Identical to three decimal places every time — CI runs 92589208571 /
  # 92591396265 / 92593229399 and a local macOS run on 2026-08-06. Not "close
  # enough": the same digits.
  #
  # The reason is in the eval's own header and is worth restating, because it is
  # what makes gating safe rather than lucky: there is NO golden image. Every
  # comparison is between two renders taken by the SAME browser in the SAME run,
  # so the rasteriser appears on both sides of the subtraction and cancels. The
  # only surviving variable is the decimation, and meshoptimizer is deterministic.
  # A Chromium bump moves both renders together and cannot move the diff.
  #
  # So the ceiling did NOT need to be re-derived from CI numbers — the CI numbers
  # are the numbers it was already calibrated against. 5.000% sits 1.63× above the
  # shipped preset and 1.87× below the negative control.
  #
  # The control is what keeps this honest. If someone coarsens the fixture,
  # shrinks the render, or loosens the metric, `--uv-weight 0` stops registering
  # as damage and the eval fails ITSELF rather than passing quietly. Do not raise
  # the ceiling to make this green; read the contact sheet it points at.
  #
  # Chromium only — WebKit and Firefox are not needed, and the render harness
  # already runs software WebGL via swiftshader.
  artwork:
    runs-on: ubuntu-latest
    # 20 -> 30 on 2026-08-18, to match `verify`, after this job was CANCELLED twice
    # in a row at exactly 20m20s — which reads as a failed gate and was not one.
    #
    # Both runs died in `playwright install-deps chromium`, an apt-get, with the
    # log repeating `Ign: http://azure.archive.ubuntu.com/ubuntu noble InRelease`
    # before falling back to the much slower https://archive.ubuntu.com. The Azure
    # Ubuntu mirror was degraded; nothing in this repository changed. The eval
    # itself never ran on either attempt.
    #
    # `verify` sat through the SAME apt slowdown in the same run and passed, taking
    # 25m29s against its 30-minute ceiling. That is the whole difference: identical
    # external cause, different headroom. For reference this job takes ~2m08s when
    # the mirror is healthy (run 32140573361, 13:08 UTC the same day), so 30 minutes
    # is not a loosened budget — it is ~14x the normal runtime, sized to absorb a
    # third-party outage rather than report one as a code failure.
    #
    # This does NOT weaken the gate: the artwork eval and its --uv-weight 0 negative
    # control still have to pass. Do not raise the eval's CEILING; that is a
    # different number and it is measured. See the block above this job.
    timeout-minutes: 30
    # NO APT SINCE 2026-08-20. This job was CANCELLED twice at exactly 20m20s inside
    # `playwright install-deps chromium` — an apt-get — while Azure's Ubuntu mirror was
    # degraded and nothing in this repository had changed. Raising the ceiling 20 -> 30
    # only moved which job died. The image below already carries Chromium and its
    # system libraries, so the Ubuntu mirror is off this job's critical path entirely;
    # it pulls ~905 MB from MCR instead, which is a different provider and a different
    # outage. Playwright's own answer to this problem (microsoft/playwright#23388,
    # closed) is this image.
    #
    # THE PULL IS PAID EVERY RUN and cannot be cached: a hosted runner is ephemeral and
    # the job container is pulled BEFORE the first step executes, so actions/cache is
    # not even running yet. Blog posts claiming layer caching helps here are describing
    # self-hosted runners.
    #
    # WHAT IT ACTUALLY COSTS, measured over two runs rather than predicted — the
    # prediction was 115s and was wrong by 27s, which is why this block states numbers:
    #
    #   apt baseline   32336966625            107s   (setup-node 13 + install 15
    #                                                 + cache 4 + apt 14 + eval 54)
    #   container cold 32347073451            183s   (pull 38 + install 25 + eval 50
    #                                                 + 59s pnpm-store cache SAVE)
    #   container warm 32347453525            142s   (pull 38 + setup-node 20
    #                                                 + install 13 + eval 56)
    #
    # So steady state is 142s against 107s: **+35s per run, every run**. The cold-run
    # spread was the pnpm store cache being written for the new key, not the pull.
    #
    # ⚠️ THE PULL IS MOSTLY STABLE, NOT ALWAYS. Across seven pulls of this image (both
    # container jobs, five runs): 36, 38, 38, 38, 39, 40 and one **60s**. Median 38s.
    # Budget for ~40s and know the tail exists — an earlier version of this comment
    # said "38s in every run", which was true of the first three and stopped being
    # true. If you are about to state what this step costs, state the spread.
    #
    # That 35s is the price of the trade, and it is worth naming honestly: it buys the
    # removal of a failure mode that cost this job 20m20s twice in cancelled runs and
    # took `verify` red at 30m21s. A third of a minute per run against a third-party
    # outage that blocks a deploy.
    #
    # ROOT ON PURPOSE — do NOT add `options: --user 1001`, which upstream's own example
    # uses. That is what triggers Firefox's `Can't find profile directory`
    # (microsoft/playwright#31685). This job is Chromium-only so it would not bite here,
    # but establishing root is what makes containerising the e2e job safe later. Running
    # as root disables the Chromium sandbox; the render harness already runs software
    # WebGL through swiftshader, so it costs nothing.
    #
    # THE PLAYWRIGHT IMAGE MOVED, THE PIN DID NOT LOOSEN. This job no longer declares a
    # `container:`; since 2026-09-08 the self-hosted runner is built FROM that image, so
    # the tag now lives in `infra/ci-runner/Dockerfile`. It must still equal the
    # `@playwright/test` version — the image SHIPS the browsers, the package drives them,
    # and a mismatch fails at RUNTIME with `browser not found at /ms-playwright/...`.
    # `apps/cms/src/workflowHardening.test.ts` reads the Dockerfile as well as every
    # workflow, and now FAILS if it finds no image at all, because deleting the container
    # is exactly what made that rule inert. A TAG and not a digest because
    # `.github/dependabot.yml` declares no docker ecosystem, so a digest would go stale
    # in silence. ⚠️ Bumping the tag needs the runner image REBUILT to take effect —
    # see infra/ci-runner/README.md.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # NO `actions/setup-node` IN THIS JOB — the image already ships Node v24.18.1,
      # which is the version this repo pins, verified by running the image.
      #
      # It was kept at first "because `cache: pnpm` makes install faster", and that
      # reasoning did not survive measurement. Six container runs of this job, and the
      # totals are BIMODAL rather than noisy:
      #
      #   cache HIT   142s, 142s, 146s   setup-node 20-25s   install 13-16s
      #   cache MISS  182s, 183s, 184s   setup-node 55-61s   install 25-26s
      #
      # The 40s is the store cache being SAVED, and which mode you get is not luck:
      # Actions caches are BRANCH-SCOPED, so a cache written on one PR branch cannot be
      # read from another. Only `main`'s caches are readable everywhere. Every feature
      # branch therefore pays the miss — i.e. the slow mode is the normal one exactly
      # where fast feedback matters.
      #
      # So this step cost 20-25s to save ~10s on install in the best case, and 55-61s
      # in the common one. Dropping it makes `pnpm install` fetch every time (~25s) and
      # removes both.
      #
      # MEASURED AFTER, run 32353281315 — a fresh branch, so a cache-MISS run by
      # construction and therefore comparable to the 182/183/184s mode:
      #
      #   artwork  183s -> 122s   (-61s against MISS, -20s against the 142s HIT)
      #   e2e      417s -> 384s   (-33s; its 309s of tests dominate either way)
      #
      # It wins in BOTH modes, but the number is not the best part: with no cache to
      # hit or miss, the job is now FLAT at ~122s instead of swinging 40s depending on
      # which branch it ran from. A predictable job is worth more than a fast one that
      # is fast only when you are lucky about branch scoping.
      - run: pnpm install --frozen-lockfile
      # The Playwright cache, the two install steps and the missing-deps warning that
      # used to sit here were DELETED 2026-08-20. The image above already carries
      # Chromium and its system libraries, so there is nothing left to fetch or
      # install: `Artwork legibility eval` runs directly against /ms-playwright.
      # Measured before deleting them, run 32336966625, healthy runner:
      #     setup-node 13s + pnpm install 15s + cache restore 4s + apt 14s + eval 54s
      #     = 107s total.
      # Compare `Initialize containers` in this run against that 14s and that 107s.
      # `--keep` so a failure leaves its contact sheets behind: on 2026-09-03 the eval
      # failed on the runner with "fidelity damaged MORE than balanced (1.070% vs 0.520%)"
      # — a number every local run and the previous CI run had put at 0.520% — and the
      # sheets that would have shown WHAT moved had been written to a temp dir the job
      # threw away. The number without the picture is exactly what this eval exists to
      # refuse; the step below uploads them only when the eval fails.
      - name: Artwork legibility eval
        run: pnpm eval:artwork -- --keep "$RUNNER_TEMP/artwork-eval"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: artwork-eval-${{ github.sha }}
          path: ${{ runner.temp }}/artwork-eval/sheet-*.png
          retention-days: 7
          if-no-files-found: warn

      # THE INSTRUMENTS, READ BACK FROM A REAL BROWSER — audit HR-7, 2026-09-02.
      # Every earlier test of the two local <model-viewer> pages checked TEXT: that the
      # page source contained "Object.defineProperty(camera, 'near'". A model-viewer
      # release that renamed one internal symbol would leave all of that green while
      # the pages quietly stopped installing the near plane and the decal bias — the
      # two things that made the harness misrepresent the product in the first place.
      # This loads a fixture into Chromium and reads the internals back. It runs HERE,
      # not in `verify`, because this is the job with a browser; in the plain runner
      # the file skips itself loudly, and a skipped browser test is not a passed one.
      - name: Instruments read back from a real browser
        run: pnpm --filter @run-apparel/asset-pipeline exec vitest run src/instruments.browser.test.ts

  deploy:
    # `artwork` joined this list on 2026-08-06 — see the evidence above its job.
    # It is the only gate here that looks at what the customer actually sees:
    # the others test alphaMode, dependencies, secrets and byte budgets, none of
    # which change when decimation smears a printed logo.
    #
    # `e2e` joined on 2026-08-20, when it was split out of `verify`. It was never
    # ungated — it was INSIDE `verify`, which is on this list — and adding it here is
    # what keeps that true. ⚠️ The `main` ruleset's required-status-checks list is a
    # SECOND place that has to name it, and forgetting it means a red e2e no longer
    # blocks a merge. `apps/cms/src/workflowHardening.test.ts` enforces this half.
    #
    # ⚠️ THIS SAID THE RULESET IS "org config no test here can read" UNTIL 2026-08-30.
    # It is not org config — `gh api repos/hateem2121/RUN-APPAREL-W.D/rulesets/<id>` (the
    # org and its ruleset 21016174 were deleted on 2026-09-02; see .github/CLAUDE.md)
    # returns `"source_type": "Repository"` and its five contexts under the ordinary
    # `repo` scope. Run that when changing a gating job; it is one command, and the
    # belief that it was unreadable is why nobody did.
    #   gh api repos/hateem2121/RUN-APPAREL-W.D/rulesets/<id> \
    #     --jq '[.rules[]|select(.type=="required_status_checks").parameters.required_status_checks[].context]'
    # It still cannot be a CI GATE: GITHUB_TOKEN has no `administration` permission,
    # so a workflow cannot read it. Unreadable BY CI is not the same as unreadable.
    # A job-level `permissions:` block REPLACES the workflow default, it does not
    # add to it — so `contents: read` MUST be restated here or `actions/checkout`
    # fails with a 404 on this private repo. That is the exact bug that killed
    # uptime.yml for 23 hours; see the note at the top of that file.
    #
    # `issues: write` is new on 2026-08-30, for the failure alert at the end of this
    # job. Until then the post-deploy smoke tests could DETECT a bad release and
    # tell nobody: the workflow ran with `contents: read` only, so nothing could
    # open an issue, and a failed deploy was a red tick in a tab nobody was watching.
    permissions:
      contents: read
      issues: write
    needs: [verify, e2e, audit, secrets, artwork]
    # Enabled once Cloudflare secrets are configured (Phase 10):
    #   gh variable set DEPLOY_ENABLED --body true
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The `production` environment is a LABEL here, and that is a CLOSED DECISION
    # rather than an unfinished setup step. Required reviewers need GitHub Pro
    # (~$4/month) on a private repo; the project's entire budget is $5/month, spent
    # on Cloudflare Workers Paid because the shrink Containers require it. Declined
    # by the owner 2026-07-22.
    #
    # This comment used to explain how to add reviewers, which read as a to-do and
    # kept resurfacing in status reviews as "blocked, revisit later". It is not
    # blocked; it is declined. Do not list it as pending work.
    #
    # What gates this deploy is the `needs:` list above — FIVE jobs (verify, e2e,
    # audit, secrets, artwork), including the artwork legibility eval — plus the
    # post-deploy payload smoke test below. `lighthouse` runs alongside and is
    # deliberately NOT in `needs:`; it is informational (its category scores swung
    # 0.64/0.88/0.87 across three runs of an identical build). This comment said
    # "five jobs" until 2026-08-07, which double-counted it.
    #
    # What the environment still earns is the deployment URL on the commit and in
    # the Deployments tab.
    environment:
      name: production
      url: https://viewer.wear-run.help
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # ⚠️ NO CACHE IN THIS JOB — IT HOLDS THE PRODUCTION CLOUDFLARE TOKEN.
          #
          # A restored pnpm store was saved by an EARLIER job that holds no secrets
          # (`verify`, `audit` and `lighthouse` on `main` all use `cache: pnpm`), so
          # anything that ran during that job's install could plant code this job then
          # executes with the token in reach. That is the shape of TanStack's
          # 2026-05-11 compromise: a poisoned pnpm-store cache, restored by the job that
          # published. setup-node's own README, at the pinned SHA: "For workflows with
          # elevated privileges or access to sensitive information, we recommend
          # disabling automatic caching". The price is one uncached install per deploy.
          #
          # BOTH inputs, deliberately. `cache: ''` is what keeps the pnpm store out
          # (setup-node caches pnpm only when asked); `package-manager-cache` is a
          # separate input with its own default, pinned so no upstream default change
          # can turn caching back on here. apps/cms/src/publicRepoGuards.test.ts fails
          # if a job holding the production environment restores a cache.
          cache: ''
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm seed:assets

      # THE PRIVATE DOCUMENT CODES MUST EXIST BEFORE THE CODE THAT CHECKS THEM SHIPS.
      #
      # catalogue.wear-run.help and profile.wear-run.help open only with a code held
      # as a Worker secret, and codesMatch fails CLOSED without one — so a deploy with
      # a missing secret shows every customer "not active" while every gate here stays
      # green. This stops the deploy instead. The secrets are set by a person
      # (docs/RUNBOOK.md → "Private document links"), never by CI: a code printed in
      # this public log would be a published link.
      #
      # `wrangler secret list` prints names and types, never values.
      - name: Assert the apex Worker holds both private document codes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          names=$(pnpm --filter @run-apparel/viewer exec wrangler secret list --name run-apparel-apex-404)
          for secret in CATALOGUE_CODE PROFILE_CODE; do
            if echo "$names" | grep -q "\"name\": *\"$secret\""; then
              echo "$secret: present"
            else
              echo "::error::The apex Worker has no $secret secret, so that private document link would show 'not active'. Set it (docs/RUNBOOK.md → Private document links), then re-run this job."
              exit 1
            fi
          done

      # Gated migration step: apply any pending committed migrations to the
      # REMOTE production D1 *before* the new Worker is deployed. Replaces the
      # old cold-start `prodMigrations` path (which hung in production once). If
      # this fails the job stops here and the new Worker is never deployed, so
      # traffic keeps hitting the last-good version against the last-good schema.
      # Migrations should be additive (expand/contract) so the currently-running
      # Worker tolerates the new schema during the brief window before deploy.
      # BACK UP BEFORE MIGRATING, NOT NIGHTLY-AND-HOPE.
      #
      # Added 2026-08-30. `docs/BACKUP-RESTORE.md` and CLAUDE.md both instruct a
      # human to take a D1 backup before merging to main — and nothing enforced it,
      # so the only snapshot behind an automated production migration was whenever
      # nightly-backup.yml last happened to run.
      #
      # ⚠️ "Nightly" is a request, not a schedule. Measured 2026-08-30 across ten
      # runs of a nominal `17 2 * * *` cron, GitHub delivered them at 03:07, 03:09,
      # 03:12, 03:15, 03:16, 03:18, 08:18, 09:03, 12:47 and 14:21 UTC — worst case
      # more than TWELVE HOURS late. A late-day merge could therefore migrate
      # production against a snapshot 16+ hours old, which is the gap between "we
      # have backups" and "we have a backup of the thing we are about to change".
      #
      # WHERE THE SNAPSHOT GOES — changed 2026-09-10, when the repository became
      # public. It was uploaded as a GitHub artifact (7 days), and on a public
      # repository ANY signed-in GitHub account can download an artifact: this one is
      # an unredacted dump carrying user password hashes and encrypted API keys. It now
      # goes to the private R2 bucket beside the nightly copies — after it is proven to
      # restore, and before the migration can run (the three steps below).
      - name: Back up production D1 before migrating
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/backup-d1.mjs --stamp="pre-deploy-${{ github.sha }}"

      # ⚠️ THE ONE BACKUP NOBODY CHECKED, TAKEN AT THE ONE MOMENT IT MATTERS MOST.
      #
      # The step above snapshots production D1 immediately before a migration, and
      # until 2026-08-31 the only evidence it was usable was that `wrangler d1 export`
      # exited 0. A truncated dump, a file cut off mid-INSERT, or a schema that cannot
      # be rebuilt all exit 0 too — and every one of them is discovered during a
      # restore, after the data is already gone.
      #
      # nightly-backup.yml has verified its dumps by REPLAYING them since 2026-08-18.
      # This snapshot — the one taken seconds before the database is altered — did not
      # get the same treatment.
      #
      # Placed BEFORE the migration deliberately: an unusable snapshot must stop the
      # deploy while the database is still untouched, which is the entire reason for
      # taking it here rather than relying on last night's. Audit 2026-08-30 PM,
      # finding L20-09.
      - name: Verify the pre-deploy backup actually restores
        run: |
          set -euo pipefail
          shopt -s nullglob
          dumps=(backups/d1/*.sql)
          if [ ${#dumps[@]} -eq 0 ]; then
            echo "::error::the pre-deploy backup step produced no .sql file"
            exit 1
          fi
          for dump in "${dumps[@]}"; do
            node scripts/verify-backup.mjs "$dump"
          done

      # KEEP IT, PRIVATELY, BEFORE ANYTHING CHANGES. Copied into the private
      # `run-private` bucket under `run-apparel-viewer-db/pre-deploy/`, beside the
      # nightly dumps, then read back and compared byte-for-byte — `wrangler r2 object
      # put` exits 0 on a great many things. Both steps sit between the restore check and
      # the migration, so a snapshot that could not be stored stops the deploy while the
      # database is still untouched. The absolute `--file` path is required: `pnpm
      # --filter` runs wrangler with its cwd in apps/cms (same note in nightly-backup.yml).
      - name: Copy the verified pre-deploy dump into R2 (run-private)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dump in backups/d1/*.sql; do
            key="run-apparel-viewer-db/pre-deploy/$(basename "$dump")"
            echo "uploading $dump -> run-private/$key"
            pnpm --filter @run-apparel/cms exec wrangler r2 object put \
              "run-private/$key" --file "$GITHUB_WORKSPACE/$dump" --remote
          done

      - name: Assert the pre-deploy dump is readable back out of R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dump in backups/d1/*.sql; do
            key="run-apparel-viewer-db/pre-deploy/$(basename "$dump")"
            pnpm --filter @run-apparel/cms exec wrangler r2 object get \
              "run-private/$key" --file "$RUNNER_TEMP/roundtrip.sql" --remote
            want=$(wc -c < "$dump")
            got=$(wc -c < "$RUNNER_TEMP/roundtrip.sql")
            if [ "$want" != "$got" ]; then
              echo "::error::$key read back as $got bytes, expected $want. The copy in R2 is not the dump."
              exit 1
            fi
            echo "verified $key: $got bytes match"
          done

      - name: Apply pending D1 migrations (gated, pre-deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: pnpm --filter @run-apparel/cms migrate:remote

      # THE APEX WORKER, WHICH NOTHING DEPLOYED UNTIL NOW.
      #
      # `infra/apex-404/` was hand-deployed from the Cloudflare dashboard on
      # 2026-08-28 and drifted from the repo for two days: the live Worker served
      # /catalogue and /profile from R2 while the committed source 404'd every path.
      # A routine `wrangler deploy` from that folder would have taken both PDFs
      # offline and reported success. CI owns it now, so the repo is the record.
      #
      # A STEP, NOT A JOB, deliberately. A new job in this file must also be added to
      # the `main` ruleset's required-status-checks list, which is org config no test
      # here can read — so a job would introduce a second place to forget. A step
      # inherits this job's gates.
      #
      # FIRST, BEFORE THE CMS WORKER, SINCE 2026-09-06 — and not merely "early".
      # A route pattern belongs to one Worker at a time. This Worker used to hold
      # `wear-run.help/*` and `www.wear-run.help/*`; the marketing site now lives on
      # them, served by the CMS Worker. So this deploy must give the wildcards UP
      # before the CMS deploy claims them, or the CMS deploy is refused for a route
      # that is still taken. The four PDF routes stay attached throughout; the only
      # window is the seconds between the two deploys on `wear-run.help/` itself.
      # Its assertion stays LAST in this job, after the site is up, so a bad apex
      # deploy is still caught in this run rather than by tomorrow's uptime cron.
      #
      # ⚠️ `git revert` across the reconcile commit redeploys the 404-everything
      # script. docs/RUNBOOK.md → "Undoing a bad deploy" carries the exception.
      - name: Deploy apex worker (private document hosts + retired PDF paths)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_MESSAGE: ${{ github.sha }}@${{ github.ref_name }}
        # See the version-labelling note on the CMS deploy step BELOW (it was above
        # until this step moved ahead of it on 2026-09-06). The apex is the Worker
        # this matters most for: its drift is what motivated the finding.
        run: pnpm deploy:apex

      - name: Deploy CMS worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_MESSAGE: ${{ github.sha }}@${{ github.ref_name }}
        # ⚠️ LABEL THE VERSION. Of 85 deployed versions across all five Workers,
        # exactly ONE carried a message — and it was the hand-edit in the dashboard
        # that caused the 2026-08-28 apex drift. So `wrangler versions list` was a
        # column of UUIDs, and the only readable entry was the accident.
        # `--message` is a documented `wrangler deploy` flag (verified against
        # `wrangler@4.137.0 deploy --help`), and opennextjs-cloudflare forwards its
        # positional args straight through (`...args.wranglerArgs` in
        # dist/cli/commands/deploy.js). Changes no behaviour; makes a rollback
        # readable under pressure. Audit 2026-08-30 PM, finding L1-03.
        #
        # ⚠️ PASSED AS AN ENV VAR, NOT AS `pnpm run deploy -- --message …`. MEASURED
        # 2026-08-31 with a throwaway package: pnpm does NOT strip the separator — the
        # script received `["--", "--message", "abc def"]`, so wrangler would have been
        # handed a bare `--` as its first argument. The env-var form also keeps ONE
        # copy of the deploy command, in package.json, instead of a second copy here.
        #
        # ⚠️⚠️ AND THE VALUE MUST CONTAIN NO SPACES. `<sha> <ref>` BROKE THE DEPLOY on
        # 2026-08-31 (run 33389281950): opennextjs-cloudflare's `runWrangler` calls
        # `spawnSync(..., { shell: true })`, which JOINS the argv array into a shell
        # string — so a quoted value with a space is re-split by the shell. wrangler
        # then read the trailing word as its optional `[script]` positional and
        # reported `The entry-point file at "main" was not found`, which names the ref,
        # not the config. Hence `@` rather than a space. The viewer and shrink call
        # wrangler directly and were never affected, but the same form is used
        # everywhere so nobody has to remember which is which.
        run: pnpm --filter @run-apparel/cms run deploy

      - name: Apply worker secret (PAYLOAD_SECRET)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: printf '%s' "$PAYLOAD_SECRET" | pnpm --filter @run-apparel/cms exec wrangler secret put PAYLOAD_SECRET

      # L6-03. Until 2026-08-31 Sentry held one project covering the browser only,
      # and the CMS — the side with the database and the password — reported
      # nothing anywhere. The DSN is a SEPARATE project from the viewer's, so this
      # deliberately reads CMS_SENTRY_DSN and writes it as SENTRY_DSN inside the
      # Worker; using the viewer's DSN here would silently merge two systems'
      # errors into one project and destroy the grouping that makes them useful.
      - name: Apply worker secret (SENTRY_DSN, CMS project)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_SENTRY_DSN: ${{ secrets.CMS_SENTRY_DSN }}
        run: printf '%s' "$CMS_SENTRY_DSN" | pnpm --filter @run-apparel/cms exec wrangler secret put SENTRY_DSN

      # ⚠️ The assertion is the point, not the step above it. `instrumentation.ts`
      # treats a missing DSN as a no-op — it has to, because every build, test and
      # Payload CLI run has no DSN — so a secret that failed to apply produces a
      # CMS that reports nothing and a deploy that goes green. That is precisely
      # the state L6-03 recorded, and it would come back undetected. This is what
      # makes it detectable.
      - name: Assert the CMS Worker actually holds SENTRY_DSN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          names=$(pnpm --filter @run-apparel/cms exec wrangler secret list)
          echo "$names"
          echo "$names" | grep -q '"name": *"SENTRY_DSN"' || {
            echo "::error::The CMS Worker has no SENTRY_DSN secret. The CMS is reporting no errors to Sentry (L6-03). Check the CMS_SENTRY_DSN repository secret."
            exit 1
          }

      - name: Build viewer
        env:
          # Defaults to the clean custom domain; overridable via repo variable
          # (e.g. the CMS workers.dev URL to bypass zone-level Bot Fight Mode).
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://cms.wear-run.help' }}
          # Optional Sentry (free tier). Unset by default — apps/viewer/src/lib/sentry.ts
          # no-ops and Vite dead-code-eliminates @sentry/browser, so this costs nothing
          # until a DSN exists. Without these two lines the DSN could never reach the
          # build, so RUNBOOK's "set the VITE_SENTRY_DSN build variable" was unactionable.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          # Tags each Sentry issue with the commit that produced it. This value MUST
          # equal the plugin's `release` below — events arriving under a release with
          # no uploaded maps stay minified, and that mismatch is the most common cause
          # of unsymbolicated traces.
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          # Explicit, because `import.meta.env.MODE` is 'production' for EVERY
          # `vite build` and so cannot distinguish a real deploy from a local one.
          VITE_SENTRY_ENVIRONMENT: production
          # Source-map upload. All three must be present or vite.config.ts omits the
          # plugin entirely and generates no maps — see the coupling note there.
          # A token is a SECRET, never a variable: it can write to the Sentry org.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: pnpm --filter @run-apparel/viewer build

      # dist/ is deployed wholesale (apps/viewer/wrangler.jsonc → assets.directory),
      # so a stray .map would be served to the public internet — the un-minified
      # source of the viewer, on a URL nobody would think to check. vite.config.ts
      # deletes them after upload and emits them 'hidden' so no browser asks for
      # them; this asserts the outcome rather than trusting either mechanism, because
      # the failure is silent and would not be noticed until someone looked.
      - name: Assert no source maps are about to be deployed
        run: |
          maps=$(find apps/viewer/dist -name '*.map' | wc -l | tr -d ' ')
          if [ "$maps" != "0" ]; then
            echo "::error::$maps source map(s) survived in apps/viewer/dist — refusing to deploy."
            find apps/viewer/dist -name '*.map'
            exit 1
          fi
          echo "No source maps in dist. Safe to deploy."

      # Viewer deploy target, selectable via the VIEWER_DEPLOY_TARGET repo
      # variable. The Worker (run-apparel-viewer-site) has served
      # viewer.wear-run.help since the 2026-07-22 cutover; the Pages project was
      # deleted then. The Pages steps are KEPT as the rollback path — setting
      # VIEWER_DEPLOY_TARGET=pages recreates the project and deploys to it. See
      # docs/RUNBOOK.md → "Viewer: Pages → Worker cutover".
      #
      # THE DEFAULT IS THE WORKER, and that is the point of the `== 'pages'`
      # comparison rather than `!= 'worker'`. Written the other way, an unset or
      # mistyped variable sent the deploy to Pages: the job goes green, a Pages
      # project is recreated, and the live custom domain — which points at the
      # Worker — keeps serving the previous build. A deploy that reports success
      # and changes nothing is the worst failure mode available here.
      - name: Ensure Pages project exists
        if: vars.VIEWER_DEPLOY_TARGET == 'pages'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Tolerate ONLY "already exists". The previous form was
        #   ... 2>/dev/null || echo "already exists — continuing."
        # which discarded stderr and swallowed every failure equally: a bad API
        # token, a wrong account id, a Cloudflare outage all printed "already
        # exists" and let the deploy proceed to fail later, somewhere less
        # obvious. Match the message, re-raise anything else.
        run: |
          set -o pipefail
          if ! out=$(pnpm --filter @run-apparel/viewer exec wrangler pages project create run-apparel-viewer \
                       --production-branch main 2>&1); then
            if grep -qiE 'already (exists|in use)|8000007' <<<"$out"; then
              echo "Pages project already exists — continuing."
            else
              echo "$out" >&2
              exit 1
            fi
          fi

      - name: Deploy viewer (Cloudflare Pages)
        if: vars.VIEWER_DEPLOY_TARGET == 'pages'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm --filter @run-apparel/viewer exec wrangler pages deploy dist
          --project-name run-apparel-viewer --branch main

      - name: Deploy viewer (Cloudflare Worker, static assets)
        if: vars.VIEWER_DEPLOY_TARGET != 'pages'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The Pages-style dist/_redirects ("/* /index.html 200") is rejected by
        # Workers Static Assets as an infinite-loop rule (code 100324). On the
        # Worker, SPA fallback is provided by not_found_handling:
        # single-page-application in apps/viewer/wrangler.jsonc, so _redirects is
        # redundant here — remove it before deploying. dist/_headers (CSP) stays.
        # Only runs when target=worker, so the Pages deploy path is unaffected.
        run: |
          rm -f apps/viewer/dist/_redirects
          # See the version-labelling note on the CMS deploy step above.
          pnpm --filter @run-apparel/viewer exec wrangler deploy \
            --message "${GITHUB_SHA:0:7} ${GITHUB_REF_NAME}"

      # ⚠️ 403/429/503 ARE INCONCLUSIVE, NEVER FAILURES — and this step did not know
      # that until 2026-08-30. `curl -fsS` makes any non-2xx a hard failure, which is
      # survivable only while VITE_API_BASE_URL points at a `*.workers.dev` host,
      # OUTSIDE the wear-run.help zone where free-plan Bot Fight Mode operates. The
      # moment the API moves onto cms.wear-run.help, one intermittent 403 from a
      # datacenter IP fails a deploy that succeeded — which is exactly the incident
      # that forced the first cutover to be rolled back within the hour.
      - name: Post-deploy health check
        env:
          HEALTH_URL: ${{ vars.VITE_API_BASE_URL || 'https://cms.wear-run.help' }}/api/health
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            --retry 5 --retry-delay 10 --retry-all-errors "$HEALTH_URL" || echo 000)
          case "$code" in
            2*) echo "health: $code" ;;
            403|429|503)
              echo "::warning::health returned $code — inconclusive (Bot Fight Mode), not a failed deploy"
              ;;
            *)
              echo "::error::health returned $code"
              exit 1
              ;;
          esac

      # /api/health returns {"ok":true} from a worker with an empty database, so
      # it proves the process is up and nothing about whether a buyer scanning a
      # QR tag sees a garment. This fetches the real viewer payload and resolves
      # the model URL by the same rule Stage.tsx uses, then fetches it. On
      # 2026-07-29 a broken model shipped and stayed live six days with every
      # automated check green, because nothing looked at the payload.
      - name: Post-deploy viewer payload smoke test
        # SMOKE_BROWSER_GET is set HERE and deliberately NOT in uptime.yml. It adds
        # a bare GET on the model — the check that would have caught the cached 404
        # of 2026-08-06, where HEAD returned 200 and a browser's GET returned 404
        # from a 25-hour-old cached miss. That fault is created at publish time, so
        # this is where it is worth one extra request; polling for it every 15
        # minutes would buy nothing. See check 4 in the script.
        env:
          SMOKE_BROWSER_GET: '1'
        # Loops EVERY live product since 2026-08-30. It ran only `rxps` before, so
        # the second live garment (`r-xmp`, X-MILO PRO BIB) was verified by nothing.
        # ⚠️ The list itself narrowed again on 2026-09-04 — nine garments were published
        # and scripts/live-products.mjs still named two, so this step gated 2 of 11.
        # Now eleven: 37 s measured, all green, and a fake twelfth row exits 1.
        run: node scripts/smoke-live-products.mjs "${{ vars.VITE_API_BASE_URL || 'https://cms.wear-run.help' }}"

      # The per-garment link preview is produced by an HTMLRewriter in
      # apps/viewer/worker/index.ts, and HTMLRewriter does not exist under vitest —
      # so the unit tests cover every decision and NOTHING covers the rewrite. This
      # is the only automated check that a shared link actually unfurls as the
      # garment it points at, and it includes a negative control asserting a plain
      # browser request is NOT rewritten. A 403/429 exits 0 as inconclusive: this
      # asks for a page with a crawler user-agent from a datacenter IP, which is
      # the most challengeable request shape there is.
      # ⚠️ Loops EVERY live product since 2026-09-04. It read DEFAULT_PRODUCT before, so
      # it checked ONE garment — and nine went live that day carrying 45 new preview
      # cards, verified once by hand and by nothing afterwards. Eleven products measured
      # at 9.5 s total (a card is 38 KB; crawler HTML is 0.68 s cold, 0.03 s warm), so
      # the coverage is nearly free. A fake twelfth row exits 1.
      - name: Post-deploy link-preview smoke test
        if: vars.VIEWER_DEPLOY_TARGET != 'pages'
        run: node scripts/smoke-live-previews.mjs https://viewer.wear-run.help

      - name: Post-deploy apex assertion (site, retired PDF paths, private hosts)
        run: node scripts/apex-probe.mjs

      # Strict after a deploy (2026-09-18): every host must now serve the shared security.txt,
      # and the www./cms. redirects must carry the headers their Cloudflare rule adds.
      - name: Post-deploy security.txt and redirect headers
        run: node scripts/public-security-probe.mjs

      # Put the rollback command where someone will actually be looking.
      #
      # docs/RUNBOOK.md → "Undoing a bad deploy" is the authority and is more complete
      # (in particular the ⚠️ about migrations already having been applied, which is
      # the part a hurried person gets wrong). But during an incident nobody opens a
      # 1,493-line runbook — they open the run that shipped the change. `if: always()`
      # so it is present on a FAILED deploy too, which is exactly when it is needed and
      # exactly when a summary written only on success would be absent.
      #
      # Runs unconditionally rather than only on failure so the SHA is recorded on
      # every deploy: rolling back needs to know what the previous good one was.
      - name: Deploy summary and rollback instructions
        if: always()
        env:
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Deployed \`${SHA}\`"
            echo
            echo "If this deploy is wrong, roll back the affected Worker:"
            echo
            echo '```bash'
            echo "npx wrangler@4.137.0 versions list --name run-apparel-viewer-site"
            echo "npx wrangler@4.137.0 rollback --name run-apparel-viewer-site -m 'why'"
            echo '```'
            echo
            echo "Workers: \`run-apparel-viewer-site\` (public viewer) · \`run-apparel-viewer-cms\` (admin + API) · \`run-apparel-viewer-shrink\` (processing only) · \`run-apparel-apex-404\` (apex catalogue + profile PDFs)"
            echo
            echo "⚠️ **D1 migrations already ran**, before the Workers deployed. A Worker"
            echo "rollback leaves today's schema underneath yesterday's code. That is safe"
            echo "only for additive (expand/contract) migrations — see"
            echo "\`docs/RUNBOOK.md\` → \"Undoing a bad deploy\" before rolling back the CMS."
            echo
            echo "Always follow a rollback with a \`git revert\`, or the next push to"
            echo "\`main\` silently redeploys this build on top of it."
          } >> "$GITHUB_STEP_SUMMARY"

      # ALERT ON A FAILED DEPLOY. Detection without notification is not a gate.
      #
      # The post-deploy checks above — health, payload smoke over every live
      # product, link preview, apex PDFs — could all fail and the only trace was a
      # red tick in the Actions tab. This repo has already paid for that shape once:
      # uptime.yml's alerting sat silently disabled for 17 days because nothing
      # exercised the path that only runs when things are broken.
      #
      # ⚠️ DELIBERATELY NOT AN AUTO-ROLLBACK. A payload-smoke failure is usually a
      # CMS or data fault, and rolling the VIEWER Worker back would not fix it —
      # while a CMS rollback after the migration above is the move `docs/RUNBOOK.md`
      # warns is most likely to turn a visible outage into a data problem. The
      # machine reports; the human decides. The summary step above already prints
      # the exact rollback commands.
      - name: Alert — a deploy step failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create deploy-failure --color b60205 \
            --description "A production deploy step failed" 2>/dev/null || true
          body=$(printf '%s\n' \
            "A step in the production deploy job failed for \`${SHA}\`." \
            "" \
            "**Read the run first — the failing step names what broke:**" \
            "${RUN_URL}" \
            "" \
            "If a POST-DEPLOY check failed, the artefacts are already live and the" \
            "rollback commands are in that run's summary. Do not roll the CMS back" \
            "without reading docs/RUNBOOK.md → \"Rollback does not undo a database" \
            "migration\" — migrations ran BEFORE the Workers deployed." \
            "" \
            "Reproduce the checks locally:" \
            "\`\`\`bash" \
            "node scripts/apex-probe.mjs" \
            "node scripts/smoke-live-products.mjs" \
            "node scripts/smoke-live-previews.mjs" \
            "\`\`\`")
          gh issue create --label deploy-failure \
            --title "Deploy failed: ${SHA}" --body "$body"
