name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm seed:assets
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter @run-apparel/viewer exec playwright install --with-deps chromium
      - name: e2e
        run: pnpm --filter @run-apparel/viewer test:e2e

  # Dependency vulnerability gate. Runs in parallel with verify and gates the
  # deploy: a HIGH/CRITICAL advisory blocks production until it is fixed or
  # explicitly allowlisted (with justification) in audit-ci.jsonc.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vulnerability audit (high/critical)
        run: pnpm exec audit-ci --config audit-ci.jsonc

  # Performance budget + a11y snapshot (Lighthouse CI) against the viewer served
  # with the same server-side mock the e2e suite uses. Informational: it does
  # NOT gate the deploy (a Chrome flake must never block a live release), but the
  # deterministic byte-weight budgets in lighthouserc.json fail the check on a
  # real regression so it surfaces on the PR. Make it a required check via branch
  # protection if you want it to block merges.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build viewer with the e2e mock origin
        run: node apps/viewer/e2e/prepare.mjs
      - name: Lighthouse CI
        run: pnpm exec lhci autorun

  deploy:
    needs: [verify, audit]
    # Enabled once Cloudflare secrets are configured (Phase 10):
    #   gh variable set DEPLOY_ENABLED --body true
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Production approval gate. Add required reviewers to the `production`
    # GitHub Environment (Settings → Environments) to make each deploy pause for
    # a human approval before it runs. Until reviewers are configured this is
    # just a label and does not block anything. See docs/RUNBOOK.md → deploy gate.
    environment:
      name: production
      url: https://viewer.wear-run.help
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm seed:assets

      # Gated migration step: apply any pending committed migrations to the
      # REMOTE production D1 *before* the new Worker is deployed. Replaces the
      # old cold-start `prodMigrations` path (which hung in production once). If
      # this fails the job stops here and the new Worker is never deployed, so
      # traffic keeps hitting the last-good version against the last-good schema.
      # Migrations should be additive (expand/contract) so the currently-running
      # Worker tolerates the new schema during the brief window before deploy.
      - name: Apply pending D1 migrations (gated, pre-deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: pnpm --filter @run-apparel/cms migrate:remote

      - name: Deploy CMS worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @run-apparel/cms run deploy

      - name: Apply worker secret (PAYLOAD_SECRET)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: printf '%s' "$PAYLOAD_SECRET" | pnpm --filter @run-apparel/cms exec wrangler secret put PAYLOAD_SECRET

      - name: Build viewer
        env:
          # Defaults to the clean custom domain; overridable via repo variable
          # (e.g. the CMS workers.dev URL to bypass zone-level Bot Fight Mode).
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://cms.wear-run.help' }}
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}
        run: pnpm --filter @run-apparel/viewer build

      # Viewer deploy target is selectable via the VIEWER_DEPLOY_TARGET repo
      # variable — set to "worker" since the 2026-07-22 cutover (the Worker
      # run-apparel-viewer-site serves viewer.wear-run.help; the old Pages
      # project was deleted). The two Pages steps below are KEPT as the rollback
      # path: setting VIEWER_DEPLOY_TARGET=pages makes them recreate the Pages
      # project and deploy to it — see docs/RUNBOOK.md → "Viewer: Pages → Worker
      # cutover".
      - name: Ensure Pages project exists
        if: vars.VIEWER_DEPLOY_TARGET != 'worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm --filter @run-apparel/viewer exec wrangler pages project create run-apparel-viewer
          --production-branch main 2>/dev/null || echo "Pages project already exists — continuing."

      - name: Deploy viewer (Cloudflare Pages)
        if: vars.VIEWER_DEPLOY_TARGET != 'worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm --filter @run-apparel/viewer exec wrangler pages deploy dist
          --project-name run-apparel-viewer --branch main

      - name: Deploy viewer (Cloudflare Worker, static assets)
        if: vars.VIEWER_DEPLOY_TARGET == 'worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The Pages-style dist/_redirects ("/* /index.html 200") is rejected by
        # Workers Static Assets as an infinite-loop rule (code 100324). On the
        # Worker, SPA fallback is provided by not_found_handling:
        # single-page-application in apps/viewer/wrangler.jsonc, so _redirects is
        # redundant here — remove it before deploying. dist/_headers (CSP) stays.
        # Only runs when target=worker, so the Pages deploy path is unaffected.
        run: |
          rm -f apps/viewer/dist/_redirects
          pnpm --filter @run-apparel/viewer exec wrangler deploy

      - name: Post-deploy health check
        run: >-
          curl -fsS --retry 5 --retry-delay 10
          "${{ vars.VITE_API_BASE_URL || 'https://cms.wear-run.help' }}/api/health"
