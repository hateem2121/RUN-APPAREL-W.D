version: 2
# QUIET MODE: routine version-update PRs are turned OFF
# (open-pull-requests-limit: 0) so the branch list stays clean. Dependabot still
# opens a PR automatically when a real SECURITY vulnerability is found — those
# are rare and worth seeing. Day-to-day vulnerability protection also runs on
# every change via the audit-ci gate in .github/workflows/ci.yml.
#
# To re-enable routine updates later, raise the limits below (e.g. 5-10); the
# grouping/ignore rules are kept ready for that.
updates:
  # Application + tooling dependencies (pnpm workspace, npm ecosystem).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 0 = no routine version-update PRs (security-update PRs still open).
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # TypeScript: block MAJOR bumps. All five workspaces are on 7.0.2 since
    # 2026-08-12 (the CMS's Next-16 pin to TS 6 was resolved by Next 16.3.0);
    # this rule now exists so nothing crosses to TS 8 without a deliberate build.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # GitHub Actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 0 = no routine update PRs (security advisories for actions still open).
    open-pull-requests-limit: 0
