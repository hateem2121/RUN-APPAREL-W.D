version: 2
# WEEKLY UPDATE PULL REQUESTS since 2026-10-03 (owner decision: "everything set to
# auto-update to the latest version"). Until then npm ran in QUIET MODE
# (open-pull-requests-limit: 0) and only security advisories opened a PR; those still open
# on their own, and audit-ci still blocks high/critical advisories on every change.
# Every Monday, after a 7-day cooldown, the npm block below opens:
#   - ONE grouped PR with every minor and patch update that can move on its own;
#   - ONE grouped PR for the packages that cannot (`needs-hand-sync`, below) — CI fails it
#     until a session finishes the by-hand step, by design;
#   - one PR per MAJOR update outside that group, because majors are the ones that need
#     code changes, and one broken major must not hold back the others.
# ci.yml's gates test each PR before the owner merges it.
updates:
  # Application + tooling dependencies (pnpm workspace, npm ecosystem).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # The two groups + up to two separate major updates at a time.
    open-pull-requests-limit: 4
    # Version updates wait 7 days after a release (zizmor's dependabot-cooldown,
    # 2026-09-29; the same wait the actions below get). GitHub's options reference says
    # cooldown "does not apply to security updates". pnpm's own minimumReleaseAge
    # (pnpm-workspace.yaml) still applies to every install.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
        # The same list as `needs-hand-sync` below, written out twice on purpose: YAML
        # anchors would avoid that, but GitHub's Dependabot reference does not say its
        # parser accepts them. Change both lists together.
        exclude-patterns:
          # tools/asset-pipeline declares these, and it keeps a SECOND, npm lockfile that
          # only Docker reads. A pnpm-side bump leaves it out of sync, and
          # scripts/check-lockfile-sync.mjs fails the PR (the image build died on `npm ci`
          # on 2026-08-12 for exactly this). Regenerating it is the procedure in
          # tools/asset-pipeline/CLAUDE.md.
          - "@gltf-transform/*"
          - "@types/node"
          - "@vitest/coverage-v8"
          - "draco3dgltf"
          - "gltf-validator"
          - "ktx2-encoder"
          - "meshoptimizer"
          - "sharp"
          - "tsx"
          - "typescript"
          - "vite"
          - "vitest"
          # ci.yml's Playwright container tag must equal this version
          # (apps/cms/src/workflowHardening.test.ts), so the tag and its digest move with it.
          - "@playwright/test"
          # HELD for apps/shrink only (docs/DEPENDENCY-HOLDS.md): newer releases break that
          # package's typecheck; apps/cms and apps/viewer may move.
          - "@cloudflare/workers-types"
          # The RUNBOOK's pasted outage commands pin the installed version
          # (apps/cms/src/runbookCommands.test.ts), and a person re-checks their flags
          # before moving them: Dependabot's 4.141.0 bump failed for exactly this (2026-10-03).
          - "wrangler"
      # Packages CI cannot move on its own (the reasons are beside the list above): one PR
      # a week that fails until a session finishes the by-hand step.
      needs-hand-sync:
        patterns:
          - "@gltf-transform/*"
          - "@types/node"
          - "@vitest/coverage-v8"
          - "draco3dgltf"
          - "gltf-validator"
          - "ktx2-encoder"
          - "meshoptimizer"
          - "sharp"
          - "tsx"
          - "typescript"
          - "vite"
          - "vitest"
          - "@playwright/test"
          - "@cloudflare/workers-types"
          - "wrangler"
    ignore:
      # TypeScript: block MAJOR bumps. All five workspaces are on 7.0.2 since
      # 2026-08-12 (the CMS's Next-16 pin to TS 6 was resolved by Next 16.3.0);
      # this rule now exists so nothing crosses to TS 8 without a deliberate build.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # PATCHED (pnpm-workspace.yaml patchedDependencies): any other version fails the
      # install with ERR_PNPM_UNUSED_PATCH, so Dependabot could not even build the PR.
      # docs/DEPENDENCY-HOLDS.md says when to drop the patch.
      - dependency-name: "@google/model-viewer"
      # Held by other packages' own ranges (docs/DEPENDENCY-HOLDS.md, 2026-09-26):
      # model-viewer 4.3.1 declares three ^0.183.0, and payload 3.90.2 declares
      # graphql ^16.8.1. Release each when that range widens.
      - dependency-name: three
      - dependency-name: graphql
        update-types:
          - version-update:semver-major

  # The shrink container's base image (apps/shrink/Dockerfile), since 2026-10-03 (owner
  # decision, told that CI does not render garments inside this image). The pin is a
  # digest because sharp links against the image's system libraries; a digest bump
  # carries operating-system security fixes, and apps/cms/src/baseImageAge.test.ts still
  # turns CI red when the pin ages. 🟡 Before merging one of these, check a rendered
  # garment print: the printed artwork is the product.
  - package-ecosystem: docker
    directory: /apps/shrink
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    ignore:
      # Stay on Node 24, the runtime the whole project and CI use; only refresh it.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  # GitHub Actions — ONE update PR at a time, since 2026-09-10 (owner decision).
  #
  # This was 0 with the note "security advisories for actions still open", and that
  # half was never true here: every action is pinned to a full commit SHA, and
  # GitHub's secure-use guide says Dependabot "will not create alerts for actions
  # pinned to SHA values". So the pinned actions received neither alerts nor updates.
  #
  # THE OWNER'S 7-DAY WAIT IS A SETTING SINCE 2026-09-29. On 2026-09-10 the Dependabot
  # options reference did not list `github-actions` among the ecosystems supporting
  # `cooldown`, so the wait was a manual check. Re-read 2026-09-29, it does ("GitHub
  # Actions" is in the list), and zizmor's dependabot-cooldown audit asked for it. Still
  # check by hand that nothing has been reported against a release before merging.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
