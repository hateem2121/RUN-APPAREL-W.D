version: 2
# QUIET MODE for npm: routine version-update PRs are OFF
# (open-pull-requests-limit: 0) so the branch list stays clean. Dependabot still
# opens a PR automatically when a real SECURITY vulnerability is found in an npm
# dependency — those are rare and worth seeing. Day-to-day vulnerability protection
# also runs on every change via the audit-ci gate in .github/workflows/ci.yml.
#
# To re-enable routine npm updates later, raise that limit (e.g. 5-10); the
# grouping/ignore rules are kept ready for that.
updates:
  # Application + tooling dependencies (pnpm workspace, npm ecosystem).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 0 = no routine version-update PRs (security-update PRs still open).
    open-pull-requests-limit: 0
    # Inert while the limit above is 0 — cooldown governs VERSION updates only, and
    # GitHub's options reference says it "does not apply to security updates". Set so
    # that re-enabling routine updates cannot skip the same 7-day wait the actions below
    # get (zizmor's dependabot-cooldown, 2026-09-29). pnpm's own minimumReleaseAge
    # (pnpm-workspace.yaml) still applies to every install.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # TypeScript: block MAJOR bumps. All five workspaces are on 7.0.2 since
    # 2026-08-12 (the CMS's Next-16 pin to TS 6 was resolved by Next 16.3.0);
    # this rule now exists so nothing crosses to TS 8 without a deliberate build.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # GitHub Actions — ONE update PR at a time, since 2026-09-10 (owner decision).
  #
  # This was 0 with the note "security advisories for actions still open", and that
  # half was never true here: every action is pinned to a full commit SHA, and
  # GitHub's secure-use guide says Dependabot "will not create alerts for actions
  # pinned to SHA values". So the pinned actions received neither alerts nor updates.
  #
  # THE OWNER'S 7-DAY WAIT IS A SETTING SINCE 2026-09-29. On 2026-09-10 the Dependabot
  # options reference did not list `github-actions` among the ecosystems supporting
  # `cooldown`, so the wait was a manual check. Re-read 2026-09-29, it does ("GitHub
  # Actions" is in the list), and zizmor's dependabot-cooldown audit asked for it. Still
  # check by hand that nothing has been reported against a release before merging.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
