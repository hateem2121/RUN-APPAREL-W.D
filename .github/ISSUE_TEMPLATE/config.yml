# Forms added 2026-09-26 by the owner's decision, reversing the 2026-08-30 'links only'
# choice; robots still open issues with gh and bypass forms.
#
# The three forms (1-site-broken, 2-garment-looks-wrong, 3-question) each open with the
# private security link, and the security contact link stays FIRST below, so nobody is
# led to report a vulnerability in public. Blank issues stay enabled: the robots
# (`outage` from uptime.yml, `monitoring` from heartbeat.yml) use `gh issue create`.
blank_issues_enabled: true

contact_links:
  - name: Security vulnerability — do NOT open an issue
    url: https://github.com/hateem2121/RUN-APPAREL-W.D/security/policy
    about: Report privately. SECURITY.md explains the process and the response times.

  - name: Something is broken on the live site
    url: https://github.com/hateem2121/RUN-APPAREL-W.D/blob/main/docs/RUNBOOK.md
    about: "Rollback, migrations, secrets and the cached-404 trap. Run `node scripts/apex-probe.mjs` and `node scripts/smoke-live-products.mjs` first — they say what is actually failing."

  - name: A garment looks wrong (artwork, colour, missing model)
    url: https://github.com/hateem2121/RUN-APPAREL-W.D/blob/main/docs/OPEN-ISSUE-ARTWORK.md
    about: "Printed artwork, colour naming and the pipeline settings that damage them. Include the product slug and colourway — both are printed on physical QR tags."

  - name: How do I upload a garment?
    url: https://github.com/hateem2121/RUN-APPAREL-W.D/blob/main/docs/FIRST-GARMENT-UPLOAD.md
    about: Plain-English walkthrough, no command line.
